[package]
name = "herdr-sshd-lookup"
version = "0.0.0"
edition = "2021"
description = "Setgid systemd-journal helper: the accepted SSH key of one sshd login (smarty-dev#2636)"
license = "Apache-2.0"
repository = "https://github.com/herdrdev/herdr"
publish = false

# ponytail: two small, already-locked dependencies. The helper runs with the
# systemd-journal group, so it links nothing else.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
serde_json = "1"
