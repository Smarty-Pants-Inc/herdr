name: smarty-ci

on:
  pull_request:
    branches:
      - master
      - landing/execution-locality-base-cd0e0235
  push:
    branches:
      - master
      - landing/execution-locality-base-cd0e0235
      - mergify/merge-queue/**
      - tmp-mergify/merge-queue/**

permissions:
  contents: read

concurrency:
  group: smarty-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smarty-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: 1.96.1
          components: rustfmt,clippy
      - name: Install Rust tools
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2.81.9
        with:
          tool: just,cargo-nextest
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
      - name: Run aggregate checks
        run: just ci 'all()'
