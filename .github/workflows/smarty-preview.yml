            --asset-dir release-assets \
            --repo Smarty-Pants-Inc/herdr \
            --tag "$TAG" \
            --build-id "$BUILD_ID" \
            --built-at "$BUILT_AT" \
            --parent-repo Smarty-Pants-Inc/smarty-dev \
            --parent-commit "$EXPECTED_PARENT" \
            --parent-tree "$PARENT_TREE" \
            --herdr-commit "$EXPECTED_SOURCE" \
            --herdr-tree "$SOURCE_TREE" \
            --base-version "$BASE_VERSION" \
            --protocol "$PROTOCOL" \
            --omp-source herdr-source/.github/smarty-omp-source.json \
            --herdr-root herdr-source \
            --omp-root omp-source \
            --omp-rules-rust-toolchains metadata/omp-rules-rust-toolchains.json \
            --trusted-verifier handoff/trusted-release-verifier.py \
            --source-archive-dir source-archives \
            --omp-bazel-graph metadata/omp-bazel-graph.json \
            --cargo-metadata-dir metadata/cargo-metadata \
            --bun-version "$BUN_VERSION" \
            --zig-version "$ZIG_VERSION"

      - name: Upload exact pair manifest candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smarty-pair-candidate-${{ github.run_attempt }}
          path: |
            release-assets
            handoff
            source-archives
            metadata
          if-no-files-found: error
          compression-level: 0

