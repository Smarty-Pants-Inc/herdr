name: Smarty Preview

on:
  push:
    tags:
      - 'smarty-preview-*'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1
  BUN_VERSION: 1.3.14
  ZIG_VERSION: 0.15.2
  TRUSTED_RELEASE_VERIFIER_SHA256: 1c33a2994167663f82a636368f3d0b351f4b49cd1abd001c06336e5206dd9efb
  CHANNEL_RETAIN: 30

concurrency:
  group: smarty-preview-publish
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: smarty-release
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.release.outputs.should_build }}
      commit: ${{ steps.plan.outputs.commit }}
      source_tree: ${{ steps.plan.outputs.source_tree }}
      build_id: ${{ steps.plan.outputs.build_id }}
      tag: ${{ steps.plan.outputs.tag }}
      built_at: ${{ steps.plan.outputs.built_at }}
      base_version: ${{ steps.plan.outputs.base_version }}
      protocol: ${{ steps.plan.outputs.protocol }}
      parent_commit: ${{ steps.plan.outputs.parent_commit }}
      parent_tree: ${{ steps.plan.outputs.parent_tree }}
      omp_repository: ${{ steps.plan.outputs.omp_repository }}
      omp_commit: ${{ steps.plan.outputs.omp_commit }}
      omp_tree: ${{ steps.plan.outputs.omp_tree }}
      omp_version: ${{ steps.plan.outputs.omp_version }}
      omp_build_id: ${{ steps.plan.outputs.omp_build_id }}
      authorization_ref: ${{ steps.plan.outputs.authorization_ref }}
      authorization_state: ${{ steps.plan.outputs.authorization_state }}
      authorization_action: ${{ steps.plan.outputs.authorization_action }}
      channel_commit: ${{ steps.plan.outputs.channel_commit }}
      trusted_verifier_sha256: ${{ steps.archive.outputs.trusted_verifier_sha256 }}
      release_plan_sha256: ${{ steps.archive.outputs.release_plan_sha256 }}
      artifact_attempt: ${{ github.run_attempt }}
    steps:
      - name: Require release token
        shell: bash
        env:
          SMARTY_RELEASE_TOKEN: ${{ secrets.SMARTY_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${SMARTY_RELEASE_TOKEN:-}" || {
            echo "::error::SMARTY_RELEASE_TOKEN is required in the smarty-release environment"
            exit 1
          }
      - name: Parse immutable release tag
        id: trigger
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REPOSITORY: ${{ github.repository }}
          SMARTY_RELEASE_TOKEN: ${{ secrets.SMARTY_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          tag="$EVENT_REF_NAME"
          if [[ ! "$tag" =~ ^smarty-preview-([0-9]{4}-[0-9]{2}-[0-9]{2})-p([0-9a-f]{40})-r([0-9a-f]{40})-o([0-9a-f]{40})$ ]]; then
            echo "::error::Release tag is not an exact deterministic P/R/O identity"
            exit 1
          fi
          day="${BASH_REMATCH[1]}"
          parent="${BASH_REMATCH[2]}"
          source="${BASH_REMATCH[3]}"
          omp="${BASH_REMATCH[4]}"
          test "$EVENT_NAME" = push
          test "$EVENT_REF_TYPE" = tag
          test "$EVENT_REPOSITORY" = Smarty-Pants-Inc/herdr
          test "$EVENT_REF" = "refs/tags/$tag"
          test "$EVENT_SHA" = "$source"
          askpass="$RUNNER_TEMP/smarty-release-askpass-$$"
          umask 077
          cat > "$askpass" <<'SH'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$SMARTY_RELEASE_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 0700 "$askpass"
          trap 'rm -f "$askpass"' EXIT
          tag_ref="refs/tags/$tag"
          tag_lines="$(GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git \
            -c credential.helper= -c core.askPass="$askpass" ls-remote \
            "https://github.com/${EVENT_REPOSITORY}.git" "$tag_ref" "${tag_ref}^{}")"
          test "$tag_lines" = "$source"$'\t'"$tag_ref" || {
            echo "::error::Release tag must be one lightweight ref at R"
            exit 1
          }
          {
            echo "parent=$parent"
            echo "source=$source"
            echo "omp=$omp"
            echo "tag=$tag"
            echo "day=$day"
          } >> "$GITHUB_OUTPUT"
          {
            echo "EXPECTED_PARENT=$parent"
            echo "EXPECTED_SOURCE=$source"
            echo "EXPECTED_OMP=$omp"
          } >> "$GITHUB_ENV"

      - name: Checkout exact Herdr source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact private parent
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: Smarty-Pants-Inc/smarty-dev
          ref: ${{ steps.trigger.outputs.parent }}
          path: parent-source
          fetch-depth: 0
          token: ${{ secrets.SMARTY_RELEASE_TOKEN }}
          persist-credentials: false

      - name: Checkout exact OMP source for metadata
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: Smarty-Pants-Inc/oh-my-pi
          ref: ${{ steps.trigger.outputs.omp }}
          path: omp-source
          fetch-depth: 1
          token: ${{ secrets.SMARTY_RELEASE_TOKEN }}
          persist-credentials: false

      - name: Validate exact P/R/O candidate
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          EVENT_REF_TYPE: ${{ github.ref_type }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.trigger.outputs.tag }}
          SMARTY_RELEASE_TOKEN: ${{ secrets.SMARTY_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          for value in "$EXPECTED_PARENT" "$EXPECTED_SOURCE" "$EXPECTED_OMP"; do
            [[ "$value" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::Expected identities must be lowercase 40-hex commits"
              exit 1
            }
          done
          test "$EVENT_NAME" = push
          test "$EVENT_REF_TYPE" = tag
          test "$EVENT_REPOSITORY" = Smarty-Pants-Inc/herdr
          test "$EVENT_REF" = "refs/tags/$TAG"
          test "$EVENT_REF_NAME" = "$TAG"
          test "$EVENT_SHA" = "$EXPECTED_SOURCE"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test "$(git -C parent-source rev-parse HEAD)" = "$EXPECTED_PARENT"
          test "$(git -C omp-source rev-parse HEAD)" = "$EXPECTED_OMP"

          askpass="$RUNNER_TEMP/smarty-release-askpass-$$"
          umask 077
          cat > "$askpass" <<'SH'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$SMARTY_RELEASE_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 0700 "$askpass"
          trap 'rm -f "$askpass"' EXIT
          git_auth() {
            GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git \
              -c credential.helper= -c core.askPass="$askpass" "$@"
          }
          parent_remote="https://github.com/Smarty-Pants-Inc/smarty-dev.git"
          git_auth -C parent-source fetch --no-tags "$parent_remote" \
            '+refs/heads/main:refs/remotes/origin/main'
          git -C parent-source merge-base --is-ancestor "$EXPECTED_PARENT" refs/remotes/origin/main

          remote="https://github.com/${EVENT_REPOSITORY}.git"
          authorization_ref=refs/heads/smarty-preview-authorization
          channel_ref=refs/heads/smarty-channel
          authorization_line="$(git_auth ls-remote --exit-code "$remote" "$authorization_ref")"
          authorization_commit="${authorization_line%%$'\t'*}"
          test "$authorization_line" = "$authorization_commit"$'\t'"$authorization_ref" \
            && [[ "$authorization_commit" =~ ^[0-9a-f]{40}$ ]]
          git_auth fetch --no-tags "$remote" \
            "+$authorization_ref:refs/remotes/smarty/authorization"
          test "$(git rev-parse refs/remotes/smarty/authorization)" = "$authorization_commit"

          channel_line="$(git_auth ls-remote "$remote" "$channel_ref")"
          channel_commit=""
          if [ -n "$channel_line" ]; then
            channel_commit="${channel_line%%$'\t'*}"
            test "$channel_line" = "$channel_commit"$'\t'"$channel_ref" \
              && [[ "$channel_commit" =~ ^[0-9a-f]{40}$ ]]
            git_auth fetch --no-tags "$remote" \
              "+$channel_ref:refs/remotes/smarty/channel"
            test "$(git rev-parse refs/remotes/smarty/channel)" = "$channel_commit"
          fi
          rm -f "$askpass"
          trap - EXIT
          unset SMARTY_RELEASE_TOKEN

          env -i \
            PATH="$PATH" \
            HOME="$HOME" \
            GITHUB_OUTPUT="$GITHUB_OUTPUT" \
            EXPECTED_PARENT="$EXPECTED_PARENT" \
            EXPECTED_SOURCE="$EXPECTED_SOURCE" \
            EXPECTED_OMP="$EXPECTED_OMP" \
            AUTHORIZATION_COMMIT="$authorization_commit" \
            CHANNEL_COMMIT="$channel_commit" \
            TAG="$TAG" \
            python3 -I -S - <<'PY'
          import json
          import hashlib
          import os
          import re
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          expected_parent = os.environ["EXPECTED_PARENT"]
          expected_source = os.environ["EXPECTED_SOURCE"]
          expected_omp = os.environ["EXPECTED_OMP"]
          authorization_commit = os.environ["AUTHORIZATION_COMMIT"]
          channel_commit = os.environ["CHANNEL_COMMIT"]
          tag = os.environ["TAG"]

          def git(cwd: str, *args: str) -> str:
              return subprocess.check_output(["git", "-C", cwd, *args], text=True).strip()

          def fail(message: str) -> None:
              raise SystemExit(message)

          def gitlink(path: str) -> str:
              line = git("parent-source", "ls-tree", "HEAD", "--", path)
              try:
                  metadata, name = line.split("\t", 1)
                  mode, kind, commit = metadata.split()
              except ValueError as error:
                  raise SystemExit(f"parent {path} is not an exact gitlink") from error
              if (mode, kind, name) != ("160000", "commit", path):
                  fail(f"parent {path} is not an exact gitlink")
              return commit

          if git("parent-source", "rev-parse", "HEAD") != expected_parent:
              fail("parent checkout does not match expected P")
          if git(".", "rev-parse", "HEAD") != expected_source:
              fail("Herdr checkout does not match expected R")
          source_time = datetime.fromisoformat(
              git(".", "show", "-s", "--format=%cI", "HEAD")
          )
          if source_time.tzinfo is None:
              fail("source commit time has no timezone")
          source_built_at = source_time.astimezone(timezone.utc).strftime(
              "%Y-%m-%dT%H:%M:%SZ"
          )
          build_id = f"{source_built_at[:10]}-p{expected_parent}-r{expected_source}-o{expected_omp}"
          if tag != f"smarty-preview-{build_id}":
              fail("tag day and identity do not match canonical UTC source time and P/R/O")
          if gitlink("repos/herdr") != expected_source:
              fail("parent P does not pin expected Herdr R")
          if gitlink("repos/omp") != expected_omp:
              fail("parent P does not pin expected OMP O")
          if git(".", "rev-parse", "refs/remotes/smarty/authorization") != authorization_commit:
              fail("authorization ref fetch does not match its remote observation")

          consumed_manifest: dict[str, object] | None = None
          lease_paths = git(".", "ls-tree", "-r", "--name-only", authorization_commit).splitlines()
          if lease_paths == [".smarty-preview-authorization.json"]:
              if git(".", "show", "-s", "--format=%P", authorization_commit):
                  fail("authorization lease must be an orphan commit")
              try:
                  lease = json.loads(
                      git(".", "show", f"{authorization_commit}:.smarty-preview-authorization.json")
                  )
              except json.JSONDecodeError as error:
                  raise SystemExit("authorization lease payload is invalid") from error
              if lease != {
                  "schema": 2,
                  "action": "windows-bootstrap-bridge",
                  "parent": expected_parent,
                  "source": expected_source,
                  "omp": expected_omp,
              }:
                  fail("authorization lease does not explicitly authorize the exact P/R/O Windows bridge")
              authorization_action = "windows-bootstrap-bridge"
              authorization_state = "lease"
          else:
              if channel_commit != authorization_commit:
                  fail("authorization ref is neither the exact P/R/O lease nor the observed channel commit")
              if git(".", "rev-parse", "refs/remotes/smarty/channel") != channel_commit:
                  fail("channel ref fetch does not match its remote observation")
              if lease_paths != ["install.sh", "preview.json"]:
                  fail("consumed authorization commit has unexpected channel files")
              channel_modes = {}
              for entry in git(".", "ls-tree", "-r", authorization_commit).splitlines():
                  metadata, name = entry.split("\t", 1)
                  mode, kind, _object = metadata.split()
                  channel_modes[name] = (mode, kind)
              if channel_modes != {
                  "install.sh": ("100755", "blob"),
                  "preview.json": ("100644", "blob"),
              }:
                  fail("consumed authorization commit has unexpected channel modes")
              installer = subprocess.check_output(
                  ["git", "-C", ".", "show", f"{channel_commit}:install.sh"]
              )
              if installer != Path("scripts/install-smarty.sh").read_bytes():
                  fail("consumed authorization commit has an unexpected installer")
              try:
                  channel_manifest = json.loads(
                      git(".", "show", f"{channel_commit}:preview.json")
                  )
              except json.JSONDecodeError as error:
                  raise SystemExit("consumed authorization manifest is invalid") from error
              top_keys = {
                  "assets", "base_version", "build_id", "builds", "built_at", "channel",
                  "commit", "notes", "omp", "protocol", "schema_version",
              }
              channel_builds = channel_manifest.get("builds") if isinstance(channel_manifest, dict) else None
              current = channel_builds.get(build_id) if isinstance(channel_builds, dict) else None
              if channel_manifest.get("schema_version") == 2:
                  alias = "bootstrap-" + hashlib.sha256(build_id.encode("ascii")).hexdigest()
                  bootstrap = channel_manifest.get("bootstrap")
                  windows = current.get("assets", {}).get("windows-x86_64") if isinstance(current, dict) else None
                  if (
                      set(channel_manifest) != top_keys | {"bootstrap", "canonical_build_id"}
                      or channel_manifest.get("channel") != "preview"
                      or channel_manifest.get("build_id") != alias
                      or channel_manifest.get("canonical_build_id") != build_id
                      or not isinstance(current, dict)
                      or current.get("commit") != expected_source
                      or current.get("tag") != tag
                      or channel_manifest.get("assets") != {"windows-x86_64": windows}
                      or any(
                          channel_manifest.get(key) != current.get(key)
                          for key in ("base_version", "built_at", "commit", "omp", "protocol")
                      )
                      or bootstrap != {
                          "schema": "smarty.windows-bootstrap.v1",
                          "paired_build_id": build_id,
                          "paired_tag": tag,
                          "paired_manifest": "preview.json",
                          "windows_asset_sha256": windows.get("sha256") if isinstance(windows, dict) else None,
                      }
                  ):
                      fail("consumed authorization bridge does not bind the exact current paired release")
                  consumed_manifest = {
                      **{key: channel_manifest[key] for key in top_keys},
                      "schema_version": 1,
                      "build_id": build_id,
                      "assets": current["assets"],
                  }
                  authorization_state = "consumed"
              elif channel_manifest.get("schema_version") == 1:
                  if (
                      set(channel_manifest) != top_keys
                      or channel_manifest.get("channel") != "preview"
                      or channel_manifest.get("build_id") != build_id
                      or channel_manifest.get("commit") != expected_source
                      or not isinstance(current, dict)
                      or current.get("commit") != expected_source
                      or current.get("tag") != tag
                      or any(
                          channel_manifest.get(key) != current.get(key)
                          for key in ("assets", "base_version", "built_at", "omp", "protocol")
                      )
                  ):
                      fail("canonical authorization commit does not bind the exact current paired release")
                  consumed_manifest = channel_manifest
                  authorization_state = "canonical"
              else:
                  fail("consumed authorization channel has an unsupported schema")
              if not re.fullmatch(
                  rf"\d{{4}}-\d{{2}}-\d{{2}}-p{expected_parent}-r{expected_source}-o{expected_omp}",
                  build_id,
              ):
                  fail("consumed authorization build ID does not bind exact P/R/O")
              authorization_action = "windows-bootstrap-bridge"

          try:
              parent_release = json.loads(
                  Path("parent-source/integrations/omp/release.json").read_text(encoding="utf-8")
              )
              descriptor = json.loads(
                  Path(".github/smarty-omp-source.json").read_text(encoding="utf-8")
              )
          except json.JSONDecodeError as error:
              raise SystemExit("paired OMP declaration is invalid JSON") from error
          if set(parent_release) != {"schema", "sourceRevision", "sourceTree", "version", "buildId"}:
              fail("parent OMP release declaration has unexpected fields")
          if set(descriptor) != {"repository", "commit", "tree", "version", "build_id"}:
              fail("Herdr OMP source descriptor has unexpected fields")
          if parent_release.get("schema") != 1:
              fail("parent OMP release declaration has the wrong schema")
          if descriptor.get("repository") != "Smarty-Pants-Inc/oh-my-pi":
              fail("Herdr OMP source descriptor has the wrong repository")
          expected_release = {
              "sourceRevision": descriptor.get("commit"),
              "sourceTree": descriptor.get("tree"),
              "version": descriptor.get("version"),
              "buildId": descriptor.get("build_id"),
          }
          if {key: parent_release.get(key) for key in expected_release} != expected_release:
              fail("parent OMP release declaration does not match Herdr's O descriptor")
          if descriptor.get("commit") != expected_omp:
              fail("Herdr OMP descriptor does not match expected O")
          if git("omp-source", "rev-parse", "HEAD") != expected_omp:
              fail("OMP checkout does not match expected O")
          if git("omp-source", "rev-parse", "HEAD^{tree}") != descriptor.get("tree"):
              fail("OMP checkout tree does not match descriptor")
          package = json.loads(
              Path("omp-source/packages/coding-agent/package.json").read_text(encoding="utf-8")
          )
          if package.get("version") != descriptor.get("version"):
              fail("OMP checkout version does not match descriptor")

          cargo = Path("Cargo.toml").read_text(encoding="utf-8")
          protocol_source = Path("src/protocol/wire.rs").read_text(encoding="utf-8")
          versions = re.findall(r'^version = "([^"\r\n]+)"$', cargo, re.MULTILINE)
          protocols = re.findall(r"pub const PROTOCOL_VERSION: u32 = (\d+);", protocol_source)
          if len(versions) != 1 or len(protocols) != 1:
              fail("source has no unique version or protocol identity")
          source_protocol = int(protocols[0])
          if authorization_state in {"consumed", "canonical"}:
              if consumed_manifest is None:
                  fail("consumed authorization has no manifest")

              def asset(value: object, name: str, zipped: bool = False) -> bool:
                  if not isinstance(value, dict):
                      return False
                  expected_keys = {"sha256", "url"} | ({"format"} if zipped else set())
                  return (
                      set(value) == expected_keys
                      and value.get("url")
                      == f"https://github.com/Smarty-Pants-Inc/herdr/releases/download/{tag}/{name}"
                      and isinstance(value.get("sha256"), str)
                      and re.fullmatch(r"[0-9a-f]{64}", value["sha256"]) is not None
                      and (not zipped or value.get("format") == "zip")
                  )

              def herdr_assets(value: object) -> bool:
                  return isinstance(value, dict) and set(value) == {
                      "linux-x86_64", "linux-aarch64", "macos-x86_64", "macos-aarch64", "windows-x86_64",
                  } and all((
                      asset(value["linux-x86_64"], "herdr-linux-x86_64"),
                      asset(value["linux-aarch64"], "herdr-linux-aarch64"),
                      asset(value["macos-x86_64"], "herdr-macos-x86_64"),
                      asset(value["macos-aarch64"], "herdr-macos-aarch64"),
                      asset(value["windows-x86_64"], "herdr-windows-x86_64.zip", True),
                  ))

              def omp_assets(value: object) -> bool:
                  return isinstance(value, dict) and set(value) == {
                      "linux-x86_64", "linux-aarch64", "macos-x86_64", "macos-aarch64",
                  } and all((
                      asset(value["linux-x86_64"], "omp-linux-x86_64"),
                      asset(value["linux-aarch64"], "omp-linux-aarch64"),
                      asset(value["macos-x86_64"], "omp-macos-x86_64"),
                      asset(value["macos-aarch64"], "omp-macos-aarch64"),
                  ))

              def omp_identity(value: object) -> bool:
                  return isinstance(value, dict) and set(value) == {
                      "assets", "build_id", "commit", "tree", "version",
                  } and value.get("build_id") == descriptor["build_id"] and value.get("commit") == expected_omp \
                      and value.get("tree") == descriptor["tree"] and value.get("version") == descriptor["version"] \
                      and omp_assets(value.get("assets"))

              builds = consumed_manifest.get("builds")
              current = builds.get(build_id) if isinstance(builds, dict) else None
              if (
                  consumed_manifest.get("base_version") != versions[0]
                  or consumed_manifest.get("built_at") != source_built_at
                  or consumed_manifest.get("protocol") != source_protocol
                  or not isinstance(consumed_manifest.get("notes"), str)
                  or not herdr_assets(consumed_manifest.get("assets"))
                  or not omp_identity(consumed_manifest.get("omp"))
                  or not isinstance(current, dict)
                  or set(current)
                  != {"assets", "base_version", "built_at", "commit", "omp", "protocol", "tag"}
                  or current.get("commit") != expected_source
                  or current.get("tag") != tag
                  or any(
                      consumed_manifest.get(key) != current.get(key)
                      for key in ("assets", "base_version", "built_at", "omp", "protocol")
                  )
              ):
                  fail("consumed authorization manifest is not the exact current paired P/R/O/tag")
          outputs = {
              "commit": expected_source,
              "source_tree": git(".", "rev-parse", "HEAD^{tree}"),
              "parent_commit": expected_parent,
              "parent_tree": git("parent-source", "rev-parse", "HEAD^{tree}"),
              "omp_repository": descriptor["repository"],
              "omp_commit": descriptor["commit"],
              "omp_tree": descriptor["tree"],
              "omp_version": descriptor["version"],
              "omp_build_id": descriptor["build_id"],
              "authorization_ref": authorization_commit,
              "authorization_state": authorization_state,
              "authorization_action": authorization_action,
              "channel_commit": channel_commit,
              "build_id": build_id,
              "tag": tag,
              "built_at": source_built_at,
              "base_version": versions[0],
              "protocol": protocols[0],
          }
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              for key, value in outputs.items():
                  output.write(f"{key}={value}\n")
          PY
          rm -rf parent-source

      - name: Archive validated source inputs
        id: archive
        shell: /bin/bash
        env:
          PLAN_PARENT: ${{ steps.plan.outputs.parent_commit }}
          PLAN_PARENT_TREE: ${{ steps.plan.outputs.parent_tree }}
          PLAN_SOURCE: ${{ steps.plan.outputs.commit }}
          PLAN_SOURCE_TREE: ${{ steps.plan.outputs.source_tree }}
          PLAN_OMP: ${{ steps.plan.outputs.omp_commit }}
          PLAN_OMP_TREE: ${{ steps.plan.outputs.omp_tree }}
          PLAN_OMP_REPOSITORY: ${{ steps.plan.outputs.omp_repository }}
          PLAN_OMP_VERSION: ${{ steps.plan.outputs.omp_version }}
          PLAN_OMP_BUILD_ID: ${{ steps.plan.outputs.omp_build_id }}
          PLAN_TAG: ${{ steps.plan.outputs.tag }}
          PLAN_BUILD_ID: ${{ steps.plan.outputs.build_id }}
          PLAN_BUILT_AT: ${{ steps.plan.outputs.built_at }}
          PLAN_BASE_VERSION: ${{ steps.plan.outputs.base_version }}
          PLAN_PROTOCOL: ${{ steps.plan.outputs.protocol }}
          PLAN_AUTHORIZATION_REF: ${{ steps.plan.outputs.authorization_ref }}
          PLAN_AUTHORIZATION_STATE: ${{ steps.plan.outputs.authorization_state }}
          PLAN_AUTHORIZATION_ACTION: ${{ steps.plan.outputs.authorization_action }}
          PLAN_CHANNEL: ${{ steps.plan.outputs.channel_commit }}
        run: |
          set -euo pipefail
          /bin/rm -rf handoff source-archives
          /bin/mkdir -p handoff/channel-snapshot handoff/source-archives source-archives
          /usr/bin/git archive --format=tar --output=source-archives/herdr-source.tar "$PLAN_SOURCE"
          /usr/bin/git -C omp-source archive --format=tar --output="$GITHUB_WORKSPACE/source-archives/omp-source.tar" "$PLAN_OMP"
          test "$(/usr/bin/sha256sum scripts/preview.py | /usr/bin/cut -d' ' -f1)" = "$TRUSTED_RELEASE_VERIFIER_SHA256"
          /bin/cp scripts/preview.py handoff/trusted-release-verifier.py
          /bin/cp source-archives/herdr-source.tar source-archives/omp-source.tar handoff/source-archives/
          /bin/cp scripts/install-smarty.sh handoff/install-smarty.sh
          if [ -n "$PLAN_CHANNEL" ]; then
            [[ "$PLAN_CHANNEL" =~ ^[0-9a-f]{40}$ ]]
            channel_tree="$(/usr/bin/git ls-tree -r "$PLAN_CHANNEL")"
            if [ "$(/usr/bin/printf '%s\n' "$channel_tree" | /usr/bin/cut -f2 | /usr/bin/sort)" != $'install.sh\npreview.json' ]; then
              echo "::error::Authenticated channel snapshot has unexpected files"
              exit 1
            fi
            while IFS=$'\t' read -r metadata name; do
              mode="${metadata%% *}"
              kind="${metadata#* }"
              kind="${kind%% *}"
              test "$kind" = blob
              case "$name:$mode" in
                install.sh:100755|preview.json:100644) ;;
                *) echo "::error::Authenticated channel snapshot has an unexpected file mode"; exit 1 ;;
              esac
            done <<< "$channel_tree"
            /usr/bin/git show "$PLAN_CHANNEL:preview.json" > handoff/channel-snapshot/preview.json
            /usr/bin/git show "$PLAN_CHANNEL:install.sh" > handoff/channel-snapshot/install.sh
          fi
          /usr/bin/python3 -I -S - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          fields = {
              "parent_commit": os.environ["PLAN_PARENT"],
              "parent_tree": os.environ["PLAN_PARENT_TREE"],
              "source_commit": os.environ["PLAN_SOURCE"],
              "source_tree": os.environ["PLAN_SOURCE_TREE"],
              "omp_commit": os.environ["PLAN_OMP"],
              "omp_tree": os.environ["PLAN_OMP_TREE"],
              "omp_repository": os.environ["PLAN_OMP_REPOSITORY"],
              "omp_version": os.environ["PLAN_OMP_VERSION"],
              "omp_build_id": os.environ["PLAN_OMP_BUILD_ID"],
              "tag": os.environ["PLAN_TAG"],
              "build_id": os.environ["PLAN_BUILD_ID"],
              "built_at": os.environ["PLAN_BUILT_AT"],
              "base_version": os.environ["PLAN_BASE_VERSION"],
              "protocol": int(os.environ["PLAN_PROTOCOL"]),
              "authorization_ref": os.environ["PLAN_AUTHORIZATION_REF"],
              "authorization_state": os.environ["PLAN_AUTHORIZATION_STATE"],
              "authorization_action": os.environ["PLAN_AUTHORIZATION_ACTION"],
          }
          for key in ("parent_commit", "parent_tree", "source_commit", "source_tree", "omp_commit", "omp_tree", "authorization_ref"):
              if re.fullmatch(r"[0-9a-f]{40}", fields[key]) is None:
                  raise SystemExit(f"invalid release plan field: {key}")
          if fields["omp_repository"] != "Smarty-Pants-Inc/oh-my-pi":
              raise SystemExit("invalid OMP repository in release plan")
          if fields["authorization_state"] not in {"lease", "consumed", "canonical"}:
              raise SystemExit("invalid authorization state in release plan")
          if fields["authorization_action"] != "windows-bootstrap-bridge":
              raise SystemExit("invalid authorization action in release plan")
          if fields["protocol"] < 1:
              raise SystemExit("invalid protocol in release plan")
          for value in fields.values():
              if isinstance(value, str) and (not value or "\n" in value or "\r" in value):
                  raise SystemExit("release plan contains a non-scalar value")

          def record(path: str) -> dict[str, object]:
              data = Path(path).read_bytes()
              return {"length": len(data), "sha256": hashlib.sha256(data).hexdigest()}

          fields["source_archives"] = {
              "herdr-source.tar": record("source-archives/herdr-source.tar"),
              "omp-source.tar": record("source-archives/omp-source.tar"),
          }
          fields["installer"] = record("handoff/install-smarty.sh")
          fields["trusted_verifier"] = record("handoff/trusted-release-verifier.py")
          snapshot_commit = os.environ["PLAN_CHANNEL"]
          if snapshot_commit:
              if re.fullmatch(r"[0-9a-f]{40}", snapshot_commit) is None:
                  raise SystemExit("invalid channel snapshot commit")
              snapshot_files = {
                  path.name: record(str(path))
                  for path in Path("handoff/channel-snapshot").iterdir()
                  if path.is_file()
              }
          else:
              snapshot_files = {}
          fields["channel_snapshot"] = {
              "commit": snapshot_commit,
              "files": snapshot_files,
          }
          Path("handoff/release-plan.json").write_text(
              json.dumps(fields, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          test "$(/usr/bin/sha256sum handoff/trusted-release-verifier.py | /usr/bin/cut -d' ' -f1)" = "$TRUSTED_RELEASE_VERIFIER_SHA256"
          echo "trusted_verifier_sha256=$TRUSTED_RELEASE_VERIFIER_SHA256" >> "$GITHUB_OUTPUT"
          echo "release_plan_sha256=$(/usr/bin/sha256sum handoff/release-plan.json | /usr/bin/cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Inspect immutable release reuse
        id: release
        shell: /bin/bash
        env:
          GH_TOKEN: ${{ secrets.SMARTY_RELEASE_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
          EXPECTED_SOURCE: ${{ steps.plan.outputs.commit }}
        run: |
          set -euo pipefail
          /usr/bin/gh api --paginate --slurp \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          /usr/bin/env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/trusted-home" \
            RUNNER_TEMP="$RUNNER_TEMP" TAG="$TAG" /usr/bin/python3 -I -S - <<'PY' > "$RUNNER_TEMP/release-state"
          import json
          import os
          from pathlib import Path

          pages = json.loads(Path(os.environ["RUNNER_TEMP"] + "/releases.json").read_text())
          releases = [release for page in pages for release in page]
          matches = [release for release in releases if release.get("tag_name") == os.environ["TAG"]]
          if len(matches) > 1:
              raise SystemExit("multiple releases have the deterministic preview tag")
          if not matches:
              print("absent\t\tfalse\tfalse\tfalse\t")
          else:
              release = matches[0]
              print(
                  "draft" if release.get("draft") else "published",
                  release.get("id", ""),
                  str(bool(release.get("draft"))).lower(),
                  str(bool(release.get("prerelease"))).lower(),
                  str(bool(release.get("immutable"))).lower(),
                  release.get("target_commitish", ""),
                  sep="\t",
              )
          PY
          IFS=$'\t' read -r state release_id draft prerelease immutable target < "$RUNNER_TEMP/release-state"
          askpass="$RUNNER_TEMP/smarty-release-askpass-$$"
          umask 077
          cat > "$askpass" <<'SH'
          #!/bin/bash
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          /bin/chmod 0700 "$askpass"
          trap '/bin/rm -f "$askpass"' EXIT
          tag_ref="refs/tags/$TAG"
          tag_lines="$(GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            /usr/bin/git -c credential.helper= -c core.askPass="$askpass" ls-remote \
            "https://github.com/${GITHUB_REPOSITORY}.git" "$tag_ref" "${tag_ref}^{}")"
          test "$tag_lines" = "$EXPECTED_SOURCE"$'\t'"$tag_ref" || {
            echo "::error::Tag $TAG is not one lightweight ref at expected source $EXPECTED_SOURCE"
            exit 1
          }
          case "$state" in
            absent)
              echo "should_build=true" >> "$GITHUB_OUTPUT"
              ;;
            draft)
              test "$draft" = true
              test "$prerelease" = true
              test "$immutable" = false
              test "$target" = "$EXPECTED_SOURCE"
              echo "should_build=true" >> "$GITHUB_OUTPUT"
              ;;
            published)
              test "$draft" = false
              test "$prerelease" = true
              test "$immutable" = true || {
                echo "::error::Published release $TAG is not immutable"
                exit 1
              }
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unknown release state $state"
              exit 1
              ;;
          esac
          /bin/rm -f "$askpass"
          trap - EXIT

      - name: Upload immutable release plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smarty-release-plan-${{ github.run_attempt }}
          path: handoff
          if-no-files-found: error
          compression-level: 0

      - name: Upload immutable candidate source archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smarty-candidate-sources-${{ github.run_attempt }}
          path: |
            source-archives/herdr-source.tar
            source-archives/omp-source.tar
          if-no-files-found: error
          compression-level: 0

  candidate-checks:
    needs: preflight
    if: needs.preflight.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Download immutable release plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: smarty-release-plan-${{ needs.preflight.outputs.artifact_attempt }}
          path: handoff

      - name: Download immutable candidate source archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: smarty-candidate-sources-${{ needs.preflight.outputs.artifact_attempt }}
          path: source-archives

      - name: Verify and unpack candidate sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          plan = json.loads(Path("handoff/release-plan.json").read_text(encoding="utf-8"))
          for name, expected in plan["source_archives"].items():
              path = Path("source-archives") / name
              data = path.read_bytes()
              if len(data) != expected["length"] or hashlib.sha256(data).hexdigest() != expected["sha256"]:
                  raise SystemExit(f"candidate source archive digest mismatch: {name}")
          PY
          mkdir herdr-source omp-source
          tar -xf source-archives/herdr-source.tar -C herdr-source
          tar -xf source-archives/omp-source.tar -C omp-source

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          components: rustfmt

      - name: Install Rust test tools
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2.81.9
        with:
          tool: just,cargo-nextest

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Run candidate release checks
        working-directory: herdr-source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          just test

  build:
    needs: [preflight, candidate-checks]
    if: needs.preflight.outputs.should_build == 'true'
    permissions: {}
    outputs:
      candidate_linux_x86_64_attempt: ${{ steps.candidate-artifact.outputs.candidate_linux_x86_64_attempt }}
      candidate_linux_aarch64_attempt: ${{ steps.candidate-artifact.outputs.candidate_linux_aarch64_attempt }}
      candidate_macos_x86_64_attempt: ${{ steps.candidate-artifact.outputs.candidate_macos_x86_64_attempt }}
      candidate_macos_aarch64_attempt: ${{ steps.candidate-artifact.outputs.candidate_macos_aarch64_attempt }}
      candidate_windows_x86_64_attempt: ${{ steps.candidate-artifact.outputs.candidate_windows_x86_64_attempt }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            platform: linux-x86_64
            herdr_asset: herdr-linux-x86_64
            omp_target: linux-x64
            omp_native_targets: linux-x64-baseline linux-x64-modern
            omp_native_assets: pi_natives.linux-x64-baseline.node pi_natives.linux-x64-modern.node
            native_labels: //:natives-linux-x64-baseline //:natives-linux-x64-modern
            omp_asset: omp-linux-x86_64
            report: omp-rules-rust-linux-x86_64.json
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            platform: linux-aarch64
            herdr_asset: herdr-linux-aarch64
            omp_target: linux-arm64
            omp_native_targets: linux-arm64
            omp_native_assets: pi_natives.linux-arm64.node
            native_labels: //:natives-linux-arm64
            omp_asset: omp-linux-aarch64
            report: omp-rules-rust-linux-aarch64.json
          - target: x86_64-apple-darwin
            os: macos-15-intel
            platform: macos-x86_64
            herdr_asset: herdr-macos-x86_64
            omp_target: darwin-x64
            omp_native_targets: darwin-x64-baseline
            omp_native_assets: pi_natives.darwin-x64-baseline.node
            native_labels: //:natives-darwin-x64-baseline
            omp_asset: omp-macos-x86_64
            report: omp-rules-rust-macos-x86_64.json
          - target: aarch64-apple-darwin
            os: macos-14
            platform: macos-aarch64
            herdr_asset: herdr-macos-aarch64
            omp_target: darwin-arm64
            omp_native_targets: darwin-arm64
            omp_native_assets: pi_natives.darwin-arm64.node
            native_labels: //:natives-darwin-arm64
            omp_asset: omp-macos-aarch64
            report: omp-rules-rust-macos-aarch64.json
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: windows-x86_64
            herdr_asset: herdr-windows-x86_64.zip
            omp_target: ''
            omp_native_targets: ''
            omp_native_assets: ''
            native_labels: ''
            omp_asset: ''
            report: ''
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
      HERDR_ASSET: ${{ matrix.herdr_asset }}
      OMP_TARGET: ${{ matrix.omp_target }}
      OMP_NATIVE_TARGETS: ${{ matrix.omp_native_targets }}
      OMP_NATIVE_ASSETS: ${{ matrix.omp_native_assets }}
      NATIVE_LABELS: ${{ matrix.native_labels }}
      OMP_ASSET: ${{ matrix.omp_asset }}
      TOOLCHAIN_REPORT: ${{ matrix.report != '' && format('{0}/{1}', github.workspace, matrix.report) || '' }}
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
      LIBGHOSTTY_VT_SIMD: 'true'
      HERDR_BUILD_CHANNEL: preview
      HERDR_BUILD_ID: ${{ needs.preflight.outputs.build_id }}
      HERDR_BUILD_COMMIT: ${{ needs.preflight.outputs.commit }}
      HERDR_BUILD_UPDATE_MANIFEST_URL: https://raw.githubusercontent.com/Smarty-Pants-Inc/herdr/smarty-channel/preview.json
      HERDR_BUILD_OMP_BUILD_ID: ${{ matrix.omp_target != '' && needs.preflight.outputs.omp_build_id || '' }}
      HERDR_BUILD_OMP_COMMIT: ${{ matrix.omp_target != '' && needs.preflight.outputs.omp_commit || '' }}
      HERDR_BUILD_OMP_TREE: ${{ matrix.omp_target != '' && needs.preflight.outputs.omp_tree || '' }}
      HERDR_BUILD_OMP_VERSION: ${{ matrix.omp_target != '' && needs.preflight.outputs.omp_version || '' }}
      HERDR_BUILD_AUTO_UPDATE: 'true'
      CARGO_BAZEL_ISOLATED: '0'
    steps:
      - name: Download immutable release plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: smarty-release-plan-${{ needs.preflight.outputs.artifact_attempt }}
          path: handoff

      - name: Download immutable candidate source archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: smarty-candidate-sources-${{ needs.preflight.outputs.artifact_attempt }}
          path: source-archives

      - name: Verify and unpack candidate sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          plan = json.loads(Path("handoff/release-plan.json").read_text(encoding="utf-8"))
          for name, expected in plan["source_archives"].items():
              path = Path("source-archives") / name
              data = path.read_bytes()
              if len(data) != expected["length"] or hashlib.sha256(data).hexdigest() != expected["sha256"]:
                  raise SystemExit(f"candidate source archive digest mismatch: {name}")
          PY
          mkdir herdr-source omp-source
          tar -xf source-archives/herdr-source.tar -C herdr-source
          tar -xf source-archives/omp-source.tar -C omp-source

      - name: Verify paired OMP source identity
        if: matrix.omp_target != ''
        shell: bash
        env:
          EXPECTED_OMP: ${{ needs.preflight.outputs.omp_commit }}
          EXPECTED_OMP_TREE: ${{ needs.preflight.outputs.omp_tree }}
          EXPECTED_OMP_VERSION: ${{ needs.preflight.outputs.omp_version }}
        run: |
          set -euo pipefail
          python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path

          plan = json.loads(Path("handoff/release-plan.json").read_text(encoding="utf-8"))
          package = json.loads(Path("omp-source/packages/coding-agent/package.json").read_text(encoding="utf-8"))
          if (
              plan["omp_commit"] != os.environ["EXPECTED_OMP"]
              or plan["omp_tree"] != os.environ["EXPECTED_OMP_TREE"]
              or package.get("version") != os.environ["EXPECTED_OMP_VERSION"]
          ):
              raise SystemExit("paired OMP source identity mismatch")
          PY

      - name: Install Bun for OMP
        if: matrix.omp_target != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Zig
        if: runner.os != 'macOS'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Restore Homebrew Zig cache
        if: runner.os == 'macOS'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: homebrew-zig-0.15-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            homebrew-zig-0.15-${{ runner.os }}-

      - name: Install patched Zig on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          HOMEBREW_NO_AUTO_UPDATE=1 brew install zig@0.15
          zig_prefix="$(brew --prefix zig@0.15)"
          echo "$zig_prefix/bin" >> "$GITHUB_PATH"
          test "$("$zig_prefix/bin/zig" version)" = "$ZIG_VERSION"

      - name: Prefer official Ubuntu mirrors over Azure
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt
          fi

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo find /etc/apt/sources.list.d -type f \( -iname '*microsoft*' -o -iname '*azure-cli*' \) -print -delete
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build musl-tools gcc-aarch64-linux-gnu crossbuild-essential-arm64

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja

      - name: Set Linux aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        shell: bash
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: herdr-source
          key: smarty-preview-${{ matrix.os }}-${{ matrix.target }}

      - name: Remove Zig caches
        if: runner.os != 'Windows'
        shell: bash
        run: rm -rf herdr-source/.zig-cache herdr-source/vendor/libghostty-vt/.zig-cache herdr-source/vendor/libghostty-vt/zig-out

      - name: Remove Zig caches on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force herdr-source\.zig-cache -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force herdr-source\vendor\libghostty-vt\.zig-cache -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force herdr-source\vendor\libghostty-vt\zig-out -ErrorAction SilentlyContinue

      - name: Build candidate Herdr binary
        working-directory: herdr-source
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target "$TARGET"

      - name: Build candidate OMP binary and capture Bazel 9.2 toolchain selection
        if: matrix.omp_target != ''
        working-directory: omp-source
        shell: bash
        env:
          OMP_BUILD_ID: ${{ needs.preflight.outputs.omp_build_id }}
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
          read -r -a native_targets <<< "$OMP_NATIVE_TARGETS"
          toolchain_log="$RUNNER_TEMP/rules-rust-toolchain.log"
          bun scripts/bazel-natives.ts "${native_targets[@]}" --dest packages/natives/native -- \
            --toolchain_resolution_debug='.*rules_rust.*' \
            2> >(tee "$toolchain_log" >&2)
          python3 -I -S "$GITHUB_WORKSPACE/herdr-source/scripts/preview.py" rules-rust-report \
            --log "$toolchain_log" \
            --platform "$PLATFORM" \
            --output "$TOOLCHAIN_REPORT"
          bun scripts/ci-release-build-binaries.ts --targets "$OMP_TARGET"

      - name: Package non-Windows candidate payloads
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cp "herdr-source/target/$TARGET/release/herdr" "$HERDR_ASSET"
          cp "omp-source/packages/coding-agent/binaries/omp-$OMP_TARGET" "$OMP_ASSET"
          for native in $OMP_NATIVE_ASSETS; do
            cp "omp-source/packages/natives/native/$native" "$native"
          done
          python3 -I -S - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          names = [os.environ["HERDR_ASSET"], os.environ["OMP_ASSET"]]
          names.extend(os.environ["OMP_NATIVE_ASSETS"].split())
          for name in names:
              path = Path(name)
              Path(f"{path}.sha256").write_text(
                  f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n", encoding="ascii"
              )
          PY

      - name: Verify candidate OMP build identity
        if: matrix.omp_target != ''
        shell: bash
        env:
          EXPECTED_OMP_BUILD_ID: ${{ needs.preflight.outputs.omp_build_id }}
          EXPECTED_OMP_VERSION: ${{ needs.preflight.outputs.omp_version }}
        run: |
          set -euo pipefail
          omp_binary="./$OMP_ASSET"
          test "$("$omp_binary" __build-id)" = "$EXPECTED_OMP_BUILD_ID"
          test "$("$omp_binary" --version)" = "omp/$EXPECTED_OMP_VERSION"
          "$omp_binary" --smoke-test

      - name: Package Windows candidate payload
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = Join-Path $env:RUNNER_TEMP "Microsoft.Windows.Console.ConPTY.nupkg"
          $stage = Join-Path $env:RUNNER_TEMP "herdr-windows-x86_64"
          $trustedHome = Join-Path $env:RUNNER_TEMP "trusted-packager-home"
          New-Item -ItemType Directory -Force -Path $trustedHome | Out-Null
          $git = (Get-Command git.exe -CommandType Application -ErrorAction Stop).Source
          $gitRoot = Split-Path (Split-Path $git -Parent) -Parent
          $envExe = Join-Path $gitRoot "usr\bin\env.exe"
          if (-not (Test-Path -LiteralPath $envExe -PathType Leaf)) {
            throw "Git env.exe is required for isolated Windows packaging"
          }
          $pwsh = (Get-Process -Id $PID).Path
          $script = (Resolve-Path .\herdr-source\scripts\package_windows_conpty.ps1).Path
          $herdrExe = (Resolve-Path "herdr-source\target\$env:TARGET\release\herdr.exe").Path
          $output = Join-Path (Get-Location) $env:HERDR_ASSET
          & $envExe -i `
            "PATH=$env:PATH" `
            "PATHEXT=$env:PATHEXT" `
            "SYSTEMROOT=$env:SYSTEMROOT" `
            "WINDIR=$env:WINDIR" `
            "PSModulePath=$env:PSModulePath" `
            "TEMP=$env:RUNNER_TEMP" `
            "TMP=$env:RUNNER_TEMP" `
            "HOME=$trustedHome" `
            "USERPROFILE=$trustedHome" `
            "DOTNET_CLI_HOME=$trustedHome" `
            "DOTNET_NOLOGO=1" `
            "DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1" `
            $pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $script `
              -HerdrExe $herdrExe `
              -PackagePath $package `
              -StageDir $stage `
              -OutputPath $output
          if ($LASTEXITCODE -ne 0) {
            throw "isolated Windows packaging failed with exit code $LASTEXITCODE"
          }
          $hash = (Get-FileHash -Algorithm SHA256 $env:HERDR_ASSET).Hash.ToLowerInvariant()
          "$hash  $env:HERDR_ASSET" | Out-File -Encoding ascii "$env:HERDR_ASSET.sha256"

      - name: Independently rebuild fixed native targets and toolchain report
        if: matrix.omp_target != ''
        shell: bash
        run: |
          set -euo pipefail
          rm -rf fixed-omp-source
          mkdir fixed-omp-source
          tar -xf source-archives/omp-source.tar -C fixed-omp-source
          cd fixed-omp-source
          bun install --frozen-lockfile
          bazel_tool="$(command -v bazelisk || command -v bazel)"
          test -n "$bazel_tool"
          read -r -a labels <<< "$NATIVE_LABELS"
          log="$RUNNER_TEMP/fixed-rules-rust.log"
          "$bazel_tool" --ignore_all_rc_files build --lockfile_mode=error \
            --toolchain_resolution_debug='.*rules_rust.*' -- "${labels[@]}" \
            2> >(tee "$log" >&2)
          python3 -I -S "$GITHUB_WORKSPACE/herdr-source/scripts/preview.py" rules-rust-report \
            --log "$log" --platform "$PLATFORM" --output "$RUNNER_TEMP/fixed-report.json"
          cmp "$RUNNER_TEMP/fixed-report.json" "$TOOLCHAIN_REPORT"
          query="${labels[0]}"
          for label in "${labels[@]:1}"; do query="$query + $label"; done
          "$bazel_tool" --ignore_all_rc_files cquery --lockfile_mode=error \
            --output=files "$query" > "$RUNNER_TEMP/native-files.txt"
          python3 -I -S - <<'PY'
          import os
          from pathlib import Path

          expected = set(os.environ["OMP_NATIVE_ASSETS"].split())
          outputs = {}
          for raw in Path(os.environ["RUNNER_TEMP"], "native-files.txt").read_text(encoding="utf-8").splitlines():
              path = Path(raw)
              if path.name in expected:
                  if path.name in outputs:
                      raise SystemExit(f"fixed Bazel verification repeated {path.name}")
                  outputs[path.name] = path
          if set(outputs) != expected:
              raise SystemExit("fixed Bazel verification output set mismatch")
          candidate = Path(os.environ["GITHUB_WORKSPACE"])
          for name, path in outputs.items():
              if path.read_bytes() != (candidate / name).read_bytes():
                  raise SystemExit(f"fixed Bazel native bytes mismatch: {name}")
          PY

      - name: Upload paired candidate payload
        if: matrix.omp_target != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-${{ matrix.platform }}-${{ github.run_attempt }}
          path: |
            ${{ matrix.herdr_asset }}
            ${{ matrix.herdr_asset }}.sha256
            ${{ matrix.omp_asset }}
            ${{ matrix.omp_asset }}.sha256
            ${{ matrix.report }}
            pi_natives.*.node
            pi_natives.*.node.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Upload Windows candidate payload
        if: matrix.omp_target == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-${{ matrix.platform }}-${{ github.run_attempt }}
          path: |
            ${{ matrix.herdr_asset }}
            ${{ matrix.herdr_asset }}.sha256
          if-no-files-found: error
          compression-level: 0
      - name: Record exact candidate artifact attempt
        id: candidate-artifact
        shell: bash
        run: |
          set -euo pipefail
          printf 'candidate_%s_attempt=%s\n' "${PLATFORM//-/_}" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"


  attest-platform:
    needs: [preflight, build]
    if: needs.preflight.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      attested_linux_x86_64_attempt: ${{ steps.attested-artifact.outputs.attested_linux_x86_64_attempt }}
      attested_linux_aarch64_attempt: ${{ steps.attested-artifact.outputs.attested_linux_aarch64_attempt }}
      attested_macos_x86_64_attempt: ${{ steps.attested-artifact.outputs.attested_macos_x86_64_attempt }}
      attested_macos_aarch64_attempt: ${{ steps.attested-artifact.outputs.attested_macos_aarch64_attempt }}
      attested_windows_x86_64_attempt: ${{ steps.attested-artifact.outputs.attested_windows_x86_64_attempt }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            artifact_attempt: ${{ needs.build.outputs.candidate_linux_x86_64_attempt }}
            herdr_asset: herdr-linux-x86_64
            omp_asset: omp-linux-x86_64
            native_assets: pi_natives.linux-x64-baseline.node pi_natives.linux-x64-modern.node
            report: omp-rules-rust-linux-x86_64.json
            provenance: smarty-provenance-linux-x86_64.sigstore.json
          - platform: linux-aarch64
            artifact_attempt: ${{ needs.build.outputs.candidate_linux_aarch64_attempt }}
            herdr_asset: herdr-linux-aarch64
            omp_asset: omp-linux-aarch64
            native_assets: pi_natives.linux-arm64.node
            report: omp-rules-rust-linux-aarch64.json
            provenance: smarty-provenance-linux-aarch64.sigstore.json
          - platform: macos-x86_64
            artifact_attempt: ${{ needs.build.outputs.candidate_macos_x86_64_attempt }}
            herdr_asset: herdr-macos-x86_64
            omp_asset: omp-macos-x86_64
            native_assets: pi_natives.darwin-x64-baseline.node
            report: omp-rules-rust-macos-x86_64.json
            provenance: smarty-provenance-macos-x86_64.sigstore.json
          - platform: macos-aarch64
            artifact_attempt: ${{ needs.build.outputs.candidate_macos_aarch64_attempt }}
            herdr_asset: herdr-macos-aarch64
            omp_asset: omp-macos-aarch64
            native_assets: pi_natives.darwin-arm64.node
            report: omp-rules-rust-macos-aarch64.json
            provenance: smarty-provenance-macos-aarch64.sigstore.json
          - platform: windows-x86_64
            artifact_attempt: ${{ needs.build.outputs.candidate_windows_x86_64_attempt }}
            herdr_asset: herdr-windows-x86_64.zip
            omp_asset: ''
            native_assets: ''
            report: ''
            provenance: smarty-provenance-windows-x86_64.sigstore.json
    steps:
      - name: Download exact candidate platform artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: candidate-${{ matrix.platform }}-${{ matrix.artifact_attempt }}
          path: payload

      - name: Verify exact platform files and digests
        shell: /bin/bash
        env:
          PLATFORM: ${{ matrix.platform }}
          HERDR_ASSET: ${{ matrix.herdr_asset }}
          OMP_ASSET: ${{ matrix.omp_asset }}
          TOOLCHAIN_REPORT: ${{ matrix.report }}
          NATIVE_ASSETS: ${{ matrix.native_assets }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -S - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          root = Path("payload")
          names = {os.environ["HERDR_ASSET"], f'{os.environ["HERDR_ASSET"]}.sha256'}
          native_assets = os.environ["NATIVE_ASSETS"].split()
          if os.environ["OMP_ASSET"]:
              names |= {os.environ["OMP_ASSET"], f'{os.environ["OMP_ASSET"]}.sha256', os.environ["TOOLCHAIN_REPORT"]}
              names |= set(native_assets) | {f"{name}.sha256" for name in native_assets}
          paths = list(root.iterdir())
          if {path.name for path in paths} != names or any(not path.is_file() or path.is_symlink() for path in paths):
              raise SystemExit("platform artifact has unexpected files")
          for asset in filter(None, (os.environ["HERDR_ASSET"], os.environ["OMP_ASSET"], *native_assets)):
              data = (root / asset).read_bytes()
              fields = (root / f"{asset}.sha256").read_text(encoding="ascii").split()
              if fields != [hashlib.sha256(data).hexdigest(), asset]:
                  raise SystemExit(f"platform checksum mismatch: {asset}")
          if os.environ["TOOLCHAIN_REPORT"]:
              report = json.loads((root / os.environ["TOOLCHAIN_REPORT"]).read_text(encoding="utf-8"))
              if report.get("schema") != 1 or report.get("platform") != os.environ["PLATFORM"]:
                  raise SystemExit("rules_rust report identity mismatch")
          subjects = Path("subjects")
          subjects.mkdir()
          subject_names = tuple(filter(None, (os.environ["HERDR_ASSET"], os.environ["OMP_ASSET"], *native_assets)))
          for asset in subject_names:
              shutil.copyfile(root / asset, subjects / asset)
          if {path.name for path in subjects.iterdir()} != set(subject_names):
              raise SystemExit("staged attestation subjects are not the exact platform payloads")
          PY

      - name: Attest exact platform payloads
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: subjects/*

      - name: Fix platform provenance bundle name
        shell: /bin/bash
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
          PROVENANCE_NAME: ${{ matrix.provenance }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -S - <<'PY'
          import os
          import shutil
          from pathlib import Path

          source = Path(os.environ["BUNDLE_PATH"])
          destination = Path("payload") / os.environ["PROVENANCE_NAME"]
          shutil.copyfile(source, destination)
          if not destination.is_file() or destination.stat().st_size == 0:
              raise SystemExit("platform provenance bundle is empty")
          PY

      - name: Upload exact paired attested platform artifact
        if: matrix.omp_asset != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: attested-${{ matrix.platform }}-${{ github.run_attempt }}
          path: |
            payload/${{ matrix.herdr_asset }}
            payload/${{ matrix.herdr_asset }}.sha256
            payload/${{ matrix.omp_asset }}
            payload/${{ matrix.omp_asset }}.sha256
            payload/${{ matrix.report }}
            payload/pi_natives.*.node
            payload/pi_natives.*.node.sha256
            payload/${{ matrix.provenance }}
          if-no-files-found: error
          compression-level: 0

      - name: Upload exact Windows attested platform artifact
        if: matrix.omp_asset == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: attested-${{ matrix.platform }}-${{ github.run_attempt }}
          path: |
            payload/${{ matrix.herdr_asset }}
            payload/${{ matrix.herdr_asset }}.sha256
            payload/${{ matrix.provenance }}
          if-no-files-found: error
          compression-level: 0
      - name: Record exact attested platform artifact attempt
        id: attested-artifact
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          printf 'attested_%s_attempt=%s\n' "${PLATFORM//-/_}" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  assemble-spdx:
    needs: [preflight, attest-platform]
    if: >-
      always() &&
      needs.preflight.outputs.should_build == 'true' &&
      needs.attest-platform.result == 'success'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      artifact_attempt: ${{ github.run_attempt }}
    env:
      EXPECTED_PARENT: ${{ needs.preflight.outputs.parent_commit }}
      EXPECTED_SOURCE: ${{ needs.preflight.outputs.commit }}
      EXPECTED_OMP: ${{ needs.preflight.outputs.omp_commit }}
      BUILT_AT: ${{ needs.preflight.outputs.built_at }}
      BASE_VERSION: ${{ needs.preflight.outputs.base_version }}
      BUILD_ID: ${{ needs.preflight.outputs.build_id }}
      OMP_VERSION: ${{ needs.preflight.outputs.omp_version }}
      CARGO_BAZEL_ISOLATED: '0'
    steps:
      - name: Download immutable release plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: smarty-release-plan-${{ needs.preflight.outputs.artifact_attempt }}
          path: handoff

      - name: Download immutable candidate source archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: smarty-candidate-sources-${{ needs.preflight.outputs.artifact_attempt }}
          path: source-archives

      - name: Download attested Linux x86_64 payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: attested-linux-x86_64-${{ needs.attest-platform.outputs.attested_linux_x86_64_attempt }}
          path: release-assets

      - name: Download attested Linux aarch64 payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: attested-linux-aarch64-${{ needs.attest-platform.outputs.attested_linux_aarch64_attempt }}
          path: release-assets

      - name: Download attested macOS x86_64 payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: attested-macos-x86_64-${{ needs.attest-platform.outputs.attested_macos_x86_64_attempt }}
          path: release-assets

      - name: Download attested macOS aarch64 payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: attested-macos-aarch64-${{ needs.attest-platform.outputs.attested_macos_aarch64_attempt }}
          path: release-assets

      - name: Download attested Windows x86_64 payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: attested-windows-x86_64-${{ needs.attest-platform.outputs.attested_windows_x86_64_attempt }}
          path: release-assets

      - name: Verify candidate handoff and unpack sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          plan = json.loads(Path("handoff/release-plan.json").read_text(encoding="utf-8"))
          expected = {
              "parent_commit": os.environ["EXPECTED_PARENT"],
              "source_commit": os.environ["EXPECTED_SOURCE"],
              "omp_commit": os.environ["EXPECTED_OMP"],
              "built_at": os.environ["BUILT_AT"],
              "base_version": os.environ["BASE_VERSION"],
              "build_id": os.environ["BUILD_ID"],
              "omp_version": os.environ["OMP_VERSION"],
          }
          if any(plan.get(key) != value for key, value in expected.items()):
              raise SystemExit("release plan identity mismatch")
          for name, record in plan["source_archives"].items():
              data = (Path("source-archives") / name).read_bytes()
              if len(data) != record["length"] or hashlib.sha256(data).hexdigest() != record["sha256"]:
                  raise SystemExit(f"candidate source archive digest mismatch: {name}")
          herdr = (
              "herdr-linux-x86_64", "herdr-linux-aarch64", "herdr-macos-x86_64",
              "herdr-macos-aarch64", "herdr-windows-x86_64.zip",
          )
          omp = (
              "omp-linux-x86_64", "omp-linux-aarch64", "omp-macos-x86_64", "omp-macos-aarch64",
          )
          natives = (
              "pi_natives.linux-x64-baseline.node", "pi_natives.linux-x64-modern.node",
              "pi_natives.linux-arm64.node", "pi_natives.darwin-x64-baseline.node",
              "pi_natives.darwin-arm64.node",
          )
          provenance = tuple(
              f"smarty-provenance-{platform}.sigstore.json"
              for platform in (
                  "linux-x86_64", "linux-aarch64", "macos-x86_64", "macos-aarch64", "windows-x86_64",
              )
          )
          reports = tuple(
              f"omp-rules-rust-{platform}.json"
              for platform in ("linux-x86_64", "linux-aarch64", "macos-x86_64", "macos-aarch64")
          )
          payloads = herdr + omp + natives
          names = set(payloads) | {f"{name}.sha256" for name in payloads} | set(provenance) | set(reports)
          paths = list(Path("release-assets").iterdir())
          if {path.name for path in paths} != names or any(not path.is_file() or path.is_symlink() for path in paths):
              raise SystemExit("attested platform handoff has unexpected files")
          for name in payloads:
              data = (Path("release-assets") / name).read_bytes()
              fields = (Path("release-assets") / f"{name}.sha256").read_text(encoding="ascii").split()
              if fields != [hashlib.sha256(data).hexdigest(), name]:
                  raise SystemExit(f"candidate payload checksum mismatch: {name}")
          PY
          mkdir herdr-source omp-source
          tar -xf source-archives/herdr-source.tar -C herdr-source
          tar -xf source-archives/omp-source.tar -C omp-source

      - name: Install Rust for release metadata
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Regenerate exact Cargo and Bazel metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -rf metadata
          mkdir -p metadata/cargo-metadata
          while read -r component platform target; do
            case "$component" in
              herdr) root=herdr-source ;;
              omp) root=omp-source ;;
              *) exit 1 ;;
            esac
            (cd "$root" && env -u RUSTUP_TOOLCHAIN cargo metadata --locked --format-version=1 --filter-platform "$target") \
              > "metadata/cargo-metadata/$component-$platform.json"
          done <<'EOF'
          herdr linux-x86_64 x86_64-unknown-linux-musl
          herdr linux-aarch64 aarch64-unknown-linux-musl
          herdr macos-x86_64 x86_64-apple-darwin
          herdr macos-aarch64 aarch64-apple-darwin
          herdr windows-x86_64 x86_64-pc-windows-msvc
          omp linux-x86_64 x86_64-unknown-linux-gnu
          omp linux-aarch64 aarch64-unknown-linux-gnu
          omp macos-x86_64 x86_64-apple-darwin
          omp macos-aarch64 aarch64-apple-darwin
          EOF
          if command -v bazelisk >/dev/null 2>&1; then
            bazel_tool="$(command -v bazelisk)"
          else
            bazel_tool="$(command -v bazel)"
            test "$($bazel_tool --version)" = "bazel $(tr -d '\r\n' < omp-source/.bazelversion)"
          fi
          (cd omp-source && "$bazel_tool" --ignore_all_rc_files mod --lockfile_mode=error graph --output=json) \
            > "$GITHUB_WORKSPACE/metadata/omp-bazel-graph.json"

      - name: Aggregate native rules_rust evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S - <<'PY'
          import json
          from pathlib import Path

          platforms = ("linux-x86_64", "linux-aarch64", "macos-x86_64", "macos-aarch64")
          toolchains = {}
          for platform in platforms:
              path = Path("release-assets") / f"omp-rules-rust-{platform}.json"
              record = json.loads(path.read_text(encoding="utf-8"))
              if set(record) != {"platform", "resolved", "schema", "toolchain_type"}:
                  raise SystemExit(f"native toolchain report has unexpected fields: {platform}")
              if record["schema"] != 1 or record["platform"] != platform:
                  raise SystemExit(f"native toolchain report identity mismatch: {platform}")
              if record["toolchain_type"] != "@@rules_rust+//rust:toolchain_type":
                  raise SystemExit(f"native toolchain type mismatch: {platform}")
              resolved = record["resolved"]
              if (
                  not isinstance(resolved, list)
                  or not resolved
                  or resolved != sorted(set(resolved))
                  or any(not isinstance(label, str) or not label.startswith("@@rules_rust") or not label.endswith("//:rust_toolchain") for label in resolved)
              ):
                  raise SystemExit(f"native toolchain selection mismatch: {platform}")
              toolchains[platform] = {
                  "resolved": resolved,
                  "toolchain_type": record["toolchain_type"],
              }
              path.unlink()
          Path("metadata/omp-rules-rust-toolchains.json").write_text(
              json.dumps({"schema": 1, "toolchains": toolchains}, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Generate deterministic SPDX candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -S herdr-source/scripts/preview.py spdx \
            --output release-assets/smarty-pair.spdx.json \
            --asset-dir release-assets \
            --built-at "$BUILT_AT" \
            --parent-commit "$EXPECTED_PARENT" \
            --herdr-commit "$EXPECTED_SOURCE" \
            --omp-commit "$EXPECTED_OMP" \
            --herdr-version "$BASE_VERSION-preview.$BUILD_ID" \
            --omp-version "$OMP_VERSION" \
            --herdr-root herdr-source \
            --omp-root omp-source \
            --omp-bazel-graph metadata/omp-bazel-graph.json \
            --cargo-metadata-dir metadata/cargo-metadata
          python3 -I -S - <<'PY'
          from pathlib import Path

          herdr = {
              "herdr-linux-x86_64", "herdr-linux-aarch64", "herdr-macos-x86_64",
              "herdr-macos-aarch64", "herdr-windows-x86_64.zip",
          }
          omp = {"omp-linux-x86_64", "omp-linux-aarch64", "omp-macos-x86_64", "omp-macos-aarch64"}
          natives = {
              "pi_natives.linux-x64-baseline.node", "pi_natives.linux-x64-modern.node",
              "pi_natives.linux-arm64.node", "pi_natives.darwin-x64-baseline.node",
              "pi_natives.darwin-arm64.node",
          }
          payloads = herdr | omp | natives
          provenance = {
              f"smarty-provenance-{platform}.sigstore.json"
              for platform in ("linux-x86_64", "linux-aarch64", "macos-x86_64", "macos-aarch64", "windows-x86_64")
          }
          expected = payloads | {f"{name}.sha256" for name in payloads} | provenance | {"smarty-pair.spdx.json"}
          paths = list(Path("release-assets").iterdir())
          if {path.name for path in paths} != expected or any(not path.is_file() or path.is_symlink() for path in paths):
              raise SystemExit("SPDX candidate has unexpected release files")
          PY

      - name: Upload exact SPDX candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smarty-spdx-candidate-${{ github.run_attempt }}
          path: |
            release-assets
            metadata
            handoff
            source-archives
          if-no-files-found: error
          compression-level: 0

  attest-spdx:
    needs: [preflight, assemble-spdx]
    if: >-
      always() &&
      needs.preflight.outputs.should_build == 'true' &&
      needs.assemble-spdx.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact_attempt: ${{ github.run_attempt }}
    env:
      EXPECTED_PARENT: ${{ needs.preflight.outputs.parent_commit }}
      EXPECTED_SOURCE: ${{ needs.preflight.outputs.commit }}
      EXPECTED_OMP: ${{ needs.preflight.outputs.omp_commit }}
      BUILT_AT: ${{ needs.preflight.outputs.built_at }}
      BASE_VERSION: ${{ needs.preflight.outputs.base_version }}
      BUILD_ID: ${{ needs.preflight.outputs.build_id }}
      OMP_VERSION: ${{ needs.preflight.outputs.omp_version }}
      EXPECTED_VERIFIER_SHA256: ${{ needs.preflight.outputs.trusted_verifier_sha256 }}
      EXPECTED_PLAN_SHA256: ${{ needs.preflight.outputs.release_plan_sha256 }}
    steps:
      - name: Download exact SPDX candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: smarty-spdx-candidate-${{ needs.assemble-spdx.outputs.artifact_attempt }}
          path: candidate

      - name: Verify exact SPDX attestation inputs
        shell: /bin/bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -S - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("candidate/release-assets")

          def record(path: Path) -> dict[str, object]:
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f"trusted input is not a regular file: {path}")
              data = path.read_bytes()
              return {"length": len(data), "sha256": hashlib.sha256(data).hexdigest()}

          plan_path = Path("candidate/handoff/release-plan.json")
          plan_bytes = plan_path.read_bytes()
          if hashlib.sha256(plan_bytes).hexdigest() != os.environ["EXPECTED_PLAN_SHA256"]:
              raise SystemExit("SPDX release plan digest mismatch")
          plan = json.loads(plan_bytes)
          expected_plan = {
              "parent_commit": os.environ["EXPECTED_PARENT"],
              "source_commit": os.environ["EXPECTED_SOURCE"],
              "omp_commit": os.environ["EXPECTED_OMP"],
              "built_at": os.environ["BUILT_AT"],
              "base_version": os.environ["BASE_VERSION"],
              "build_id": os.environ["BUILD_ID"],
              "omp_version": os.environ["OMP_VERSION"],
          }
          if any(plan.get(key) != value for key, value in expected_plan.items()):
              raise SystemExit("SPDX release plan identity mismatch")
          verifier = Path("candidate/handoff/trusted-release-verifier.py")
          if (
              record(verifier) != plan.get("trusted_verifier")
              or record(verifier)["sha256"] != os.environ["EXPECTED_VERIFIER_SHA256"]
          ):
              raise SystemExit("SPDX trusted verifier mismatch")
          archives = Path("candidate/source-archives")
          archive_paths = list(archives.iterdir())
          if {path.name for path in archive_paths} != set(plan.get("source_archives", {})):
              raise SystemExit("SPDX trusted source archive set mismatch")
          for path in archive_paths:
              if record(path) != plan["source_archives"][path.name]:
                  raise SystemExit(f"SPDX trusted source archive mismatch: {path.name}")
          herdr = {
              "herdr-linux-x86_64", "herdr-linux-aarch64", "herdr-macos-x86_64",
              "herdr-macos-aarch64", "herdr-windows-x86_64.zip",
          }
          omp = {"omp-linux-x86_64", "omp-linux-aarch64", "omp-macos-x86_64", "omp-macos-aarch64"}
          natives = {
              "pi_natives.linux-x64-baseline.node", "pi_natives.linux-x64-modern.node",
              "pi_natives.linux-arm64.node", "pi_natives.darwin-x64-baseline.node",
              "pi_natives.darwin-arm64.node",
          }
          payloads = herdr | omp | natives
          provenance = {
              f"smarty-provenance-{platform}.sigstore.json"
              for platform in ("linux-x86_64", "linux-aarch64", "macos-x86_64", "macos-aarch64", "windows-x86_64")
          }
          expected = payloads | {f"{name}.sha256" for name in payloads} | provenance | {"smarty-pair.spdx.json"}
          paths = list(root.iterdir())
          if {path.name for path in paths} != expected or any(not path.is_file() or path.is_symlink() for path in paths):
              raise SystemExit("SPDX attestation input has unexpected files")
          for name in payloads:
              data = (root / name).read_bytes()
              if (root / f"{name}.sha256").read_text(encoding="ascii").split() != [hashlib.sha256(data).hexdigest(), name]:
                  raise SystemExit(f"SPDX attestation payload mismatch: {name}")

          def subjects(path: Path) -> dict[str, str]:
              text = path.read_text(encoding="utf-8")
              try:
                  values = [json.loads(text)]
              except json.JSONDecodeError:
                  values = [json.loads(line) for line in text.splitlines() if line.strip()]
              found = {}
              pending = list(values)
              while pending:
                  value = pending.pop()
                  if isinstance(value, list):
                      pending.extend(value)
                  elif isinstance(value, dict):
                      envelope = value.get("dsseEnvelope")
                      if isinstance(envelope, dict):
                          pending.append(envelope)
                      if isinstance(value.get("payload"), str) and ("payloadType" in value or "signatures" in value):
                          statement = json.loads(base64.b64decode(value["payload"], validate=True))
                          for subject in statement.get("subject", []):
                              name = subject.get("name")
                              digest = subject.get("digest", {}).get("sha256")
                              if not isinstance(name, str) or not isinstance(digest, str):
                                  raise SystemExit(f"invalid provenance subject in {path.name}")
                              if name in found and found[name] != digest:
                                  raise SystemExit(f"conflicting provenance subject in {path.name}")
                              found[name] = digest
                      pending.extend(child for key, child in value.items() if key != "dsseEnvelope")
              return found

          platform_payloads = {
              "linux-x86_64": (
                  "herdr-linux-x86_64", "omp-linux-x86_64",
                  "pi_natives.linux-x64-baseline.node", "pi_natives.linux-x64-modern.node",
              ),
              "linux-aarch64": ("herdr-linux-aarch64", "omp-linux-aarch64", "pi_natives.linux-arm64.node"),
              "macos-x86_64": (
                  "herdr-macos-x86_64", "omp-macos-x86_64", "pi_natives.darwin-x64-baseline.node",
              ),
              "macos-aarch64": ("herdr-macos-aarch64", "omp-macos-aarch64", "pi_natives.darwin-arm64.node"),
              "windows-x86_64": ("herdr-windows-x86_64.zip",),
          }
          for platform, names in platform_payloads.items():
              expected_subjects = {name: hashlib.sha256((root / name).read_bytes()).hexdigest() for name in names}
              if subjects(root / f"smarty-provenance-{platform}.sigstore.json") != expected_subjects:
                  raise SystemExit(f"platform provenance subjects mismatch: {platform}")
          document = json.loads((root / "smarty-pair.spdx.json").read_text(encoding="utf-8"))
          if document.get("spdxVersion") != "SPDX-2.3":
              raise SystemExit("SPDX document version mismatch")
          metadata = Path("candidate/metadata")
          entries = list(metadata.iterdir())
          graphs = [path for path in entries if path.name.endswith("-graph.json")]
          if (
              len(graphs) != 1
              or not graphs[0].is_file()
              or graphs[0].is_symlink()
              or not (metadata / "cargo-metadata").is_dir()
              or not (metadata / "omp-rules-rust-toolchains.json").is_file()
          ):
              raise SystemExit("complete SPDX semantic metadata handoff is invalid")
          PY
          /bin/rm -rf trusted-source-*
          index=0
          for archive in candidate/source-archives/*.tar; do
            /bin/mkdir "trusted-source-$index"
            /bin/tar -xf "$archive" -C "trusted-source-$index"
            index=$((index + 1))
          done
          test "$index" = 2
          herdr_root=
          omp_root=
          for root in trusted-source-*; do
            if [ -f "$root/src/protocol/wire.rs" ]; then
              herdr_root="$root"
            elif [ -f "$root/packages/coding-agent/package.json" ]; then
              omp_root="$root"
            fi
          done
          test -n "$herdr_root"
          test -n "$omp_root"
          graphs=(candidate/metadata/*-graph.json)
          test "${#graphs[@]}" = 1
          /usr/bin/env -i /usr/bin/python3 -I -S candidate/handoff/trusted-release-verifier.py spdx \
            --output "$RUNNER_TEMP/trusted-spdx.json" \
            --asset-dir candidate/release-assets \
            --built-at "$BUILT_AT" \
            --parent-commit "$EXPECTED_PARENT" \
            --herdr-commit "$EXPECTED_SOURCE" \
            --omp-commit "$EXPECTED_OMP" \
            --herdr-version "${BASE_VERSION}-preview.${BUILD_ID}" \
            --omp-version "$OMP_VERSION" \
            --herdr-root "$herdr_root" \
            --omp-root "$omp_root" \
            --native-graph "${graphs[0]}" \
            --dependency-metadata candidate/metadata/cargo-metadata
          /usr/bin/cmp -s "$RUNNER_TEMP/trusted-spdx.json" candidate/release-assets/smarty-pair.spdx.json

      - name: Attest payloads and deterministic SPDX
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |-
            candidate/release-assets/herdr-linux-x86_64
            candidate/release-assets/herdr-linux-aarch64
            candidate/release-assets/herdr-macos-x86_64
            candidate/release-assets/herdr-macos-aarch64
            candidate/release-assets/herdr-windows-x86_64.zip
            candidate/release-assets/omp-linux-x86_64
            candidate/release-assets/omp-linux-aarch64
            candidate/release-assets/omp-macos-x86_64
            candidate/release-assets/omp-macos-aarch64
            candidate/release-assets/pi_natives.linux-x64-baseline.node
            candidate/release-assets/pi_natives.linux-x64-modern.node
            candidate/release-assets/pi_natives.linux-arm64.node
            candidate/release-assets/pi_natives.darwin-x64-baseline.node
            candidate/release-assets/pi_natives.darwin-arm64.node
            candidate/release-assets/smarty-pair.spdx.json
          sbom-path: candidate/release-assets/smarty-pair.spdx.json

      - name: Fix SPDX attestation bundle name
        shell: /bin/bash
        env:
          BUNDLE_PATH: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -S - <<'PY'
          import os
          import shutil
          from pathlib import Path

          source = Path(os.environ["BUNDLE_PATH"])
          target = Path("candidate/release-assets/smarty-pair.spdx.sigstore.json")
          shutil.copyfile(source, target)
          if not target.is_file() or target.stat().st_size == 0:
              raise SystemExit("SPDX attestation bundle is empty")
          PY

      - name: Upload exact attested SPDX bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smarty-spdx-attested-${{ github.run_attempt }}
          path: |
            candidate/release-assets
            candidate/metadata
            candidate/handoff
            candidate/source-archives
          if-no-files-found: error
          compression-level: 0

  assemble-pair:
    needs: [preflight, attest-spdx]
    if: >-
      always() &&
      needs.preflight.outputs.should_build == 'true' &&
      needs.attest-spdx.result == 'success'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      artifact_attempt: ${{ github.run_attempt }}
    env:
      EXPECTED_PARENT: ${{ needs.preflight.outputs.parent_commit }}
      EXPECTED_SOURCE: ${{ needs.preflight.outputs.commit }}
      EXPECTED_OMP: ${{ needs.preflight.outputs.omp_commit }}
      PARENT_TREE: ${{ needs.preflight.outputs.parent_tree }}
      SOURCE_TREE: ${{ needs.preflight.outputs.source_tree }}
      TAG: ${{ needs.preflight.outputs.tag }}
