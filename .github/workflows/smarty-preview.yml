      - name: Verify pair inputs and unpack sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          plan = json.loads(Path("handoff/release-plan.json").read_text(encoding="utf-8"))
          expected = {
              "parent_commit": os.environ["EXPECTED_PARENT"],
              "source_commit": os.environ["EXPECTED_SOURCE"],
              "omp_commit": os.environ["EXPECTED_OMP"],
              "parent_tree": os.environ["PARENT_TREE"],
              "source_tree": os.environ["SOURCE_TREE"],
              "tag": os.environ["TAG"],
              "build_id": os.environ["BUILD_ID"],
              "built_at": os.environ["BUILT_AT"],
              "base_version": os.environ["BASE_VERSION"],
              "protocol": int(os.environ["PROTOCOL"]),
          }
          if any(plan.get(key) != value for key, value in expected.items()):
              raise SystemExit("pair release plan identity mismatch")
          for name, record in plan["source_archives"].items():
              data = (Path("source-archives") / name).read_bytes()
              if len(data) != record["length"] or hashlib.sha256(data).hexdigest() != record["sha256"]:
                  raise SystemExit(f"pair source archive digest mismatch: {name}")
          root = Path("spdx/release-assets")
          if not root.is_dir() or any(path.is_symlink() for path in root.iterdir()):
              raise SystemExit("attested SPDX release directory is invalid")
          metadata = Path("spdx/metadata/omp-rules-rust-toolchains.json")
          if not metadata.is_file() or metadata.is_symlink():
              raise SystemExit("rules_rust metadata handoff is invalid")
          PY
          mkdir herdr-source omp-source
          tar -xf source-archives/herdr-source.tar -C herdr-source
          tar -xf source-archives/omp-source.tar -C omp-source
          cp -R spdx/release-assets release-assets
          cp -R spdx/metadata metadata

      - name: Generate deterministic pair manifest candidate
