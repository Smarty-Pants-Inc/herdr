name: Smarty Preview

on:
  push:
    branches:
      - smarty-preview-source

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1

concurrency:
  group: smarty-preview-publish
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.plan.outputs.commit }}
      build_id: ${{ steps.plan.outputs.build_id }}
      tag: ${{ steps.plan.outputs.tag }}
      built_at: ${{ steps.plan.outputs.built_at }}
      base_version: ${{ steps.plan.outputs.base_version }}
      protocol: ${{ steps.plan.outputs.protocol }}
      omp_repository: ${{ steps.plan.outputs.omp_repository }}
      omp_commit: ${{ steps.plan.outputs.omp_commit }}
      omp_tree: ${{ steps.plan.outputs.omp_tree }}
      omp_version: ${{ steps.plan.outputs.omp_version }}
      omp_build_id: ${{ steps.plan.outputs.omp_build_id }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false


      - name: Plan preview build
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=12 HEAD)"
          day="$(git show -s --format=%cs HEAD)"
          base_version="$(python3 -c 'import re; print(re.search(r"^version = \"(.*)\"$", open("Cargo.toml").read(), re.M).group(1))')"
          protocol="$(python3 -c 'import re; print(re.search(r"pub const PROTOCOL_VERSION: u32 = (\d+);", open("src/protocol/wire.rs").read()).group(1))')"
          {
            echo "commit=$commit"
            echo "build_id=$day-$short_sha"
            echo "tag=smarty-preview-$day-$short_sha"
            echo "built_at=$(git show -s --format=%cI HEAD)"
            echo "base_version=$base_version"
            echo "protocol=$protocol"
          } >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from scripts.preview import read_omp_source

          source = read_omp_source(Path('.github/smarty-omp-source.json'))
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              for field, value in source.items():
                  output.write(f'omp_{field}={value}\n')
          PY

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          components: rustfmt

      - name: Install Rust tools
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2.81.9
        with:
          tool: just,cargo-nextest

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false

      - name: Run Smarty release checks
        run: |
          cargo fmt --all -- --check
          just test

  build:
    needs: preflight
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            name: herdr-linux-x86_64
            omp_target: linux-x64
            omp_native_targets: linux-x64-baseline linux-x64-modern
            omp_asset: omp-linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            name: herdr-linux-aarch64
            omp_target: linux-arm64
            omp_native_targets: linux-arm64
            omp_asset: omp-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-15-intel
            name: herdr-macos-x86_64
            omp_target: darwin-x64
            omp_native_targets: darwin-x64-baseline
            omp_asset: omp-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-14
            name: herdr-macos-aarch64
            omp_target: darwin-arm64
            omp_native_targets: darwin-arm64
            omp_asset: omp-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: herdr-windows-x86_64.zip
            omp_target: ''
            omp_native_targets: ''
            omp_asset: ''
    runs-on: ${{ matrix.os }}
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
      LIBGHOSTTY_VT_SIMD: 'true'
      HERDR_BUILD_CHANNEL: preview
      HERDR_BUILD_ID: ${{ needs.preflight.outputs.build_id }}
      HERDR_BUILD_COMMIT: ${{ needs.preflight.outputs.commit }}
      HERDR_BUILD_UPDATE_MANIFEST_URL: https://raw.githubusercontent.com/Smarty-Pants-Inc/herdr/smarty-channel/preview.json
      HERDR_BUILD_OMP_BUILD_ID: ${{ matrix.omp_target != '' && needs.preflight.outputs.omp_build_id || '' }}
      HERDR_BUILD_OMP_COMMIT: ${{ matrix.omp_target != '' && needs.preflight.outputs.omp_commit || '' }}
      HERDR_BUILD_OMP_TREE: ${{ matrix.omp_target != '' && needs.preflight.outputs.omp_tree || '' }}
      HERDR_BUILD_OMP_VERSION: ${{ matrix.omp_target != '' && needs.preflight.outputs.omp_version || '' }}
      HERDR_BUILD_AUTO_UPDATE: 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false

      - name: Checkout paired OMP source
        if: matrix.omp_target != ''
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ needs.preflight.outputs.omp_repository }}
          ref: ${{ needs.preflight.outputs.omp_commit }}
          path: omp-source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify paired OMP source identity
        if: matrix.omp_target != ''
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C omp-source rev-parse HEAD)" = "${{ needs.preflight.outputs.omp_commit }}"
          test "$(git -C omp-source rev-parse HEAD^{tree})" = "${{ needs.preflight.outputs.omp_tree }}"
          test "$(python3 -c 'import json; print(json.load(open("omp-source/packages/coding-agent/package.json"))["version"])')" = "${{ needs.preflight.outputs.omp_version }}"

      - name: Install Bun for OMP
        if: matrix.omp_target != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Zig
        if: runner.os != 'macOS'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Restore Homebrew Zig cache
        if: runner.os == 'macOS'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: homebrew-zig-0.15-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            homebrew-zig-0.15-${{ runner.os }}-

      - name: Install patched Zig on macOS
        if: runner.os == 'macOS'
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install zig@0.15
          echo "$(brew --prefix zig@0.15)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix zig@0.15)/bin/zig" version

      - name: Prefer official Ubuntu mirrors over Azure
        if: runner.os == 'Linux'
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt
            cat /etc/apt/apt-mirrors.txt
          fi

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo find /etc/apt/sources.list.d -type f \( -iname '*microsoft*' -o -iname '*azure-cli*' \) -print -delete
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build musl-tools gcc-aarch64-linux-gnu crossbuild-essential-arm64

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja

      - name: Set Linux aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: smarty-preview-${{ matrix.os }}-${{ matrix.target }}

      - name: Remove Zig caches
        if: runner.os != 'Windows'
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      - name: Remove Zig caches
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force .zig-cache -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force vendor/libghostty-vt/.zig-cache -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force vendor/libghostty-vt/zig-out -ErrorAction SilentlyContinue

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build paired OMP binary
        if: matrix.omp_target != ''
        working-directory: omp-source
        shell: bash
        env:
          OMP_BUILD_ID: ${{ needs.preflight.outputs.omp_build_id }}
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
          read -r -a native_targets <<< "${{ matrix.omp_native_targets }}"
          bun scripts/bazel-natives.ts "${native_targets[@]}" --dest packages/natives/native
          bun scripts/ci-release-build-binaries.ts --targets "${{ matrix.omp_target }}"
      - name: Package artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cp target/${{ matrix.target }}/release/herdr ${{ matrix.name }}
          python3 - <<'PY' | tee ${{ matrix.name }}.sha256
          import hashlib
          from pathlib import Path
          path = Path('${{ matrix.name }}')
          print(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
          PY
          cp "omp-source/packages/coding-agent/binaries/omp-${{ matrix.omp_target }}" "${{ matrix.omp_asset }}"
          python3 - <<'PY' | tee "${{ matrix.omp_asset }}.sha256"
          import hashlib
          import os
          from pathlib import Path
          path = Path(os.environ["OMP_ASSET"])
          print(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
          PY
        env:
          OMP_ASSET: ${{ matrix.omp_asset }}

      - name: Verify paired OMP build identity
        if: matrix.omp_target != ''
        shell: bash
        run: |
          set -euo pipefail
          omp_binary="omp-source/packages/coding-agent/binaries/omp-${{ matrix.omp_target }}"
          omp_id="$("$omp_binary" __build-id)"
          test "$omp_id" = "${{ needs.preflight.outputs.omp_build_id }}"
          omp_version="$("$omp_binary" --version)"
          test "$omp_version" = "omp/${{ needs.preflight.outputs.omp_version }}"

      - name: Package artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = Join-Path $env:RUNNER_TEMP "Microsoft.Windows.Console.ConPTY.nupkg"
          $stage = Join-Path $env:RUNNER_TEMP "herdr-windows-x86_64"
          .\scripts\package_windows_conpty.ps1 `
            -HerdrExe target\${{ matrix.target }}\release\herdr.exe `
            -PackagePath $package `
            -StageDir $stage `
            -OutputPath ${{ matrix.name }}
          $hash = (Get-FileHash -Algorithm SHA256 ${{ matrix.name }}).Hash.ToLowerInvariant()
          "$hash  ${{ matrix.name }}" | Out-File -Encoding ascii ${{ matrix.name }}.sha256

      - name: Upload paired artifact
        if: matrix.omp_target != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}
            ${{ matrix.name }}.sha256
            ${{ matrix.omp_asset }}
            ${{ matrix.omp_asset }}.sha256

      - name: Upload Windows artifact
        if: matrix.omp_target == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}
            ${{ matrix.name }}.sha256

  publish:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    environment: smarty-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify publication prerequisites
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SMARTY_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::SMARTY_RELEASE_TOKEN is required in the smarty-release environment"
            exit 1
          fi
          test "$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' "repos/$GITHUB_REPOSITORY/immutable-releases" --jq .enabled)" = true


      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Generate checksums and notes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from scripts.preview import EXPECTED_ASSET_NAMES, OMP_EXPECTED_ASSET_NAMES

          source = Path('artifacts')
          herdr_assets = EXPECTED_ASSET_NAMES
          omp_assets = OMP_EXPECTED_ASSET_NAMES
          asset_names = set(herdr_assets.values()) | set(omp_assets.values())
          expected_names = asset_names | {f'{name}.sha256' for name in asset_names}
          paths = list(source.glob('*/*'))
          if len(paths) != len(expected_names) or {path.name for path in paths} != expected_names:
              raise SystemExit('local build artifacts do not exactly match the 18-asset release contract')
          files = {path.name: path for path in paths}
          digests = {}
          for name in asset_names:
              asset = files[name]
              sidecar = files[f'{name}.sha256']
              fields = sidecar.read_text(encoding='utf-8').split()
              if len(fields) != 2 or fields[1] != name:
                  raise SystemExit(f'invalid checksum sidecar: {sidecar}')
              digest = fields[0].lower()
              if len(digest) != 64 or any(character not in '0123456789abcdef' for character in digest):
                  raise SystemExit(f'invalid checksum digest: {sidecar}')
              if hashlib.sha256(asset.read_bytes()).hexdigest() != digest:
                  raise SystemExit(f'local checksum mismatch: {name}')
              digests[name] = digest
          herdr_shas = {target: digests[name] for target, name in herdr_assets.items()}
          omp_shas = {target: digests[name] for target, name in omp_assets.items()}
          Path('preview-sha256.json').write_text(json.dumps(herdr_shas, indent=2) + '\n', encoding='utf-8')
          Path('preview-omp-sha256.json').write_text(json.dumps(omp_shas, indent=2) + '\n', encoding='utf-8')
          PY
          cat > PREVIEW_NOTES.md <<EOF
          Smarty preview build ${{ needs.preflight.outputs.build_id }}

          Built from ${{ needs.preflight.outputs.commit }}.
          EOF

      - name: Create or verify preview prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SMARTY_RELEASE_TOKEN }}
          TAG: ${{ needs.preflight.outputs.tag }}
          BUILD_ID: ${{ needs.preflight.outputs.build_id }}
          COMMIT: ${{ needs.preflight.outputs.commit }}
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF":refs/remotes/origin/release-source
          test "$(git rev-parse refs/remotes/origin/release-source)" = "$GITHUB_SHA"
          assets=(
            artifacts/herdr-linux-x86_64/herdr-linux-x86_64
            artifacts/herdr-linux-x86_64/herdr-linux-x86_64.sha256
            artifacts/herdr-linux-x86_64/omp-linux-x86_64
            artifacts/herdr-linux-x86_64/omp-linux-x86_64.sha256
            artifacts/herdr-linux-aarch64/herdr-linux-aarch64
            artifacts/herdr-linux-aarch64/herdr-linux-aarch64.sha256
            artifacts/herdr-linux-aarch64/omp-linux-aarch64
            artifacts/herdr-linux-aarch64/omp-linux-aarch64.sha256
            artifacts/herdr-macos-x86_64/herdr-macos-x86_64
            artifacts/herdr-macos-x86_64/herdr-macos-x86_64.sha256
            artifacts/herdr-macos-x86_64/omp-macos-x86_64
            artifacts/herdr-macos-x86_64/omp-macos-x86_64.sha256
            artifacts/herdr-macos-aarch64/herdr-macos-aarch64
            artifacts/herdr-macos-aarch64/herdr-macos-aarch64.sha256
            artifacts/herdr-macos-aarch64/omp-macos-aarch64
            artifacts/herdr-macos-aarch64/omp-macos-aarch64.sha256
            artifacts/herdr-windows-x86_64.zip/herdr-windows-x86_64.zip
            artifacts/herdr-windows-x86_64.zip/herdr-windows-x86_64.zip.sha256
          )
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = true
          else
            gh release create "$TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$COMMIT" \
              --title "Smarty preview build $BUILD_ID" \
              --notes-file PREVIEW_NOTES.md \
              --prerelease \
              --latest=false
            touch release-created
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.type)" = commit
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)" = "$COMMIT"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .immutable)" = true
          mkdir published-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir published-assets
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from scripts.preview import EXPECTED_ASSET_NAMES, OMP_EXPECTED_ASSET_NAMES

          source = Path('artifacts')
          published = Path('published-assets')
          herdr_assets = EXPECTED_ASSET_NAMES
          omp_assets = OMP_EXPECTED_ASSET_NAMES
          asset_names = set(herdr_assets.values()) | set(omp_assets.values())
          expected_names = asset_names | {f'{name}.sha256' for name in asset_names}
          if {path.name for path in published.iterdir()} != expected_names:
              raise SystemExit('published release assets do not exactly match the 18-asset release contract')
          digests = {}
          for name in asset_names:
              asset = published / name
              sidecar = published / f'{name}.sha256'
              fields = sidecar.read_text(encoding='utf-8').split()
              if len(fields) != 2 or fields[1] != name:
                  raise SystemExit(f'published checksum sidecar mismatch: {name}')
              digest = fields[0].lower()
              if len(digest) != 64 or any(character not in '0123456789abcdef' for character in digest):
                  raise SystemExit(f'published checksum digest is invalid: {name}')
              if hashlib.sha256(asset.read_bytes()).hexdigest() != digest:
                  raise SystemExit(f'published asset checksum mismatch: {name}')
              digests[name] = digest
          if Path('release-created').exists():
              for asset in source.glob('*/*'):
                  if not asset.name.endswith('.sha256') and hashlib.sha256(asset.read_bytes()).hexdigest() != digests[asset.name]:
                      raise SystemExit(f'published asset mismatch: {asset.name}')
          herdr_shas = {target: digests[name] for target, name in herdr_assets.items()}
          omp_shas = {target: digests[name] for target, name in omp_assets.items()}
          Path('preview-sha256.json').write_text(json.dumps(herdr_shas, indent=2) + '\n', encoding='utf-8')
          Path('preview-omp-sha256.json').write_text(json.dumps(omp_shas, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Advance Smarty channel
        shell: bash
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          BUILD_ID: ${{ needs.preflight.outputs.build_id }}
          COMMIT: ${{ needs.preflight.outputs.commit }}
          BUILT_AT: ${{ needs.preflight.outputs.built_at }}
          BASE_VERSION: ${{ needs.preflight.outputs.base_version }}
          PROTOCOL: ${{ needs.preflight.outputs.protocol }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF":refs/remotes/origin/release-source
          test "$(git rev-parse refs/remotes/origin/release-source)" = "$GITHUB_SHA"
          mkdir channel
          if previous="$(git ls-remote --exit-code origin refs/heads/smarty-channel)"; then
            previous="${previous%%[[:space:]]*}"
            git fetch origin "refs/heads/smarty-channel:refs/remotes/origin/smarty-channel"
            test "$(git rev-parse refs/remotes/origin/smarty-channel)" = "$previous"
            git show "$previous:preview.json" > channel/preview.json
            existing_channel=true
          else
            status=$?
            [ "$status" -eq 2 ] || exit "$status"
            existing_channel=false
          fi
          python3 scripts/preview.py manifest \
            --output channel/preview.json \
            --repo Smarty-Pants-Inc/herdr \
            --tag "$TAG" \
            --build-id "$BUILD_ID" \
            --commit "$COMMIT" \
            --built-at "$BUILT_AT" \
            --base-version "$BASE_VERSION" \
            --protocol "$PROTOCOL" \
            --notes PREVIEW_NOTES.md \
            --sha-file preview-sha256.json \
            --omp-source .github/smarty-omp-source.json \
            --omp-sha-file preview-omp-sha256.json
          cp scripts/install-smarty.sh channel/install.sh
          if [ "$existing_channel" = true ]; then
            git worktree add --detach channel-worktree "$previous"
            git -C channel-worktree rm -rf .
            cp channel/preview.json channel-worktree/preview.json
            cp channel/install.sh channel-worktree/install.sh
            git -C channel-worktree add preview.json install.sh
            git -C channel-worktree -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Publish Smarty preview $BUILD_ID"
            git -C channel-worktree merge-base --is-ancestor "$previous" HEAD
            git fetch origin "$GITHUB_REF":refs/remotes/origin/release-source
            test "$(git rev-parse refs/remotes/origin/release-source)" = "$GITHUB_SHA"
            git -C channel-worktree push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/smarty-channel
          else
            git worktree add --detach channel-worktree
            git -C channel-worktree checkout --orphan smarty-channel-publish
            git -C channel-worktree rm -rf .
            cp channel/preview.json channel-worktree/preview.json
            cp channel/install.sh channel-worktree/install.sh
            git -C channel-worktree add preview.json install.sh
            git -C channel-worktree -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Publish Smarty preview $BUILD_ID"
            git fetch origin "$GITHUB_REF":refs/remotes/origin/release-source
            test "$(git rev-parse refs/remotes/origin/release-source)" = "$GITHUB_SHA"
            git -C channel-worktree push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/smarty-channel --force-with-lease=refs/heads/smarty-channel:
          fi
