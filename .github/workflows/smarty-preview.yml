          expected_names = set(payloads + sidecars + evidence + ("smarty-pair.json",))
          paths = list(root.iterdir())
          if {path.name for path in paths} != expected_names or any(not path.is_file() or path.is_symlink() for path in paths):
              raise SystemExit("pair attestation input has unexpected files")

          def digest(name: str) -> str:
              return hashlib.sha256((root / name).read_bytes()).hexdigest()

          for name in payloads:
              if (root / f"{name}.sha256").read_text(encoding="ascii").split() != [digest(name), name]:
                  raise SystemExit(f"pair payload checksum mismatch: {name}")

          pair = json.loads((root / "smarty-pair.json").read_text(encoding="utf-8"))
          if set(pair) != {"schema", "pair_id", "release", "sources", "toolchains", "lock_inputs", "platforms", "artifacts", "evidence", "verification"}:
              raise SystemExit("pair manifest has unexpected fields")
          if pair.get("schema") != "smarty.paired-release.v1":
              raise SystemExit("pair manifest schema mismatch")
          expected_release = {
              "repository": "Smarty-Pants-Inc/herdr",
              "tag": os.environ["TAG"],
              "build_id": os.environ["BUILD_ID"],
              "built_at": os.environ["BUILT_AT"],
              "immutable": True,
          }
          if pair.get("release") != expected_release:
              raise SystemExit("pair manifest release identity mismatch")
          expected_sources = {
              "parent": {
                  "repository": "Smarty-Pants-Inc/smarty-dev",
                  "commit": os.environ["EXPECTED_PARENT"],
                  "tree": os.environ["PARENT_TREE"],
              },
              "herdr": {
                  "repository": "Smarty-Pants-Inc/herdr",
                  "commit": os.environ["EXPECTED_SOURCE"],
                  "tree": os.environ["SOURCE_TREE"],
                  "version": os.environ["BASE_VERSION"],
                  "build_id": os.environ["BUILD_ID"],
                  "protocol": int(os.environ["PROTOCOL"]),
              },
              "omp": {
                  "repository": "Smarty-Pants-Inc/oh-my-pi",
                  "commit": os.environ["EXPECTED_OMP"],
                  "tree": os.environ["OMP_TREE"],
                  "version": os.environ["OMP_VERSION"],
                  "build_id": os.environ["OMP_BUILD_ID"],
              },
          }
          if pair.get("sources") != expected_sources:
              raise SystemExit("pair manifest source identity mismatch")
          material = b"smarty.paired-release.v1\0" + b"\0".join(
              os.environ[name].encode("ascii")
              for name in ("EXPECTED_PARENT", "EXPECTED_SOURCE", "EXPECTED_OMP")
          )
          if pair.get("pair_id") != hashlib.sha256(material).hexdigest():
              raise SystemExit("pair manifest pair ID mismatch")
          if not re.fullmatch(
              rf"\d{{4}}-\d{{2}}-\d{{2}}-p{os.environ['EXPECTED_PARENT']}-r{os.environ['EXPECTED_SOURCE']}-o{os.environ['EXPECTED_OMP']}",
              os.environ["BUILD_ID"],
          ):
              raise SystemExit("pair build ID mismatch")
          artifacts = pair.get("artifacts")
          if not isinstance(artifacts, dict) or set(artifacts) != set(payloads + sidecars):
              raise SystemExit("pair manifest artifact allow-list mismatch")
          prefix = f"https://github.com/Smarty-Pants-Inc/herdr/releases/download/{os.environ['TAG']}/"
          for name in payloads + sidecars:
              record = artifacts.get(name)
              if not isinstance(record, dict) or record.get("length") != (root / name).stat().st_size or record.get("sha256") != digest(name) or record.get("url") != prefix + name:
                  raise SystemExit(f"pair manifest artifact record mismatch: {name}")
          evidence_records = pair.get("evidence")
          if not isinstance(evidence_records, dict) or set(evidence_records) != set(evidence):
              raise SystemExit("pair manifest evidence allow-list mismatch")
          for name in evidence:
              record = evidence_records.get(name)
              if not isinstance(record, dict) or set(record) != {"length", "sha256", "url"} or record.get("length") != (root / name).stat().st_size or record.get("sha256") != digest(name) or record.get("url") != prefix + name:
                  raise SystemExit(f"pair manifest evidence record mismatch: {name}")

          def subjects(path: Path) -> dict[str, str]:
              text = path.read_text(encoding="utf-8")
              try:
                  values = [json.loads(text)]
              except json.JSONDecodeError:
                  values = [json.loads(line) for line in text.splitlines() if line.strip()]
              found = {}
              pending = list(values)
              while pending:
                  value = pending.pop()
                  if isinstance(value, list):
                      pending.extend(value)
                  elif isinstance(value, dict):
                      envelope = value.get("dsseEnvelope")
                      if isinstance(envelope, dict):
                          pending.append(envelope)
                      if isinstance(value.get("payload"), str) and ("payloadType" in value or "signatures" in value):
                          statement = json.loads(base64.b64decode(value["payload"], validate=True))
                          for subject in statement.get("subject", []):
                              name = subject.get("name")
                              value_digest = subject.get("digest", {}).get("sha256")
                              if not isinstance(name, str) or not isinstance(value_digest, str):
                                  raise SystemExit(f"invalid attestation subject in {path.name}")
                              if name in found and found[name] != value_digest:
                                  raise SystemExit(f"conflicting attestation subject in {path.name}")
                              found[name] = value_digest
                      pending.extend(child for key, child in value.items() if key != "dsseEnvelope")
              return found

          platform_payloads = {
              "linux-x86_64": (
                  "herdr-linux-x86_64", "omp-linux-x86_64",
                  "pi_natives.linux-x64-baseline.node", "pi_natives.linux-x64-modern.node",
              ),
              "linux-aarch64": ("herdr-linux-aarch64", "omp-linux-aarch64", "pi_natives.linux-arm64.node"),
              "macos-x86_64": (
                  "herdr-macos-x86_64", "omp-macos-x86_64", "pi_natives.darwin-x64-baseline.node",
              ),
              "macos-aarch64": ("herdr-macos-aarch64", "omp-macos-aarch64", "pi_natives.darwin-arm64.node"),
              "windows-x86_64": ("herdr-windows-x86_64.zip",),
          }
          for platform, names in platform_payloads.items():
              expected_subjects = {name: digest(name) for name in names}
              if subjects(root / f"smarty-provenance-{platform}.sigstore.json") != expected_subjects:
                  raise SystemExit(f"platform provenance mismatch: {platform}")
          if subjects(root / "smarty-pair.spdx.sigstore.json") != {
              name: digest(name) for name in payloads + ("smarty-pair.spdx.json",)
          }:
              raise SystemExit("SPDX provenance subjects mismatch")
          PY
          /bin/rm -rf trusted-source-*
          index=0
          for archive in candidate/source-archives/*.tar; do
            /bin/mkdir "trusted-source-$index"
            /bin/tar -xf "$archive" -C "trusted-source-$index"
            index=$((index + 1))
          done
          test "$index" = 2
          herdr_root=
          omp_root=
          for root in trusted-source-*; do
            if [ -f "$root/src/protocol/wire.rs" ]; then
              herdr_root="$root"
            elif [ -f "$root/packages/coding-agent/package.json" ]; then
              omp_root="$root"
            fi
          done
          test -n "$herdr_root"
          test -n "$omp_root"
          graphs=(candidate/metadata/*-graph.json)
          test "${#graphs[@]}" = 1
          native_graph="${graphs[0]}"
          /usr/bin/env -i /usr/bin/python3 -I -S candidate/handoff/trusted-release-verifier.py pair-manifest \
            --output "$RUNNER_TEMP/trusted-pair.json" \
            --asset-dir candidate/release-assets \
            --repo Smarty-Pants-Inc/herdr \
            --tag "$TAG" \
            --build-id "$BUILD_ID" \
            --built-at "$BUILT_AT" \
            --parent-repo Smarty-Pants-Inc/smarty-dev \
            --parent-commit "$EXPECTED_PARENT" \
            --parent-tree "$PARENT_TREE" \
            --herdr-commit "$EXPECTED_SOURCE" \
            --herdr-tree "$SOURCE_TREE" \
            --base-version "$BASE_VERSION" \
            --protocol "$PROTOCOL" \
            --omp-descriptor "$RUNNER_TEMP/paired-component.json" \
            --herdr-root "$herdr_root" \
            --omp-root "$omp_root" \
            --omp-rules-rust-toolchains candidate/metadata/omp-rules-rust-toolchains.json \
            --trusted-verifier candidate/handoff/trusted-release-verifier.py \
            --source-archive-dir candidate/source-archives \
            --native-graph "$native_graph" \
            --dependency-metadata candidate/metadata/cargo-metadata \
            --bun-version "$BUN_VERSION" \
            --zig-version "$ZIG_VERSION"
          /usr/bin/cmp -s "$RUNNER_TEMP/trusted-pair.json" candidate/release-assets/smarty-pair.json

      - name: Cryptographically verify upstream pair attestations
        shell: /bin/bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verify() {
            local bundle="$1" predicate="$2"
            shift 2
            local subject
            for subject in "$@"; do
              /usr/bin/gh attestation verify "candidate/release-assets/$subject" \
                --repo Smarty-Pants-Inc/herdr \
                --bundle "candidate/release-assets/$bundle" \
                --signer-workflow Smarty-Pants-Inc/herdr/.github/workflows/smarty-preview.yml \
                --signer-digest "$EXPECTED_SOURCE" \
                --source-ref "refs/tags/$TAG" \
                --source-digest "$EXPECTED_SOURCE" \
                --deny-self-hosted-runners \
                --predicate-type "$predicate"
            done
          }
          verify smarty-provenance-linux-x86_64.sigstore.json https://slsa.dev/provenance/v1 herdr-linux-x86_64 omp-linux-x86_64 pi_natives.linux-x64-baseline.node pi_natives.linux-x64-modern.node
          verify smarty-provenance-linux-aarch64.sigstore.json https://slsa.dev/provenance/v1 herdr-linux-aarch64 omp-linux-aarch64 pi_natives.linux-arm64.node
          verify smarty-provenance-macos-x86_64.sigstore.json https://slsa.dev/provenance/v1 herdr-macos-x86_64 omp-macos-x86_64 pi_natives.darwin-x64-baseline.node
          verify smarty-provenance-macos-aarch64.sigstore.json https://slsa.dev/provenance/v1 herdr-macos-aarch64 omp-macos-aarch64 pi_natives.darwin-arm64.node
          verify smarty-provenance-windows-x86_64.sigstore.json https://slsa.dev/provenance/v1 herdr-windows-x86_64.zip
          verify smarty-pair.spdx.sigstore.json https://spdx.dev/Document/v2.3 herdr-linux-x86_64 herdr-linux-aarch64 herdr-macos-x86_64 herdr-macos-aarch64 herdr-windows-x86_64.zip omp-linux-x86_64 omp-linux-aarch64 omp-macos-x86_64 omp-macos-aarch64 pi_natives.linux-x64-baseline.node pi_natives.linux-x64-modern.node pi_natives.linux-arm64.node pi_natives.darwin-x64-baseline.node pi_natives.darwin-arm64.node smarty-pair.spdx.json

      - name: Attest exact pair manifest
        id: pair
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: candidate/release-assets/smarty-pair.json

      - name: Seal exact release file manifest
        shell: /bin/bash
        env:
          BUNDLE_PATH: ${{ steps.pair.outputs.bundle-path }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -S - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          root = Path("candidate/release-assets")
          target = root / "smarty-pair.provenance.sigstore.json"
          shutil.copyfile(Path(os.environ["BUNDLE_PATH"]), target)
          if not target.is_file() or target.stat().st_size == 0:
              raise SystemExit("pair provenance bundle is empty")
          expected = {
              "herdr-linux-x86_64", "herdr-linux-x86_64.sha256",
              "herdr-linux-aarch64", "herdr-linux-aarch64.sha256",
              "herdr-macos-x86_64", "herdr-macos-x86_64.sha256",
              "herdr-macos-aarch64", "herdr-macos-aarch64.sha256",
              "herdr-windows-x86_64.zip", "herdr-windows-x86_64.zip.sha256",
              "omp-linux-x86_64", "omp-linux-x86_64.sha256",
              "omp-linux-aarch64", "omp-linux-aarch64.sha256",
              "omp-macos-x86_64", "omp-macos-x86_64.sha256",
              "omp-macos-aarch64", "omp-macos-aarch64.sha256",
              "pi_natives.linux-x64-baseline.node", "pi_natives.linux-x64-baseline.node.sha256",
              "pi_natives.linux-x64-modern.node", "pi_natives.linux-x64-modern.node.sha256",
              "pi_natives.linux-arm64.node", "pi_natives.linux-arm64.node.sha256",
              "pi_natives.darwin-x64-baseline.node", "pi_natives.darwin-x64-baseline.node.sha256",
              "pi_natives.darwin-arm64.node", "pi_natives.darwin-arm64.node.sha256",
              "smarty-pair.json", "smarty-pair.spdx.json",
              "smarty-provenance-linux-x86_64.sigstore.json",
              "smarty-provenance-linux-aarch64.sigstore.json",
              "smarty-provenance-macos-x86_64.sigstore.json",
              "smarty-provenance-macos-aarch64.sigstore.json",
              "smarty-provenance-windows-x86_64.sigstore.json",
              "smarty-pair.provenance.sigstore.json", "smarty-pair.spdx.sigstore.json",
          }
          paths = list(root.iterdir())
          if {path.name for path in paths} != expected or any(not path.is_file() or path.is_symlink() for path in paths):
              raise SystemExit("sealed release does not match the exact 37-name allow-list")
          files = {}
          for name in sorted(expected):
              data = (root / name).read_bytes()
              files[name] = {"length": len(data), "sha256": hashlib.sha256(data).hexdigest()}
          Path("candidate/handoff/release-files.json").write_text(
              json.dumps({"schema": 1, "files": files}, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload exact sealed release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smarty-release-ready-${{ github.run_attempt }}
          path: |
            candidate/release-assets
            candidate/handoff
            candidate/source-archives
            candidate/metadata
          if-no-files-found: error
          compression-level: 0

  verify-release:
    needs: [preflight, attest-pair]
    if: >-
      always() &&
      needs.preflight.outputs.should_build == 'true' &&
      needs.attest-pair.result == 'success'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      release_ready_attempt: ${{ needs.attest-pair.outputs.artifact_attempt }}
    env:
      EXPECTED_PARENT: ${{ needs.preflight.outputs.parent_commit }}
      EXPECTED_SOURCE: ${{ needs.preflight.outputs.commit }}
      EXPECTED_OMP: ${{ needs.preflight.outputs.omp_commit }}
      PARENT_TREE: ${{ needs.preflight.outputs.parent_tree }}
      SOURCE_TREE: ${{ needs.preflight.outputs.source_tree }}
      OMP_TREE: ${{ needs.preflight.outputs.omp_tree }}
      TAG: ${{ needs.preflight.outputs.tag }}
      BUILD_ID: ${{ needs.preflight.outputs.build_id }}
      CARGO_BAZEL_ISOLATED: '0'
    steps:
      - name: Download immutable release plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: smarty-release-plan-${{ needs.preflight.outputs.artifact_attempt }}
          path: handoff

      - name: Download immutable candidate source archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: smarty-candidate-sources-${{ needs.preflight.outputs.artifact_attempt }}
          path: source-archives

      - name: Download exact sealed release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: smarty-release-ready-${{ needs.attest-pair.outputs.artifact_attempt }}
          path: release-ready

      - name: Verify sealed bytes and unpack sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          files = json.loads(Path("release-ready/handoff/release-files.json").read_text(encoding="utf-8"))
          if files.get("schema") != 1 or not isinstance(files.get("files"), dict):
              raise SystemExit("sealed release file manifest is invalid")
          root = Path("release-ready/release-assets")
          if {path.name for path in root.iterdir()} != set(files["files"]):
              raise SystemExit("sealed release file set mismatch")
          for name, record in files["files"].items():
              path = root / name
              data = path.read_bytes()
              if path.is_symlink() or len(data) != record["length"] or hashlib.sha256(data).hexdigest() != record["sha256"]:
                  raise SystemExit(f"sealed release digest mismatch: {name}")
          plan = json.loads(Path("release-ready/handoff/release-plan.json").read_text(encoding="utf-8"))
          for name, record in plan["source_archives"].items():
              data = (Path("release-ready/source-archives") / name).read_bytes()
              if len(data) != record["length"] or hashlib.sha256(data).hexdigest() != record["sha256"]:
                  raise SystemExit(f"verification source archive mismatch: {name}")
          PY
          mkdir herdr-source omp-source
          tar -xf release-ready/source-archives/herdr-source.tar -C herdr-source
          tar -xf release-ready/source-archives/omp-source.tar -C omp-source

      - name: Install Rust for independent paired verification
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Regenerate paired verification metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification/cargo-metadata
          while read -r component platform target; do
            case "$component" in
              herdr) root=herdr-source ;;
              omp) root=omp-source ;;
              *) exit 1 ;;
            esac
            (cd "$root" && env -u RUSTUP_TOOLCHAIN cargo metadata --locked --format-version=1 --filter-platform "$target") \
              > "verification/cargo-metadata/$component-$platform.json"
          done <<'EOF'
          herdr linux-x86_64 x86_64-unknown-linux-musl
          herdr linux-aarch64 aarch64-unknown-linux-musl
          herdr macos-x86_64 x86_64-apple-darwin
          herdr macos-aarch64 aarch64-apple-darwin
          herdr windows-x86_64 x86_64-pc-windows-msvc
          omp linux-x86_64 x86_64-unknown-linux-gnu
          omp linux-aarch64 aarch64-unknown-linux-gnu
          omp macos-x86_64 x86_64-apple-darwin
          omp macos-aarch64 aarch64-apple-darwin
          EOF
          if command -v bazelisk >/dev/null 2>&1; then
            bazel_tool="$(command -v bazelisk)"
          else
            bazel_tool="$(command -v bazel)"
            test "$($bazel_tool --version)" = "bazel $(tr -d '\r\n' < omp-source/.bazelversion)"
          fi
          (cd omp-source && "$bazel_tool" --ignore_all_rc_files mod --lockfile_mode=error graph --output=json) \
            > "$GITHUB_WORKSPACE/verification/omp-bazel-graph.json"

      - name: Verify complete paired release with candidate metadata code
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S release-ready/handoff/trusted-release-verifier.py verify-pair \
            --asset-dir release-ready/release-assets \
            --expected-parent "$EXPECTED_PARENT" \
            --expected-source "$EXPECTED_SOURCE" \
            --expected-omp "$EXPECTED_OMP" \
            --expected-parent-tree "$PARENT_TREE" \
            --expected-source-tree "$SOURCE_TREE" \
            --expected-omp-tree "$OMP_TREE" \
            --expected-tag "$TAG" \
            --expected-build-id "$BUILD_ID" \
            --herdr-root herdr-source \
            --omp-root omp-source \
            --trusted-verifier release-ready/handoff/trusted-release-verifier.py \
            --source-archive-dir release-ready/source-archives \
            --omp-bazel-graph verification/omp-bazel-graph.json \
            --cargo-metadata-dir verification/cargo-metadata \
            --omp-rules-rust-toolchains release-ready/metadata/omp-rules-rust-toolchains.json

  render-channel:
    needs: [preflight, verify-release, verify-reuse]
    if: >-
      always() &&
      (needs.verify-release.result == 'success' || needs.verify-reuse.result == 'success')
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      artifact_attempt: ${{ github.run_attempt }}
    env:
      EXPECTED_PARENT: ${{ needs.preflight.outputs.parent_commit }}
      EXPECTED_SOURCE: ${{ needs.preflight.outputs.commit }}
      EXPECTED_OMP: ${{ needs.preflight.outputs.omp_commit }}
      OMP_TREE: ${{ needs.preflight.outputs.omp_tree }}
      OMP_VERSION: ${{ needs.preflight.outputs.omp_version }}
      OMP_BUILD_ID: ${{ needs.preflight.outputs.omp_build_id }}
      TAG: ${{ needs.preflight.outputs.tag }}
      BUILD_ID: ${{ needs.preflight.outputs.build_id }}
      BUILT_AT: ${{ needs.preflight.outputs.built_at }}
      BASE_VERSION: ${{ needs.preflight.outputs.base_version }}
      PROTOCOL: ${{ needs.preflight.outputs.protocol }}
      AUTHORIZATION_STATE: ${{ needs.preflight.outputs.authorization_state }}
      AUTHORIZATION_ACTION: ${{ needs.preflight.outputs.authorization_action }}
      RELEASE_READY_ATTEMPT: ${{ needs.verify-release.result == 'success' && needs.verify-release.outputs.release_ready_attempt || needs.verify-reuse.outputs.artifact_attempt }}
    steps:
      - name: Download immutable release plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: smarty-release-plan-${{ needs.preflight.outputs.artifact_attempt }}
          path: handoff

      - name: Download immutable candidate source archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: smarty-candidate-sources-${{ needs.preflight.outputs.artifact_attempt }}
          path: source-archives

      - name: Download exact sealed release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: smarty-release-ready-${{ env.RELEASE_READY_ATTEMPT }}
          path: release-ready

      - name: Generate legacy channel inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          def record(path):
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f"handoff file is not regular: {path}")
              data = path.read_bytes()
              return {"length": len(data), "sha256": hashlib.sha256(data).hexdigest()}

          plan = json.loads(Path("handoff/release-plan.json").read_text(encoding="utf-8"))
          expected = {
              "parent_commit": os.environ["EXPECTED_PARENT"],
              "source_commit": os.environ["EXPECTED_SOURCE"],
              "omp_commit": os.environ["EXPECTED_OMP"],
              "omp_tree": os.environ["OMP_TREE"],
              "omp_version": os.environ["OMP_VERSION"],
              "omp_build_id": os.environ["OMP_BUILD_ID"],
              "tag": os.environ["TAG"],
              "build_id": os.environ["BUILD_ID"],
              "built_at": os.environ["BUILT_AT"],
              "base_version": os.environ["BASE_VERSION"],
              "protocol": int(os.environ["PROTOCOL"]),
              "authorization_state": os.environ["AUTHORIZATION_STATE"],
              "authorization_action": os.environ["AUTHORIZATION_ACTION"],
          }
          if any(plan.get(key) != value for key, value in expected.items()):
              raise SystemExit("render release plan identity mismatch")
          for name, value in plan.get("source_archives", {}).items():
              if record(Path("source-archives") / name) != value:
                  raise SystemExit(f"render source archive mismatch: {name}")
          files = json.loads(Path("release-ready/handoff/release-files.json").read_text(encoding="utf-8"))
          root = Path("release-ready/release-assets")
          if files.get("schema") != 1 or not isinstance(files.get("files"), dict):
              raise SystemExit("render sealed file manifest is invalid")
          if {path.name for path in root.iterdir()} != set(files["files"]):
              raise SystemExit("render sealed file set mismatch")
          if len(files["files"]) != 37:
              raise SystemExit("render sealed file set is not the exact 37-file release set")
          for name, value in files["files"].items():
              if record(root / name) != value:
                  raise SystemExit(f"render sealed file mismatch: {name}")
          pair = json.loads((root / "smarty-pair.json").read_text(encoding="utf-8"))
          if (
              pair["release"]["tag"] != os.environ["TAG"]
              or pair["release"]["build_id"] != os.environ["BUILD_ID"]
              or pair["release"]["built_at"] != os.environ["BUILT_AT"]
              or pair["sources"]["herdr"]["commit"] != os.environ["EXPECTED_SOURCE"]
              or pair["sources"]["herdr"]["version"] != os.environ["BASE_VERSION"]
              or pair["sources"]["herdr"]["protocol"] != int(os.environ["PROTOCOL"])
              or pair["sources"]["omp"]["commit"] != os.environ["EXPECTED_OMP"]
              or pair["sources"]["omp"]["tree"] != os.environ["OMP_TREE"]
              or pair["sources"]["omp"]["version"] != os.environ["OMP_VERSION"]
              or pair["sources"]["omp"]["build_id"] != os.environ["OMP_BUILD_ID"]
              or pair["sources"]["parent"]["commit"] != os.environ["EXPECTED_PARENT"]
          ):
              raise SystemExit("sealed pair manifest does not bind the exact channel identity")
          payloads = {
              "linux-x86_64": "herdr-linux-x86_64",
              "linux-aarch64": "herdr-linux-aarch64",
              "macos-x86_64": "herdr-macos-x86_64",
              "macos-aarch64": "herdr-macos-aarch64",
              "windows-x86_64": "herdr-windows-x86_64.zip",
          }
          omp_payloads = {
              "linux-x86_64": "omp-linux-x86_64",
              "linux-aarch64": "omp-linux-aarch64",
              "macos-x86_64": "omp-macos-x86_64",
              "macos-aarch64": "omp-macos-aarch64",
          }
          Path("channel").mkdir()
          Path("channel/herdr-shas.json").write_text(
              json.dumps({key: files["files"][name]["sha256"] for key, name in payloads.items()}),
              encoding="utf-8",
          )
          Path("channel/omp-shas.json").write_text(
              json.dumps({key: files["files"][name]["sha256"] for key, name in omp_payloads.items()}),
              encoding="utf-8",
          )
          Path("channel/omp-source.json").write_text(
              json.dumps(
                  {
                      "repository": "Smarty-Pants-Inc/oh-my-pi",
                      "commit": os.environ["EXPECTED_OMP"],
                      "tree": os.environ["OMP_TREE"],
                      "version": os.environ["OMP_VERSION"],
                      "build_id": os.environ["OMP_BUILD_ID"],
                  }
              ),
              encoding="utf-8",
          )
          Path("channel/PREVIEW_NOTES.md").write_text(
              f"Smarty preview build {os.environ['BUILD_ID']}\n\nBuilt from {os.environ['EXPECTED_SOURCE']}.\n",
              encoding="utf-8",
          )
          snapshot = plan.get("channel_snapshot")
          if not isinstance(snapshot, dict) or set(snapshot) != {"commit", "files"}:
              raise SystemExit("render channel snapshot is invalid")
          commit = snapshot["commit"]
          records = snapshot["files"]
          if commit:
              if re.fullmatch(r"[0-9a-f]{40}", commit) is None or set(records) != {"preview.json", "install.sh"}:
                  raise SystemExit("render channel snapshot identity is invalid")
              for name, value in records.items():
                  if record(Path("handoff/channel-snapshot") / name) != value:
                      raise SystemExit(f"render channel snapshot mismatch: {name}")
          elif records:
              raise SystemExit("absent render channel snapshot has files")
          if not commit and os.environ["AUTHORIZATION_STATE"] in {"consumed", "canonical"}:
              raise SystemExit("an absent channel cannot have consumed authorization")
          Path("channel/snapshot-commit").write_text(commit + "\n", encoding="ascii")
          PY

      - name: Snapshot Smarty channel for rendering
        shell: bash
        run: |
          set -euo pipefail
          mkdir herdr-source
          tar -xf source-archives/herdr-source.tar -C herdr-source
          test -s channel/snapshot-commit
          if [ -s handoff/channel-snapshot/preview.json ]; then
            cp handoff/channel-snapshot/preview.json channel/previous-preview.json
            cp handoff/channel-snapshot/install.sh channel/previous-install.sh
            cp channel/previous-preview.json channel/rendered-preview.json
          fi

      - name: Render Smarty channel candidate
        shell: bash
        run: |
          set -euo pipefail
          if [ "$AUTHORIZATION_STATE" != lease ]; then
            cp channel/previous-preview.json channel/preview.json
            cp channel/previous-install.sh channel/install.sh
          else
            env -i \
              PATH="$PATH" \
              HOME="$HOME" \
              BASE_VERSION="$BASE_VERSION" \
              BUILT_AT="$BUILT_AT" \
              EXPECTED_PARENT="$EXPECTED_PARENT" \
              EXPECTED_SOURCE="$EXPECTED_SOURCE" \
              EXPECTED_OMP="$EXPECTED_OMP" \
              OMP_TREE="$OMP_TREE" \
              OMP_VERSION="$OMP_VERSION" \
              OMP_BUILD_ID="$OMP_BUILD_ID" \
              TAG="$TAG" \
              BUILD_ID="$BUILD_ID" \
              PROTOCOL="$PROTOCOL" \
              CHANNEL_RETAIN="$CHANNEL_RETAIN" \
              python3 -S herdr-source/scripts/preview.py manifest \
                --output channel/rendered-preview.json \
                --repo Smarty-Pants-Inc/herdr \
                --tag "$TAG" \
                --build-id "$BUILD_ID" \
                --commit "$EXPECTED_SOURCE" \
                --built-at "$BUILT_AT" \
                --base-version "$BASE_VERSION" \
                --protocol "$PROTOCOL" \
                --retain "$CHANNEL_RETAIN" \
                --notes channel/PREVIEW_NOTES.md \
                --sha-file channel/herdr-shas.json \
                --omp-source channel/omp-source.json \
                --omp-sha-file channel/omp-shas.json
            /usr/bin/env -i /usr/bin/python3 -S herdr-source/scripts/preview.py legacy-bootstrap-manifest \
              --paired channel/rendered-preview.json \
              --output channel/preview.json
            cp herdr-source/scripts/install-smarty.sh channel/install.sh
          fi

      - name: Verify rendered channel transition with candidate code
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/verify-channel.py" <<'PY'
          import json
          import os
          from pathlib import Path

          from scripts.preview import (
              canonical_manifest_from_legacy_bootstrap,
              validate_channel_transition,
              validate_legacy_bootstrap_manifest,
          )

          previous = None
          snapshot = Path("channel/previous-preview.json")
          if snapshot.is_file():
              previous = json.loads(snapshot.read_text(encoding="utf-8"))
              if previous.get("schema_version") == 2:
                  previous = canonical_manifest_from_legacy_bootstrap(previous)
          rendered = json.loads(Path("channel/preview.json").read_text(encoding="utf-8"))
          if os.environ["AUTHORIZATION_STATE"] == "canonical":
              candidate = rendered
          else:
              candidate = canonical_manifest_from_legacy_bootstrap(rendered)
              validate_legacy_bootstrap_manifest(rendered, candidate)
          validate_channel_transition(
              previous,
              candidate,
              expected_parent=os.environ["EXPECTED_PARENT"],
              expected_source=os.environ["EXPECTED_SOURCE"],
              expected_omp=os.environ["EXPECTED_OMP"],
              expected_omp_tree=os.environ["OMP_TREE"],
              expected_omp_version=os.environ["OMP_VERSION"],
              expected_omp_build_id=os.environ["OMP_BUILD_ID"],
              expected_tag=os.environ["TAG"],
              expected_build_id=os.environ["BUILD_ID"],
              expected_built_at=os.environ["BUILT_AT"],
              expected_base_version=os.environ["BASE_VERSION"],
              expected_protocol=int(os.environ["PROTOCOL"]),
              expected_herdr_shas=json.loads(
                  Path("channel/herdr-shas.json").read_text(encoding="utf-8")
              ),
              expected_omp_shas=json.loads(
                  Path("channel/omp-shas.json").read_text(encoding="utf-8")
              ),
              consumed=os.environ["AUTHORIZATION_STATE"] in {"consumed", "canonical"},
              retain=int(os.environ["CHANNEL_RETAIN"]),
          )
          PY
          env -i \
            PATH="$PATH" \
            HOME="$HOME" \
            PYTHONPATH=herdr-source \
            RUNNER_TEMP="$RUNNER_TEMP" \
            AUTHORIZATION_STATE="$AUTHORIZATION_STATE" \
            BASE_VERSION="$BASE_VERSION" \
            BUILT_AT="$BUILT_AT" \
            EXPECTED_PARENT="$EXPECTED_PARENT" \
            EXPECTED_SOURCE="$EXPECTED_SOURCE" \
            EXPECTED_OMP="$EXPECTED_OMP" \
            OMP_TREE="$OMP_TREE" \
            OMP_VERSION="$OMP_VERSION" \
            OMP_BUILD_ID="$OMP_BUILD_ID" \
            TAG="$TAG" \
            BUILD_ID="$BUILD_ID" \
            PROTOCOL="$PROTOCOL" \
            CHANNEL_RETAIN="$CHANNEL_RETAIN" \
            python3 -S "$RUNNER_TEMP/verify-channel.py"

      - name: Seal exact rendered channel candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("channel")
          names = {"preview.json", "install.sh"}
          for name in names:
              path = root / name
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f"rendered channel file is not regular: {name}")
          files = {
              name: {
                  "length": (root / name).stat().st_size,
                  "sha256": hashlib.sha256((root / name).read_bytes()).hexdigest(),
              }
              for name in sorted(names)
          }
          (root / "channel-files.json").write_text(
              json.dumps({"schema": 1, "files": files}, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload exact rendered channel candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smarty-channel-candidate-${{ github.run_attempt }}
          path: |
            channel/preview.json
            channel/install.sh
            channel/channel-files.json
          if-no-files-found: error
          compression-level: 0

  reuse-release:
    needs: preflight
    if: needs.preflight.outputs.should_build == 'false'
    runs-on: ubuntu-latest
    environment: smarty-release
    permissions:
      contents: read
    outputs:
      artifact_attempt: ${{ github.run_attempt }}
    env:
      REPOSITORY: Smarty-Pants-Inc/herdr
      TAG: ${{ needs.preflight.outputs.tag }}
      EXPECTED_SOURCE: ${{ needs.preflight.outputs.commit }}
    steps:
      - name: Fetch exact immutable release before build reuse
        shell: /bin/bash
        env:
          GH_TOKEN: ${{ secrets.SMARTY_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          /usr/bin/gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$REPOSITORY/releases/tags/$TAG" > release.json
          /usr/bin/python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads(Path("release.json").read_text(encoding="utf-8"))
          if (
              release.get("tag_name") != os.environ["TAG"]
              or release.get("target_commitish") != os.environ["EXPECTED_SOURCE"]
              or release.get("draft") is not False
              or release.get("prerelease") is not True
              or release.get("immutable") is not True
          ):
              raise SystemExit("existing release is not the exact immutable preview")
          PY
          mkdir -p reuse-ready/release-assets reuse-ready/handoff
          /usr/bin/gh release download "$TAG" --repo "$REPOSITORY" --dir reuse-ready/release-assets

      - name: Verify exact immutable release bytes before build reuse
        shell: /bin/bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -S - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          payloads = (
              "herdr-linux-x86_64", "herdr-linux-aarch64", "herdr-macos-x86_64",
              "herdr-macos-aarch64", "herdr-windows-x86_64.zip", "omp-linux-x86_64",
              "omp-linux-aarch64", "omp-macos-x86_64", "omp-macos-aarch64",
              "pi_natives.linux-x64-baseline.node", "pi_natives.linux-x64-modern.node",
              "pi_natives.linux-arm64.node", "pi_natives.darwin-x64-baseline.node",
              "pi_natives.darwin-arm64.node",
          )
          metadata = (
              "smarty-pair.json", "smarty-pair.spdx.json",
              "smarty-provenance-linux-x86_64.sigstore.json",
              "smarty-provenance-linux-aarch64.sigstore.json",
              "smarty-provenance-macos-x86_64.sigstore.json",
              "smarty-provenance-macos-aarch64.sigstore.json",
              "smarty-provenance-windows-x86_64.sigstore.json",
              "smarty-pair.provenance.sigstore.json", "smarty-pair.spdx.sigstore.json",
          )
          expected = set(payloads) | {f"{name}.sha256" for name in payloads} | set(metadata)
          root = Path("reuse-ready/release-assets")
          paths = list(root.iterdir())
          if {path.name for path in paths} != expected or any(not path.is_file() or path.is_symlink() for path in paths):
              raise SystemExit("reused release does not match the exact 37-name allow-list")
          files = {}
          for name in sorted(expected):
              data = (root / name).read_bytes()
              files[name] = {"length": len(data), "sha256": hashlib.sha256(data).hexdigest()}
          Path("reuse-ready/handoff/release-files.json").write_text(
              json.dumps({"schema": 1, "files": files}, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify exact immutable release attestations before build reuse
        shell: /bin/bash
        env:
          GH_TOKEN: ${{ secrets.SMARTY_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          verify() {
            local bundle="$1" predicate="$2"
            shift 2
            local subject
            for subject in "$@"; do
              /usr/bin/gh attestation verify "reuse-ready/release-assets/$subject" \
                --repo "$REPOSITORY" \
                --bundle "reuse-ready/release-assets/$bundle" \
                --signer-workflow "$REPOSITORY/.github/workflows/smarty-preview.yml" \
                --signer-digest "$EXPECTED_SOURCE" \
                --source-ref "refs/tags/$TAG" \
                --source-digest "$EXPECTED_SOURCE" \
                --deny-self-hosted-runners \
                --predicate-type "$predicate"
            done
          }
          verify smarty-provenance-linux-x86_64.sigstore.json https://slsa.dev/provenance/v1 herdr-linux-x86_64 omp-linux-x86_64 pi_natives.linux-x64-baseline.node pi_natives.linux-x64-modern.node
          verify smarty-provenance-linux-aarch64.sigstore.json https://slsa.dev/provenance/v1 herdr-linux-aarch64 omp-linux-aarch64 pi_natives.linux-arm64.node
          verify smarty-provenance-macos-x86_64.sigstore.json https://slsa.dev/provenance/v1 herdr-macos-x86_64 omp-macos-x86_64 pi_natives.darwin-x64-baseline.node
          verify smarty-provenance-macos-aarch64.sigstore.json https://slsa.dev/provenance/v1 herdr-macos-aarch64 omp-macos-aarch64 pi_natives.darwin-arm64.node
          verify smarty-provenance-windows-x86_64.sigstore.json https://slsa.dev/provenance/v1 herdr-windows-x86_64.zip
          verify smarty-pair.spdx.sigstore.json https://spdx.dev/Document/v2.3 herdr-linux-x86_64 herdr-linux-aarch64 herdr-macos-x86_64 herdr-macos-aarch64 herdr-windows-x86_64.zip omp-linux-x86_64 omp-linux-aarch64 omp-macos-x86_64 omp-macos-aarch64 pi_natives.linux-x64-baseline.node pi_natives.linux-x64-modern.node pi_natives.linux-arm64.node pi_natives.darwin-x64-baseline.node pi_natives.darwin-arm64.node smarty-pair.spdx.json
          verify smarty-pair.provenance.sigstore.json https://slsa.dev/provenance/v1 smarty-pair.json

      - name: Upload exact immutable release reuse
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smarty-release-reuse-${{ github.run_attempt }}
          path: |
            reuse-ready/release-assets
            reuse-ready/handoff/release-files.json
          if-no-files-found: error
          compression-level: 0

  verify-reuse:
    needs: [preflight, reuse-release]
    if: >-
      always() &&
      needs.preflight.outputs.should_build == 'false' &&
      needs.reuse-release.result == 'success'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      artifact_attempt: ${{ github.run_attempt }}
    env:
      EXPECTED_PARENT: ${{ needs.preflight.outputs.parent_commit }}
      EXPECTED_SOURCE: ${{ needs.preflight.outputs.commit }}
      EXPECTED_OMP: ${{ needs.preflight.outputs.omp_commit }}
      PARENT_TREE: ${{ needs.preflight.outputs.parent_tree }}
      SOURCE_TREE: ${{ needs.preflight.outputs.source_tree }}
      OMP_TREE: ${{ needs.preflight.outputs.omp_tree }}
      OMP_VERSION: ${{ needs.preflight.outputs.omp_version }}
      OMP_BUILD_ID: ${{ needs.preflight.outputs.omp_build_id }}
      TAG: ${{ needs.preflight.outputs.tag }}
      BUILD_ID: ${{ needs.preflight.outputs.build_id }}
      BUILT_AT: ${{ needs.preflight.outputs.built_at }}
      BASE_VERSION: ${{ needs.preflight.outputs.base_version }}
      PROTOCOL: ${{ needs.preflight.outputs.protocol }}
      EXPECTED_VERIFIER_SHA256: ${{ needs.preflight.outputs.trusted_verifier_sha256 }}
      EXPECTED_PLAN_SHA256: ${{ needs.preflight.outputs.release_plan_sha256 }}
    steps:
      - name: Download immutable release plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: smarty-release-plan-${{ needs.preflight.outputs.artifact_attempt }}
          path: plan

      - name: Download exact immutable release reuse
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: smarty-release-reuse-${{ needs.reuse-release.outputs.artifact_attempt }}
          path: reuse-ready

      - name: Verify reused release bytes and exact 37-file identity
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          root = Path("reuse-ready/release-assets")
          payloads = (
              "herdr-linux-x86_64", "herdr-linux-aarch64", "herdr-macos-x86_64",
              "herdr-macos-aarch64", "herdr-windows-x86_64.zip", "omp-linux-x86_64",
              "omp-linux-aarch64", "omp-macos-x86_64", "omp-macos-aarch64",
              "pi_natives.linux-x64-baseline.node", "pi_natives.linux-x64-modern.node",
              "pi_natives.linux-arm64.node", "pi_natives.darwin-x64-baseline.node",
              "pi_natives.darwin-arm64.node",
          )
          platforms = ("linux-x86_64", "linux-aarch64", "macos-x86_64", "macos-aarch64", "windows-x86_64")
          provenance = tuple(f"smarty-provenance-{platform}.sigstore.json" for platform in platforms)
          sidecars = tuple(f"{name}.sha256" for name in payloads)
          evidence = ("smarty-pair.spdx.json", *provenance, "smarty-pair.spdx.sigstore.json")
          metadata = ("smarty-pair.json", "smarty-pair.provenance.sigstore.json", *evidence)
          expected = set(payloads) | set(sidecars) | set(metadata)
          if len(expected) != 37:
              raise SystemExit("reuse allow-list is not the exact 37-file release set")
          paths = list(root.iterdir())
          if {path.name for path in paths} != expected or any(not path.is_file() or path.is_symlink() for path in paths):
              raise SystemExit("reused release does not match the exact 37-file allow-list")
          sealed = json.loads(Path("reuse-ready/handoff/release-files.json").read_text(encoding="utf-8"))
          if sealed.get("schema") != 1 or set(sealed.get("files", {})) != expected:
              raise SystemExit("reused release file manifest is invalid")
          digests = {}
          for name in sorted(expected):
              data = (root / name).read_bytes()
              digests[name] = hashlib.sha256(data).hexdigest()
              record = sealed["files"][name]
              if record.get("length") != len(data) or record.get("sha256") != digests[name]:
                  raise SystemExit(f"reused release transferred bytes mismatch: {name}")
          for name in payloads:
              if (root / f"{name}.sha256").read_text(encoding="ascii").split() != [digests[name], name]:
                  raise SystemExit(f"reused release checksum sidecar mismatch: {name}")
          plan = json.loads(Path("plan/release-plan.json").read_text(encoding="utf-8"))
          expected_plan = {
              "parent_commit": os.environ["EXPECTED_PARENT"],
              "source_commit": os.environ["EXPECTED_SOURCE"],
              "omp_commit": os.environ["EXPECTED_OMP"],
              "parent_tree": os.environ["PARENT_TREE"],
              "source_tree": os.environ["SOURCE_TREE"],
              "omp_tree": os.environ["OMP_TREE"],
              "omp_version": os.environ["OMP_VERSION"],
              "omp_build_id": os.environ["OMP_BUILD_ID"],
              "tag": os.environ["TAG"],
              "build_id": os.environ["BUILD_ID"],
              "built_at": os.environ["BUILT_AT"],
              "base_version": os.environ["BASE_VERSION"],
              "protocol": int(os.environ["PROTOCOL"]),
          }
          if any(plan.get(key) != value for key, value in expected_plan.items()):
              raise SystemExit("reuse release plan identity mismatch")
          if re.fullmatch(
              rf"\d{{4}}-\d{{2}}-\d{{2}}-p{os.environ['EXPECTED_PARENT']}-r{os.environ['EXPECTED_SOURCE']}-o{os.environ['EXPECTED_OMP']}",
              os.environ["BUILD_ID"],
          ) is None:
              raise SystemExit("reuse build ID does not bind exact P/R/O")
          pair = json.loads((root / "smarty-pair.json").read_text(encoding="utf-8"))
          if set(pair) != {
              "schema", "pair_id", "release", "sources", "toolchains",
              "lock_inputs", "platforms", "artifacts", "evidence", "verification",
          } or pair.get("schema") != "smarty.paired-release.v1":
              raise SystemExit("reused pair manifest has unexpected fields")
          material = b"smarty.paired-release.v1\0" + b"\0".join(
              os.environ[name].encode("ascii")
              for name in ("EXPECTED_PARENT", "EXPECTED_SOURCE", "EXPECTED_OMP")
          )
          if pair.get("pair_id") != hashlib.sha256(material).hexdigest():
              raise SystemExit("reused pair manifest pair ID mismatch")
          if pair.get("release") != {
              "repository": "Smarty-Pants-Inc/herdr",
              "tag": os.environ["TAG"],
              "build_id": os.environ["BUILD_ID"],
              "built_at": os.environ["BUILT_AT"],
              "immutable": True,
          }:
              raise SystemExit("reused pair manifest release identity mismatch")
          if pair.get("sources") != {
              "parent": {
                  "repository": "Smarty-Pants-Inc/smarty-dev",
                  "commit": os.environ["EXPECTED_PARENT"],
                  "tree": os.environ["PARENT_TREE"],
              },
              "herdr": {
                  "repository": "Smarty-Pants-Inc/herdr",
                  "commit": os.environ["EXPECTED_SOURCE"],
                  "tree": os.environ["SOURCE_TREE"],
                  "version": os.environ["BASE_VERSION"],
                  "build_id": os.environ["BUILD_ID"],
                  "protocol": int(os.environ["PROTOCOL"]),
              },
              "omp": {
                  "repository": "Smarty-Pants-Inc/oh-my-pi",
                  "commit": os.environ["EXPECTED_OMP"],
                  "tree": os.environ["OMP_TREE"],
                  "version": os.environ["OMP_VERSION"],
                  "build_id": os.environ["OMP_BUILD_ID"],
              },
          }:
              raise SystemExit("reused pair manifest source identity mismatch")
          prefix = f"https://github.com/Smarty-Pants-Inc/herdr/releases/download/{os.environ['TAG']}/"
          artifacts = pair.get("artifacts")
          if not isinstance(artifacts, dict) or set(artifacts) != set(payloads + sidecars):
              raise SystemExit("reused pair manifest artifact allow-list mismatch")
          for name in payloads + sidecars:
              record = artifacts[name]
              if (
                  not isinstance(record, dict)
                  or record.get("length") != (root / name).stat().st_size
                  or record.get("sha256") != digests[name]
                  or record.get("url") != prefix + name
              ):
                  raise SystemExit(f"reused pair manifest artifact record mismatch: {name}")
          evidence_records = pair.get("evidence")
          if not isinstance(evidence_records, dict) or set(evidence_records) != set(evidence):
              raise SystemExit("reused pair manifest evidence allow-list mismatch")
          for name in evidence:
              record = evidence_records[name]
              if (
                  not isinstance(record, dict)
                  or set(record) != {"length", "sha256", "url"}
                  or record.get("length") != (root / name).stat().st_size
                  or record.get("sha256") != digests[name]
                  or record.get("url") != prefix + name
              ):
                  raise SystemExit(f"reused pair manifest evidence record mismatch: {name}")
          plan_path = Path("plan/release-plan.json")
          if hashlib.sha256(plan_path.read_bytes()).hexdigest() != os.environ["EXPECTED_PLAN_SHA256"]:
              raise SystemExit("reuse release plan digest mismatch")
          verifier = Path("plan/trusted-release-verifier.py")
          verifier_data = verifier.read_bytes()
          if (
              verifier.is_symlink()
              or hashlib.sha256(verifier_data).hexdigest() != os.environ["EXPECTED_VERIFIER_SHA256"]
              or pair["verification"]["verifier"] != {
                  "length": len(verifier_data),
                  "sha256": hashlib.sha256(verifier_data).hexdigest(),
              }
          ):
              raise SystemExit("reused pair manifest trusted verifier mismatch")
          archive_root = Path("plan/source-archives")
          archive_records = {}
          for name in ("herdr-source.tar", "omp-source.tar"):
              data = (archive_root / name).read_bytes()
              archive_records[name] = {
                  "length": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              }
          if pair["verification"]["source_archives"] != archive_records:
              raise SystemExit("reused pair manifest trusted source archives mismatch")
          if pair["verification"]["spdx"] != {
              "length": (root / "smarty-pair.spdx.json").stat().st_size,
              "sha256": digests["smarty-pair.spdx.json"],
          }:
              raise SystemExit("reused pair manifest verified SPDX record mismatch")
          PY
          /bin/rm -rf trusted-source-*
          index=0
          for archive in plan/source-archives/*.tar; do
            /bin/mkdir "trusted-source-$index"
            /bin/tar -xf "$archive" -C "trusted-source-$index"
            index=$((index + 1))
          done
          test "$index" = 2
          herdr_root=
          omp_root=
          for root in trusted-source-*; do
            if [ -f "$root/src/protocol/wire.rs" ]; then
              herdr_root="$root"
            elif [ -f "$root/packages/coding-agent/package.json" ]; then
              omp_root="$root"
            fi
          done
          test -n "$herdr_root"
          test -n "$omp_root"
          python3 -I -S plan/trusted-release-verifier.py verify-attested-pair \
            --asset-dir reuse-ready/release-assets \
            --expected-parent "$EXPECTED_PARENT" \
            --expected-source "$EXPECTED_SOURCE" \
            --expected-omp "$EXPECTED_OMP" \
            --expected-parent-tree "$PARENT_TREE" \
            --expected-source-tree "$SOURCE_TREE" \
            --expected-omp-tree "$OMP_TREE" \
            --expected-tag "$TAG" \
            --expected-build-id "$BUILD_ID" \
            --herdr-root "$herdr_root" \
            --omp-root "$omp_root" \
            --trusted-verifier plan/trusted-release-verifier.py \
            --source-archive-dir plan/source-archives

      - name: Seal verified reuse as the exact release handoff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets handoff source-archives
          cp -R reuse-ready/release-assets/. release-assets/
          cp plan/release-plan.json plan/trusted-release-verifier.py plan/install-smarty.sh handoff/
          cp -R plan/channel-snapshot handoff/channel-snapshot
          cp -R plan/source-archives/. source-archives/
          cp reuse-ready/handoff/release-files.json handoff/release-files.json
          python3 -I -S - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          sealed = json.loads(Path("handoff/release-files.json").read_text(encoding="utf-8"))
          root = Path("release-assets")
          paths = list(root.iterdir())
          if {path.name for path in paths} != set(sealed["files"]) or any(
              not path.is_file() or path.is_symlink() for path in paths
          ):
              raise SystemExit("sealed reuse handoff file set mismatch")
          for name, record in sealed["files"].items():
              data = (root / name).read_bytes()
              if len(data) != record["length"] or hashlib.sha256(data).hexdigest() != record["sha256"]:
                  raise SystemExit(f"sealed reuse handoff digest mismatch: {name}")
          PY

      - name: Upload exact sealed release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smarty-release-ready-${{ github.run_attempt }}
          path: |
            release-assets
            handoff
            source-archives
          if-no-files-found: error
          compression-level: 0

  publish-release:
    needs: [preflight, verify-release]
    if: >-
      always() &&
      needs.preflight.outputs.should_build == 'true' &&
      needs.verify-release.result == 'success'
    runs-on: ubuntu-latest
    environment: smarty-release
    permissions:
      contents: write
    outputs:
      release_ready_attempt: ${{ needs.verify-release.outputs.release_ready_attempt }}
    env:
      REPOSITORY: Smarty-Pants-Inc/herdr
      EXPECTED_PARENT: ${{ needs.preflight.outputs.parent_commit }}
      EXPECTED_SOURCE: ${{ needs.preflight.outputs.commit }}
      EXPECTED_OMP: ${{ needs.preflight.outputs.omp_commit }}
      PARENT_TREE: ${{ needs.preflight.outputs.parent_tree }}
      SOURCE_TREE: ${{ needs.preflight.outputs.source_tree }}
      OMP_TREE: ${{ needs.preflight.outputs.omp_tree }}
      OMP_VERSION: ${{ needs.preflight.outputs.omp_version }}
      OMP_BUILD_ID: ${{ needs.preflight.outputs.omp_build_id }}
      TAG: ${{ needs.preflight.outputs.tag }}
      BUILD_ID: ${{ needs.preflight.outputs.build_id }}
      BUILT_AT: ${{ needs.preflight.outputs.built_at }}
      BASE_VERSION: ${{ needs.preflight.outputs.base_version }}
      PROTOCOL: ${{ needs.preflight.outputs.protocol }}
      EXPECTED_VERIFIER_SHA256: ${{ needs.preflight.outputs.trusted_verifier_sha256 }}
      EXPECTED_PLAN_SHA256: ${{ needs.preflight.outputs.release_plan_sha256 }}
      RELEASE_READY_ATTEMPT: ${{ needs.verify-release.outputs.release_ready_attempt }}
    steps:
      - name: Download exact sealed release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: smarty-release-ready-${{ env.RELEASE_READY_ATTEMPT }}
          path: release-ready

      - name: Verify publication prerequisites
        shell: /bin/bash
        env:
          GH_TOKEN: ${{ secrets.SMARTY_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || {
            echo "::error::SMARTY_RELEASE_TOKEN is required in the smarty-release environment"
            exit 1
          }
          test "$(/usr/bin/gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$REPOSITORY/immutable-releases" --jq .enabled)" = true
          test "$(/usr/bin/gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$REPOSITORY/git/ref/tags/$TAG" --jq .object.type)" = commit
          test "$(/usr/bin/gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)" = "$EXPECTED_SOURCE"

      - name: Verify sealed release bytes before publication
        shell: /bin/bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -S - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          root = Path("release-ready/release-assets")
          payloads = (
              "herdr-linux-x86_64", "herdr-linux-aarch64", "herdr-macos-x86_64",
              "herdr-macos-aarch64", "herdr-windows-x86_64.zip", "omp-linux-x86_64",
              "omp-linux-aarch64", "omp-macos-x86_64", "omp-macos-aarch64",
              "pi_natives.linux-x64-baseline.node", "pi_natives.linux-x64-modern.node",
              "pi_natives.linux-arm64.node", "pi_natives.darwin-x64-baseline.node",
              "pi_natives.darwin-arm64.node",
          )
          platforms = ("linux-x86_64", "linux-aarch64", "macos-x86_64", "macos-aarch64", "windows-x86_64")
          provenance = tuple(f"smarty-provenance-{platform}.sigstore.json" for platform in platforms)
          sidecars = tuple(f"{name}.sha256" for name in payloads)
          evidence = ("smarty-pair.spdx.json", *provenance, "smarty-pair.spdx.sigstore.json")
          metadata = ("smarty-pair.json", "smarty-pair.provenance.sigstore.json", *evidence)
          expected = set(payloads) | set(sidecars) | set(metadata)
          if len(expected) != 37:
              raise SystemExit("publication allow-list is not the exact 37-file release set")
          paths = list(root.iterdir())
          if {path.name for path in paths} != expected or any(not path.is_file() or path.is_symlink() for path in paths):
              raise SystemExit("sealed release does not match the exact 37-file allow-list")
          sealed = json.loads(Path("release-ready/handoff/release-files.json").read_text(encoding="utf-8"))
          if sealed.get("schema") != 1 or set(sealed.get("files", {})) != expected:
              raise SystemExit("sealed release file manifest is invalid")
          digests = {}
          for name in sorted(expected):
              data = (root / name).read_bytes()
              digests[name] = hashlib.sha256(data).hexdigest()
              record = sealed["files"][name]
              if record.get("length") != len(data) or record.get("sha256") != digests[name]:
                  raise SystemExit(f"sealed release transferred bytes mismatch: {name}")
          for name in payloads:
              if (root / f"{name}.sha256").read_text(encoding="ascii").split() != [digests[name], name]:
                  raise SystemExit(f"sealed release checksum sidecar mismatch: {name}")
          if re.fullmatch(
              rf"\d{{4}}-\d{{2}}-\d{{2}}-p{os.environ['EXPECTED_PARENT']}-r{os.environ['EXPECTED_SOURCE']}-o{os.environ['EXPECTED_OMP']}",
              os.environ["BUILD_ID"],
          ) is None:
              raise SystemExit("publication build ID does not bind exact P/R/O")
          if os.environ["TAG"] != f"smarty-preview-{os.environ['BUILD_ID']}":
              raise SystemExit("publication tag does not match the paired build ID")
          pair = json.loads((root / "smarty-pair.json").read_text(encoding="utf-8"))
          material = b"smarty.paired-release.v1\0" + b"\0".join(
              os.environ[name].encode("ascii")
              for name in ("EXPECTED_PARENT", "EXPECTED_SOURCE", "EXPECTED_OMP")
          )
          if (
              pair.get("schema") != "smarty.paired-release.v1"
              or pair.get("pair_id") != hashlib.sha256(material).hexdigest()
              or pair.get("release") != {
                  "repository": "Smarty-Pants-Inc/herdr",
                  "tag": os.environ["TAG"],
                  "build_id": os.environ["BUILD_ID"],
                  "built_at": os.environ["BUILT_AT"],
                  "immutable": True,
              }
              or pair["sources"]["herdr"]["commit"] != os.environ["EXPECTED_SOURCE"]
              or pair["sources"]["herdr"]["version"] != os.environ["BASE_VERSION"]
              or pair["sources"]["herdr"]["protocol"] != int(os.environ["PROTOCOL"])
              or pair["sources"]["parent"]["commit"] != os.environ["EXPECTED_PARENT"]
              or pair["sources"]["omp"]["commit"] != os.environ["EXPECTED_OMP"]
          ):
              raise SystemExit("sealed pair manifest identity mismatch")
          Path("release-names").write_text("".join(f"{name}\n" for name in sorted(expected)), encoding="ascii")
          PY
          /bin/rm -rf trusted-source-*
          index=0
          for archive in release-ready/source-archives/*.tar; do
            /bin/mkdir "trusted-source-$index"
            /bin/tar -xf "$archive" -C "trusted-source-$index"
            index=$((index + 1))
          done
          test "$index" = 2
          herdr_root=
          omp_root=
          for root in trusted-source-*; do
            if [ -f "$root/src/protocol/wire.rs" ]; then
              herdr_root="$root"
            elif [ -f "$root/packages/coding-agent/package.json" ]; then
              omp_root="$root"
            fi
          done
          test -n "$herdr_root"
          test -n "$omp_root"
          test "$(/usr/bin/sha256sum release-ready/handoff/trusted-release-verifier.py | /usr/bin/cut -d' ' -f1)" = "$EXPECTED_VERIFIER_SHA256"
          test "$(/usr/bin/sha256sum release-ready/handoff/release-plan.json | /usr/bin/cut -d' ' -f1)" = "$EXPECTED_PLAN_SHA256"
          graphs=(release-ready/metadata/*-graph.json)
          test "${#graphs[@]}" = 1
          python3 -I -S release-ready/handoff/trusted-release-verifier.py verify-pair \
            --asset-dir release-ready/release-assets \
            --expected-parent "$EXPECTED_PARENT" \
            --expected-source "$EXPECTED_SOURCE" \
            --expected-omp "$EXPECTED_OMP" \
            --expected-parent-tree "$PARENT_TREE" \
            --expected-source-tree "$SOURCE_TREE" \
            --expected-omp-tree "$OMP_TREE" \
            --expected-tag "$TAG" \
            --expected-build-id "$BUILD_ID" \
            --herdr-root "$herdr_root" \
            --omp-root "$omp_root" \
            --trusted-verifier release-ready/handoff/trusted-release-verifier.py \
            --source-archive-dir release-ready/source-archives \
            --native-graph "${graphs[0]}" \
            --dependency-metadata release-ready/metadata/cargo-metadata \
            --omp-rules-rust-toolchains release-ready/metadata/omp-rules-rust-toolchains.json

      - name: Create or reconcile draft-first paired release
        shell: /bin/bash
        env:
          GH_TOKEN: ${{ secrets.SMARTY_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          assets=()
          while IFS= read -r name; do
            assets+=("release-ready/release-assets/$name")
          done < release-names
          test "${#assets[@]}" -eq 37
          /usr/bin/printf 'Smarty preview build %s\n\nBuilt from %s.\n' "$BUILD_ID" "$EXPECTED_SOURCE" > notes.md
          if /usr/bin/gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$REPOSITORY/releases/tags/$TAG" > existing.json 2>/dev/null; then
            state="$(/usr/bin/python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads(Path("existing.json").read_text(encoding="utf-8"))
          identity = (
              release.get("tag_name") == os.environ["TAG"]
              and release.get("target_commitish") == os.environ["EXPECTED_SOURCE"]
              and release.get("prerelease") is True
          )
          if identity and release.get("draft") is True and release.get("immutable") is False:
              print("draft")
          elif identity and release.get("draft") is False and release.get("immutable") is True:
              print("published")
          else:
              raise SystemExit("existing release is not an exact reconcilable preview state")
          PY
            )"
            if [ "$state" = draft ]; then
              /usr/bin/gh release upload "$TAG" "${assets[@]}" --repo "$REPOSITORY" --clobber
            else
              : > publication-already-complete
            fi
          else
            /usr/bin/gh release create "$TAG" "${assets[@]}" \
              --repo "$REPOSITORY" \
              --target "$EXPECTED_SOURCE" \
              --title "Smarty preview build $BUILD_ID" \
              --notes-file notes.md \
              --draft \
              --prerelease
          fi

      - name: Fetch reconciled draft release
        shell: /bin/bash
        env:
          GH_TOKEN: ${{ secrets.SMARTY_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          /usr/bin/gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$REPOSITORY/releases/tags/$TAG" > draft.json
          /bin/mkdir -p draft-assets
          /usr/bin/gh release download "$TAG" --repo "$REPOSITORY" --dir draft-assets --clobber

      - name: Verify reconciled draft bytes
        shell: /bin/bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -S - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          release = json.loads(Path("draft.json").read_text(encoding="utf-8"))

          if (
              release.get("tag_name") != os.environ["TAG"]
              or release.get("target_commitish") != os.environ["EXPECTED_SOURCE"]
              or release.get("prerelease") is not True
              or (
                  (release.get("draft"), release.get("immutable"))
                  not in ((True, False), (False, True))
              )
          ):
              raise SystemExit("reconciled release is not an exact preview state")
          sealed = json.loads(Path("release-ready/handoff/release-files.json").read_text(encoding="utf-8"))
          expected = sealed["files"]
          assets = release.get("assets")
          if not isinstance(assets, list) or len(assets) != 37:
              raise SystemExit("reconciled draft does not have the exact 37 assets")
          if {asset.get("name") for asset in assets} != set(expected):
              raise SystemExit("reconciled draft asset set mismatch")
          if any(asset.get("state") != "uploaded" for asset in assets):
              raise SystemExit("reconciled draft has assets that are not uploaded")
          root = Path("draft-assets")
          paths = list(root.iterdir())
          if {path.name for path in paths} != set(expected) or any(
              not path.is_file() or path.is_symlink() for path in paths
          ):
              raise SystemExit("downloaded draft assets do not match the exact 37-file allow-list")
          for name, record in expected.items():
              data = (root / name).read_bytes()
              if len(data) != record["length"] or hashlib.sha256(data).hexdigest() != record["sha256"]:
                  raise SystemExit(f"reconciled draft byte mismatch: {name}")
          PY

      - name: Verify reconciled draft attestations
        shell: /bin/bash
        env:
          GH_TOKEN: ${{ secrets.SMARTY_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          verify() {
            local bundle="$1" predicate="$2"
            shift 2
            local subject
            for subject in "$@"; do
              /usr/bin/gh attestation verify "draft-assets/$subject" \
                --repo "$REPOSITORY" \
                --bundle "draft-assets/$bundle" \
                --signer-workflow "$REPOSITORY/.github/workflows/smarty-preview.yml" \
                --signer-digest "$EXPECTED_SOURCE" \
                --source-ref "refs/tags/$TAG" \
                --source-digest "$EXPECTED_SOURCE" \
                --deny-self-hosted-runners \
                --predicate-type "$predicate"
            done
          }
          verify smarty-provenance-linux-x86_64.sigstore.json https://slsa.dev/provenance/v1 herdr-linux-x86_64 omp-linux-x86_64 pi_natives.linux-x64-baseline.node pi_natives.linux-x64-modern.node
          verify smarty-provenance-linux-aarch64.sigstore.json https://slsa.dev/provenance/v1 herdr-linux-aarch64 omp-linux-aarch64 pi_natives.linux-arm64.node
          verify smarty-provenance-macos-x86_64.sigstore.json https://slsa.dev/provenance/v1 herdr-macos-x86_64 omp-macos-x86_64 pi_natives.darwin-x64-baseline.node
          verify smarty-provenance-macos-aarch64.sigstore.json https://slsa.dev/provenance/v1 herdr-macos-aarch64 omp-macos-aarch64 pi_natives.darwin-arm64.node
          verify smarty-provenance-windows-x86_64.sigstore.json https://slsa.dev/provenance/v1 herdr-windows-x86_64.zip
          verify smarty-pair.spdx.sigstore.json https://spdx.dev/Document/v2.3 herdr-linux-x86_64 herdr-linux-aarch64 herdr-macos-x86_64 herdr-macos-aarch64 herdr-windows-x86_64.zip omp-linux-x86_64 omp-linux-aarch64 omp-macos-x86_64 omp-macos-aarch64 pi_natives.linux-x64-baseline.node pi_natives.linux-x64-modern.node pi_natives.linux-arm64.node pi_natives.darwin-x64-baseline.node pi_natives.darwin-arm64.node smarty-pair.spdx.json
          verify smarty-pair.provenance.sigstore.json https://slsa.dev/provenance/v1 smarty-pair.json

      - name: Publish verified draft
        shell: /bin/bash
        env:
          GH_TOKEN: ${{ secrets.SMARTY_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -f publication-already-complete ]; then
            /usr/bin/gh release edit "$TAG" \
              --repo "$REPOSITORY" \
              --draft=false \
              --prerelease=true \
              --latest=false
          fi
          /usr/bin/gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$REPOSITORY/releases/tags/$TAG" > published.json
          /usr/bin/python3 -I -S - <<'PY'
          import json
          import os
          from pathlib import Path

          release = json.loads(Path("published.json").read_text(encoding="utf-8"))
          if (
              release.get("tag_name") != os.environ["TAG"]
              or release.get("target_commitish") != os.environ["EXPECTED_SOURCE"]
              or release.get("draft") is not False
              or release.get("prerelease") is not True
              or release.get("immutable") is not True
          ):
              raise SystemExit("published release is not the exact immutable preview")
          PY

  verify-publication:
    needs: [preflight, publish-release, verify-reuse]
    if: >-
      always() &&
      (needs.publish-release.result == 'success' || needs.verify-reuse.result == 'success')
    runs-on: ubuntu-latest
    environment: smarty-release
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_attempt: ${{ github.run_attempt }}
    env:
      REPOSITORY: Smarty-Pants-Inc/herdr
      EXPECTED_PARENT: ${{ needs.preflight.outputs.parent_commit }}
      EXPECTED_SOURCE: ${{ needs.preflight.outputs.commit }}
      EXPECTED_OMP: ${{ needs.preflight.outputs.omp_commit }}
      PARENT_TREE: ${{ needs.preflight.outputs.parent_tree }}
      SOURCE_TREE: ${{ needs.preflight.outputs.source_tree }}
      OMP_TREE: ${{ needs.preflight.outputs.omp_tree }}
      OMP_VERSION: ${{ needs.preflight.outputs.omp_version }}
      OMP_BUILD_ID: ${{ needs.preflight.outputs.omp_build_id }}
      TAG: ${{ needs.preflight.outputs.tag }}
      BUILD_ID: ${{ needs.preflight.outputs.build_id }}
      BUILT_AT: ${{ needs.preflight.outputs.built_at }}
      BASE_VERSION: ${{ needs.preflight.outputs.base_version }}
      PROTOCOL: ${{ needs.preflight.outputs.protocol }}
      EXPECTED_VERIFIER_SHA256: ${{ needs.preflight.outputs.trusted_verifier_sha256 }}
      EXPECTED_PLAN_SHA256: ${{ needs.preflight.outputs.release_plan_sha256 }}
      RELEASE_READY_ATTEMPT: ${{ needs.publish-release.result == 'success' && needs.publish-release.outputs.release_ready_attempt || needs.verify-reuse.outputs.artifact_attempt }}
    steps:
      - name: Fetch immutable paired release
        shell: /bin/bash
        env:
          GH_TOKEN: ${{ secrets.SMARTY_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          /usr/bin/gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$REPOSITORY/releases/tags/$TAG" > release.json
          /bin/mkdir -p published-assets publication
          /usr/bin/gh release download "$TAG" --repo "$REPOSITORY" --dir published-assets
          /usr/bin/gh run download "$GITHUB_RUN_ID" --repo "$REPOSITORY" \
            --name "smarty-release-ready-$RELEASE_READY_ATTEMPT" --dir trusted-release-ready

      - name: Verify immutable paired release bytes
        shell: /bin/bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -S - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          payloads = (
              "herdr-linux-x86_64", "herdr-linux-aarch64", "herdr-macos-x86_64",
              "herdr-macos-aarch64", "herdr-windows-x86_64.zip", "omp-linux-x86_64",
              "omp-linux-aarch64", "omp-macos-x86_64", "omp-macos-aarch64",
              "pi_natives.linux-x64-baseline.node", "pi_natives.linux-x64-modern.node",
              "pi_natives.linux-arm64.node", "pi_natives.darwin-x64-baseline.node",
              "pi_natives.darwin-arm64.node",
          )
          platforms = ("linux-x86_64", "linux-aarch64", "macos-x86_64", "macos-aarch64", "windows-x86_64")
          provenance = tuple(f"smarty-provenance-{platform}.sigstore.json" for platform in platforms)
          sidecars = tuple(f"{name}.sha256" for name in payloads)
          evidence = ("smarty-pair.spdx.json", *provenance, "smarty-pair.spdx.sigstore.json")
          metadata = ("smarty-pair.json", "smarty-pair.provenance.sigstore.json", *evidence)
          expected = set(payloads) | set(sidecars) | set(metadata)
          if len(expected) != 37:
              raise SystemExit("publication allow-list is not the exact 37-file release set")
          release = json.loads(Path("release.json").read_text(encoding="utf-8"))
          if (
              release.get("tag_name") != os.environ["TAG"]
              or release.get("target_commitish") != os.environ["EXPECTED_SOURCE"]
              or release.get("draft") is not False
              or release.get("prerelease") is not True
              or release.get("immutable") is not True
          ):
              raise SystemExit("published release is not the exact immutable preview")
          prefix = f"https://github.com/Smarty-Pants-Inc/herdr/releases/download/{os.environ['TAG']}/"
          assets = release.get("assets")
          if not isinstance(assets, list) or len(assets) != 37:
              raise SystemExit("published release does not have the exact 37 assets")
          if {asset.get("name") for asset in assets} != expected:
              raise SystemExit("published release asset set mismatch")
          for asset in assets:
              if asset.get("state") != "uploaded":
                  raise SystemExit(f"published asset is not uploaded: {asset.get('name')}")
              if asset.get("browser_download_url") != prefix + asset["name"]:
                  raise SystemExit(f"published asset URL mismatch: {asset['name']}")
          root = Path("published-assets")
          paths = list(root.iterdir())
          if {path.name for path in paths} != expected or any(not path.is_file() or path.is_symlink() for path in paths):
              raise SystemExit("downloaded release does not match the exact 37-file allow-list")
          files = {}
          for name in sorted(expected):
              data = (root / name).read_bytes()
              files[name] = {
                  "length": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "url": prefix + name,
              }
          for name in payloads:
              if (root / f"{name}.sha256").read_text(encoding="ascii").split() != [files[name]["sha256"], name]:
                  raise SystemExit(f"published checksum sidecar mismatch: {name}")
          if re.fullmatch(
              rf"\d{{4}}-\d{{2}}-\d{{2}}-p{os.environ['EXPECTED_PARENT']}-r{os.environ['EXPECTED_SOURCE']}-o{os.environ['EXPECTED_OMP']}",
              os.environ["BUILD_ID"],
          ) is None or os.environ["TAG"] != f"smarty-preview-{os.environ['BUILD_ID']}":
              raise SystemExit("published identity does not bind exact P/R/O/tag")
          pair = json.loads((root / "smarty-pair.json").read_text(encoding="utf-8"))
          material = b"smarty.paired-release.v1\0" + b"\0".join(
              os.environ[name].encode("ascii")
              for name in ("EXPECTED_PARENT", "EXPECTED_SOURCE", "EXPECTED_OMP")
          )
          pair_id = hashlib.sha256(material).hexdigest()
          if (
              set(pair) != {
                  "schema", "pair_id", "release", "sources", "toolchains",
                  "lock_inputs", "platforms", "artifacts", "evidence", "verification",
              }
              or pair.get("schema") != "smarty.paired-release.v1"
              or pair.get("pair_id") != pair_id
              or pair.get("release") != {
                  "repository": "Smarty-Pants-Inc/herdr",
                  "tag": os.environ["TAG"],
                  "build_id": os.environ["BUILD_ID"],
                  "built_at": os.environ["BUILT_AT"],
                  "immutable": True,
              }
              or pair.get("sources") != {
                  "parent": {
                      "repository": "Smarty-Pants-Inc/smarty-dev",
                      "commit": os.environ["EXPECTED_PARENT"],
                      "tree": os.environ["PARENT_TREE"],
                  },
                  "herdr": {
                      "repository": "Smarty-Pants-Inc/herdr",
                      "commit": os.environ["EXPECTED_SOURCE"],
                      "tree": os.environ["SOURCE_TREE"],
                      "version": os.environ["BASE_VERSION"],
                      "build_id": os.environ["BUILD_ID"],
                      "protocol": int(os.environ["PROTOCOL"]),
                  },
                  "omp": {
                      "repository": "Smarty-Pants-Inc/oh-my-pi",
                      "commit": os.environ["EXPECTED_OMP"],
                      "tree": os.environ["OMP_TREE"],
                      "version": os.environ["OMP_VERSION"],
                      "build_id": os.environ["OMP_BUILD_ID"],
                  },
              }
          ):
              raise SystemExit("published pair manifest identity mismatch")
          artifacts = pair.get("artifacts")
          if not isinstance(artifacts, dict) or set(artifacts) != set(payloads + sidecars):
              raise SystemExit("published pair manifest artifact allow-list mismatch")
          evidence_records = pair.get("evidence")
          if not isinstance(evidence_records, dict) or set(evidence_records) != set(evidence):
              raise SystemExit("published pair manifest evidence allow-list mismatch")
          for name in payloads + sidecars + evidence:
              record = artifacts[name] if name in artifacts else evidence_records[name]
              if (
                  record.get("length") != files[name]["length"]
                  or record.get("sha256") != files[name]["sha256"]
                  or record.get("url") != files[name]["url"]
              ):
                  raise SystemExit(f"published pair manifest record mismatch: {name}")
          Path("publication/publication.json").write_text(
              json.dumps(
                  {
                      "schema": 1,
                      "repository": "Smarty-Pants-Inc/herdr",
                      "tag": os.environ["TAG"],
                      "build_id": os.environ["BUILD_ID"],
                      "built_at": os.environ["BUILT_AT"],
                      "target_commitish": os.environ["EXPECTED_SOURCE"],
                      "pair_id": pair_id,
                      "draft": False,
                      "prerelease": True,
                      "immutable": True,
                      "files": files,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          /bin/rm -rf trusted-source-*
          index=0
          for archive in trusted-release-ready/source-archives/*.tar; do
            /bin/mkdir "trusted-source-$index"
            /bin/tar -xf "$archive" -C "trusted-source-$index"
            index=$((index + 1))
          done
          test "$index" = 2
          herdr_root=
          omp_root=
          for root in trusted-source-*; do
            if [ -f "$root/src/protocol/wire.rs" ]; then
              herdr_root="$root"
            elif [ -f "$root/packages/coding-agent/package.json" ]; then
              omp_root="$root"
            fi
          done
          test -n "$herdr_root"
          test -n "$omp_root"
          test "$(/usr/bin/sha256sum trusted-release-ready/handoff/trusted-release-verifier.py | /usr/bin/cut -d' ' -f1)" = "$EXPECTED_VERIFIER_SHA256"
          test "$(/usr/bin/sha256sum trusted-release-ready/handoff/release-plan.json | /usr/bin/cut -d' ' -f1)" = "$EXPECTED_PLAN_SHA256"
          common=(
            --asset-dir published-assets
            --expected-parent "$EXPECTED_PARENT"
            --expected-source "$EXPECTED_SOURCE"
            --expected-omp "$EXPECTED_OMP"
            --expected-parent-tree "$PARENT_TREE"
            --expected-source-tree "$SOURCE_TREE"
            --expected-omp-tree "$OMP_TREE"
            --expected-tag "$TAG"
            --expected-build-id "$BUILD_ID"
            --herdr-root "$herdr_root"
            --omp-root "$omp_root"
            --trusted-verifier trusted-release-ready/handoff/trusted-release-verifier.py
            --source-archive-dir trusted-release-ready/source-archives
          )
          if [ -d trusted-release-ready/metadata ]; then
            graphs=(trusted-release-ready/metadata/*-graph.json)
            test "${#graphs[@]}" = 1
            python3 -I -S trusted-release-ready/handoff/trusted-release-verifier.py verify-pair \
              "${common[@]}" \
              --native-graph "${graphs[0]}" \
              --dependency-metadata trusted-release-ready/metadata/cargo-metadata \
              --omp-rules-rust-toolchains trusted-release-ready/metadata/omp-rules-rust-toolchains.json
          else
            python3 -I -S trusted-release-ready/handoff/trusted-release-verifier.py verify-attested-pair \
              "${common[@]}"
          fi

      - name: Verify immutable paired release attestations
        shell: /bin/bash
        env:
          GH_TOKEN: ${{ secrets.SMARTY_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          verify() {
            local bundle="$1" predicate="$2"
            shift 2
            local subject
            for subject in "$@"; do
              /usr/bin/gh attestation verify "published-assets/$subject" \
                --repo "$REPOSITORY" \
                --bundle "published-assets/$bundle" \
                --signer-workflow "$REPOSITORY/.github/workflows/smarty-preview.yml" \
                --signer-digest "$EXPECTED_SOURCE" \
                --source-ref "refs/tags/$TAG" \
                --source-digest "$EXPECTED_SOURCE" \
                --deny-self-hosted-runners \
                --predicate-type "$predicate"
            done
          }
          verify smarty-provenance-linux-x86_64.sigstore.json https://slsa.dev/provenance/v1 herdr-linux-x86_64 omp-linux-x86_64 pi_natives.linux-x64-baseline.node pi_natives.linux-x64-modern.node
          verify smarty-provenance-linux-aarch64.sigstore.json https://slsa.dev/provenance/v1 herdr-linux-aarch64 omp-linux-aarch64 pi_natives.linux-arm64.node
          verify smarty-provenance-macos-x86_64.sigstore.json https://slsa.dev/provenance/v1 herdr-macos-x86_64 omp-macos-x86_64 pi_natives.darwin-x64-baseline.node
          verify smarty-provenance-macos-aarch64.sigstore.json https://slsa.dev/provenance/v1 herdr-macos-aarch64 omp-macos-aarch64 pi_natives.darwin-arm64.node
          verify smarty-provenance-windows-x86_64.sigstore.json https://slsa.dev/provenance/v1 herdr-windows-x86_64.zip
          verify smarty-pair.spdx.sigstore.json https://spdx.dev/Document/v2.3 herdr-linux-x86_64 herdr-linux-aarch64 herdr-macos-x86_64 herdr-macos-aarch64 herdr-windows-x86_64.zip omp-linux-x86_64 omp-linux-aarch64 omp-macos-x86_64 omp-macos-aarch64 pi_natives.linux-x64-baseline.node pi_natives.linux-x64-modern.node pi_natives.linux-arm64.node pi_natives.darwin-x64-baseline.node pi_natives.darwin-arm64.node smarty-pair.spdx.json
          verify smarty-pair.provenance.sigstore.json https://slsa.dev/provenance/v1 smarty-pair.json
          /usr/bin/python3 -I -S - <<'PY'
          import base64
          import hashlib
          import json
          from pathlib import Path

          root = Path("published-assets")

          def digest(name: str) -> str:
              return hashlib.sha256((root / name).read_bytes()).hexdigest()

          def subjects(path: Path) -> dict[str, str]:
              text = path.read_text(encoding="utf-8")
              try:
                  values = [json.loads(text)]
              except json.JSONDecodeError:
                  values = [json.loads(line) for line in text.splitlines() if line.strip()]
              found: dict[str, str] = {}
              pending = list(values)
              while pending:
                  value = pending.pop()
                  if isinstance(value, list):
                      pending.extend(value)
                  elif isinstance(value, dict):
                      envelope = value.get("dsseEnvelope")
                      if isinstance(envelope, dict):
                          pending.append(envelope)
                      if isinstance(value.get("payload"), str) and ("payloadType" in value or "signatures" in value):
                          statement = json.loads(base64.b64decode(value["payload"], validate=True))
                          for subject in statement.get("subject", []):
                              name = subject.get("name")
                              value_digest = subject.get("digest", {}).get("sha256")
                              if not isinstance(name, str) or not isinstance(value_digest, str):
                                  raise SystemExit(f"invalid attestation subject in {path.name}")
                              if name in found and found[name] != value_digest:
                                  raise SystemExit(f"conflicting attestation subject in {path.name}")
                              found[name] = value_digest
                      pending.extend(child for key, child in value.items() if key != "dsseEnvelope")
              return found

          payloads = (
              "herdr-linux-x86_64", "herdr-linux-aarch64", "herdr-macos-x86_64",
              "herdr-macos-aarch64", "herdr-windows-x86_64.zip", "omp-linux-x86_64",
              "omp-linux-aarch64", "omp-macos-x86_64", "omp-macos-aarch64",
              "pi_natives.linux-x64-baseline.node", "pi_natives.linux-x64-modern.node",
              "pi_natives.linux-arm64.node", "pi_natives.darwin-x64-baseline.node",
              "pi_natives.darwin-arm64.node",
          )
          platform_payloads = {
              "linux-x86_64": (
                  "herdr-linux-x86_64", "omp-linux-x86_64",
                  "pi_natives.linux-x64-baseline.node", "pi_natives.linux-x64-modern.node",
              ),
              "linux-aarch64": ("herdr-linux-aarch64", "omp-linux-aarch64", "pi_natives.linux-arm64.node"),
              "macos-x86_64": (
                  "herdr-macos-x86_64", "omp-macos-x86_64", "pi_natives.darwin-x64-baseline.node",
              ),
              "macos-aarch64": ("herdr-macos-aarch64", "omp-macos-aarch64", "pi_natives.darwin-arm64.node"),
              "windows-x86_64": ("herdr-windows-x86_64.zip",),
          }
          for platform, names in platform_payloads.items():
              if subjects(root / f"smarty-provenance-{platform}.sigstore.json") != {
                  name: digest(name) for name in names
              }:
                  raise SystemExit(f"published platform provenance subject mismatch: {platform}")
          if subjects(root / "smarty-pair.spdx.sigstore.json") != {
              name: digest(name) for name in payloads + ("smarty-pair.spdx.json",)
          }:
              raise SystemExit("published SPDX provenance subject mismatch")
          if subjects(root / "smarty-pair.provenance.sigstore.json") != {
              "smarty-pair.json": digest("smarty-pair.json")
          }:
              raise SystemExit("published pair provenance subject mismatch")
          PY

      - name: Record TUF promotion input for external signing
        shell: /bin/bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -S - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          source = Path("published-assets/smarty-pair.json")
          data = source.read_bytes()
          publication = json.loads(Path("publication/publication.json").read_text(encoding="utf-8"))
          record = publication["files"]["smarty-pair.json"]
          if record["length"] != len(data) or record["sha256"] != hashlib.sha256(data).hexdigest():
              raise SystemExit("verified publication record does not match the TUF target bytes")
          pair = json.loads(data.decode("utf-8"))
          pair_id = publication["pair_id"]
          if pair.get("pair_id") != pair_id or re.fullmatch(r"[0-9a-f]{64}", pair_id) is None:
              raise SystemExit("TUF target pair identity is invalid")
          if publication["immutable"] is not True or pair["release"]["immutable"] is not True:
              raise SystemExit("TUF promotion input requires an immutable published release")
          promotion = {
              "schema": "smarty.tuf-promotion-input.v1",
              "channel": "canary",
              "channel_paths": {
                  "canary": "canary/smarty-pair.json",
                  "stable": "stable/smarty-pair.json",
              },
              "gates": {"keys": "external", "performed": False, "signing": "external"},
              "pair_id": pair_id,
              "release": {
                  "build_id": publication["build_id"],
                  "built_at": publication["built_at"],
                  "immutable": True,
                  "repository": publication["repository"],
                  "tag": publication["tag"],
                  "target_commitish": publication["target_commitish"],
              },
              "sources": {
                  "herdr": pair["sources"]["herdr"]["commit"],
                  "omp": pair["sources"]["omp"]["commit"],
                  "parent": pair["sources"]["parent"]["commit"],
              },
              "target": {
                  "custom": {
                      "channel": "canary",
                      "pair_id": pair_id,
                      "target_name": "smarty-pair.json",
                  },
                  "length": record["length"],
                  "name": "smarty-pair.json",
                  "path": "canary/smarty-pair.json",
                  "sha256": record["sha256"],
                  "url": record["url"],
              },
          }
          Path("promotion").mkdir()
          Path("promotion/smarty-pair.json").write_bytes(data)
          Path("promotion/smarty-promotion-input.json").write_text(
              json.dumps(promotion, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload verified publication records
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smarty-publication-verified-${{ github.run_attempt }}
          path: publication/publication.json
          if-no-files-found: error
          compression-level: 0

      - name: Upload TUF promotion input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smarty-tuf-promotion-input-${{ github.run_attempt }}
          path: |
            promotion/smarty-promotion-input.json
            promotion/smarty-pair.json
          if-no-files-found: error
          compression-level: 0

  advance-channel:
    needs: [preflight, render-channel, verify-publication]
    if: >-
      always() &&
      needs.render-channel.result == 'success' &&
      needs.verify-publication.result == 'success'
    outputs:
      bridge_commit: ${{ steps.advance.outputs.bridge_commit }}
      phase: ${{ steps.advance.outputs.phase }}
    runs-on: ubuntu-latest
    environment: smarty-release
    permissions:
      contents: read
    env:
      REPOSITORY: Smarty-Pants-Inc/herdr
      EXPECTED_PARENT: ${{ needs.preflight.outputs.parent_commit }}
      EXPECTED_SOURCE: ${{ needs.preflight.outputs.commit }}
      EXPECTED_OMP: ${{ needs.preflight.outputs.omp_commit }}
      OMP_TREE: ${{ needs.preflight.outputs.omp_tree }}
      OMP_VERSION: ${{ needs.preflight.outputs.omp_version }}
      OMP_BUILD_ID: ${{ needs.preflight.outputs.omp_build_id }}
      TAG: ${{ needs.preflight.outputs.tag }}
      BUILD_ID: ${{ needs.preflight.outputs.build_id }}
      BUILT_AT: ${{ needs.preflight.outputs.built_at }}
      BASE_VERSION: ${{ needs.preflight.outputs.base_version }}
      PROTOCOL: ${{ needs.preflight.outputs.protocol }}
      EXPECTED_AUTHORIZATION_REF: ${{ needs.preflight.outputs.authorization_ref }}
      EXPECTED_AUTHORIZATION_STATE: ${{ needs.preflight.outputs.authorization_state }}
      EXPECTED_AUTHORIZATION_ACTION: ${{ needs.preflight.outputs.authorization_action }}
      EXPECTED_CHANNEL_COMMIT: ${{ needs.preflight.outputs.channel_commit }}
    steps:
      - name: Download immutable release plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: smarty-release-plan-${{ needs.preflight.outputs.artifact_attempt }}
          path: plan

      - name: Download exact rendered channel candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: smarty-channel-candidate-${{ needs.render-channel.outputs.artifact_attempt }}
          path: channel-candidate

      - name: Download verified publication records
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: smarty-publication-verified-${{ needs.verify-publication.outputs.artifact_attempt }}
          path: publication

      - name: Verify rendered Smarty channel candidate
        shell: /bin/bash
        run: |
          set -euo pipefail
          /bin/mkdir channel
          /usr/bin/python3 -I -S - <<'PY'
          import hashlib
          import json
          import os
          import re
          import shutil
          import subprocess
          from datetime import datetime
          from pathlib import Path

          HERDR_ASSETS = {
              "linux-x86_64": "herdr-linux-x86_64",
              "linux-aarch64": "herdr-linux-aarch64",
              "macos-x86_64": "herdr-macos-x86_64",
              "macos-aarch64": "herdr-macos-aarch64",
              "windows-x86_64": "herdr-windows-x86_64.zip",
          }
          OMP_ASSETS = {
              "linux-x86_64": "omp-linux-x86_64",
              "linux-aarch64": "omp-linux-aarch64",
              "macos-x86_64": "omp-macos-x86_64",
              "macos-aarch64": "omp-macos-aarch64",
          }
          OMP_NATIVE_ASSETS = (
              "pi_natives.linux-x64-baseline.node", "pi_natives.linux-x64-modern.node",
              "pi_natives.linux-arm64.node", "pi_natives.darwin-x64-baseline.node",
              "pi_natives.darwin-arm64.node",
          )
          CHANNEL_KEYS = {
              "assets", "base_version", "build_id", "builds", "built_at", "channel",
              "commit", "notes", "omp", "protocol", "schema_version",
          }
          BUILD_KEYS = {"assets", "base_version", "built_at", "commit", "omp", "protocol", "tag"}
          PAIRED_BUILD_ID = re.compile(
              r"^(?P<day>\d{4}-\d{2}-\d{2})-p(?P<parent>[0-9a-f]{40})-"
              r"r(?P<herdr>[0-9a-f]{40})-o(?P<omp>[0-9a-f]{40})$"
          )
          LEGACY_BUILD_ID = re.compile(r"^(?P<day>\d{4}-\d{2}-\d{2})-(?P<commit>[0-9a-f]{12})$")

          def fail(message: str) -> None:
              raise SystemExit(message)

          def mapping(value, label: str) -> dict:
              if not isinstance(value, dict):
                  fail(f"{label} must be a JSON object")
              return value

          def exact_keys(value: dict, expected: set[str], label: str) -> None:
              if set(value) != expected:
                  fail(f"{label} has unexpected fields")

          def one_line(value, label: str) -> str:
              if (
                  not isinstance(value, str)
                  or not value
                  or value != value.strip()
                  or "\n" in value
                  or "\r" in value
              ):
                  fail(f"{label} must be a nonempty one-line string")
              return value

          def git_object(value, label: str) -> str:
              value = one_line(value, label)
              if re.fullmatch(r"[0-9a-f]{40}", value) is None:
                  fail(f"{label} must be a lowercase 40-character Git object ID")
              return value

          def sha256(value, label: str) -> str:
              if not isinstance(value, str) or re.fullmatch(r"[0-9a-f]{64}", value) is None:
                  fail(f"{label} must be a lowercase SHA-256 digest")
              return value

          def timestamp(value, label: str) -> str:
              value = one_line(value, label)
              candidate = f"{value[:-1]}+00:00" if value.endswith("Z") else value
              try:
                  parsed = datetime.fromisoformat(candidate)
              except ValueError as error:
                  raise SystemExit(f"{label} must be ISO-8601") from error
              if parsed.tzinfo is None:
                  fail(f"{label} must include a timezone")
              return value

          def protocol(value) -> int:
              if isinstance(value, bool) or not isinstance(value, int) or value < 1:
                  fail("channel protocol must be a positive integer")
              return value

          def record(path: Path) -> dict[str, object]:
              if not path.is_file() or path.is_symlink():
                  fail(f"channel input is not a regular file: {path}")
              data = path.read_bytes()
              return {"length": len(data), "sha256": hashlib.sha256(data).hexdigest()}

          def release_url(tag: str, name: str) -> str:
              return f"https://github.com/Smarty-Pants-Inc/herdr/releases/download/{tag}/{name}"

          def validate_asset(value, *, tag: str, name: str, published=None) -> dict:
              asset = mapping(value, f"channel asset {name}")
              zipped = name.endswith(".zip")
              exact_keys(asset, {"sha256", "url"} | ({"format"} if zipped else set()), f"channel asset {name}")
              sha256(asset.get("sha256"), f"channel asset {name} sha256")
              if asset.get("url") != release_url(tag, name):
                  fail(f"channel asset {name} URL mismatch")
              if zipped and asset.get("format") != "zip":
                  fail(f"channel asset {name} format mismatch")
              if published is not None and (
                  asset["sha256"] != published["sha256"] or asset["url"] != published["url"]
              ):
                  fail(f"rendered channel asset does not match the published release: {name}")
              return asset

          def validate_assets(value, *, tag: str, names: dict[str, str], published=None) -> dict:
              assets = mapping(value, "channel assets")
              exact_keys(assets, set(names), "channel asset allow-list")
              for platform, name in names.items():
                  validate_asset(
                      assets[platform],
                      tag=tag,
                      name=name,
                      published=published[name] if published is not None else None,
                  )
              return assets

          def validate_omp(value, *, tag: str, expected_commit=None, published=None) -> dict:
              omp = mapping(value, "channel OMP identity")
              exact_keys(omp, {"assets", "build_id", "commit", "tree", "version"}, "channel OMP identity")
              one_line(omp.get("build_id"), "channel OMP build_id")
              commit = git_object(omp.get("commit"), "channel OMP commit")
              git_object(omp.get("tree"), "channel OMP tree")
              one_line(omp.get("version"), "channel OMP version")
              if expected_commit is not None and commit != expected_commit:
                  fail("channel OMP commit does not match paired build ID")
              validate_assets(omp.get("assets"), tag=tag, names=OMP_ASSETS, published=published)
              return omp

          def validate_build(build_id, value, *, published=None) -> dict:
              build_id = one_line(build_id, "channel retained build ID")
              build = mapping(value, f"channel retained build {build_id}")
              if set(build) not in (BUILD_KEYS, BUILD_KEYS - {"omp"}):
                  fail(f"channel retained build {build_id} has unexpected fields")
              tag = f"smarty-preview-{build_id}"
              if build.get("tag") != tag:
                  fail(f"channel retained build {build_id} tag mismatch")
              commit = git_object(build.get("commit"), f"channel retained build {build_id} commit")
              paired = PAIRED_BUILD_ID.fullmatch(build_id)
              legacy = LEGACY_BUILD_ID.fullmatch(build_id)
              if paired is None and legacy is None:
                  fail(f"channel retained build {build_id} has an invalid ID")
              try:
                  datetime.strptime((paired or legacy).group("day"), "%Y-%m-%d")
              except ValueError as error:
                  raise SystemExit(f"channel retained build {build_id} has an invalid date") from error
              if paired is not None:
                  if commit != paired.group("herdr"):
                      fail(f"channel retained build {build_id} commit mismatch")
                  if "omp" not in build:
                      fail(f"channel retained build {build_id} has no paired OMP identity")
              elif commit[:12] != legacy.group("commit"):
                  fail(f"channel retained build {build_id} legacy commit mismatch")
              one_line(build.get("base_version"), f"channel retained build {build_id} base_version")
              timestamp(build.get("built_at"), f"channel retained build {build_id} built_at")
              protocol(build.get("protocol"))
              validate_assets(build.get("assets"), tag=tag, names=HERDR_ASSETS, published=published)
              if "omp" in build:
                  validate_omp(
                      build["omp"],
                      tag=tag,
                      expected_commit=paired.group("omp") if paired is not None else None,
                      published=published,
                  )
              return build

          def validate_manifest(value, *, published=None) -> tuple[dict, dict]:
              manifest = mapping(value, "channel manifest")
              exact_keys(manifest, CHANNEL_KEYS, "channel manifest")
              if manifest.get("schema_version") != 1 or manifest.get("channel") != "preview":
                  fail("channel manifest schema or channel mismatch")
              build_id = one_line(manifest.get("build_id"), "channel manifest build_id")
              builds = mapping(manifest.get("builds"), "channel manifest builds")
              if not builds:
                  fail("channel manifest builds must not be empty")
              for retained_id, retained in builds.items():
                  validate_build(
                      retained_id,
                      retained,
                      published=published if retained_id == build_id else None,
                  )
              current = mapping(builds.get(build_id), f"channel retained build {build_id}")
              expected_current = {
                  "assets": manifest.get("assets"),
                  "base_version": manifest.get("base_version"),
                  "built_at": manifest.get("built_at"),
                  "commit": manifest.get("commit"),
                  "omp": manifest.get("omp"),
                  "protocol": manifest.get("protocol"),
                  "tag": f"smarty-preview-{build_id}",
              }
              if current != expected_current:
                  fail("channel manifest top-level/current archive mismatch")
              if not isinstance(manifest.get("notes"), str):
                  fail("channel manifest notes must be a string")
              return manifest, current

          def validate_bridge(value, *, published=None) -> tuple[dict, dict]:
              bridge = mapping(value, "Windows bootstrap bridge manifest")
              exact_keys(
                  bridge,
                  CHANNEL_KEYS | {"bootstrap", "canonical_build_id"},
                  "Windows bootstrap bridge manifest",
              )
              canonical_build_id = one_line(
                  bridge.get("canonical_build_id"), "Windows bootstrap canonical build ID"
              )
              builds = mapping(bridge.get("builds"), "Windows bootstrap builds")
              current = validate_build(
                  canonical_build_id,
                  builds.get(canonical_build_id),
                  published=published,
              )
              candidate = {
                  "assets": current["assets"],
                  "base_version": current["base_version"],
                  "build_id": canonical_build_id,
                  "builds": builds,
                  "built_at": current["built_at"],
                  "channel": "preview",
                  "commit": current["commit"],
                  "notes": bridge.get("notes"),
                  "omp": current["omp"],
                  "protocol": current["protocol"],
                  "schema_version": 1,
              }
              candidate, canonical_current = validate_manifest(candidate, published=published)
              alias = "bootstrap-" + hashlib.sha256(canonical_build_id.encode("ascii")).hexdigest()
              windows = canonical_current["assets"]["windows-x86_64"]
              if (
                  bridge.get("schema_version") != 2
                  or bridge.get("channel") != "preview"
                  or bridge.get("build_id") != alias
                  or bridge.get("assets") != {"windows-x86_64": windows}
                  or bridge.get("builds") != candidate["builds"]
                  or any(
                      bridge.get(key) != candidate.get(key)
                      for key in CHANNEL_KEYS
                      - {"assets", "build_id", "builds", "schema_version"}
                  )
                  or bridge.get("bootstrap") != {
                      "schema": "smarty.windows-bootstrap.v1",
                      "paired_build_id": canonical_build_id,
                      "paired_tag": canonical_current["tag"],
                      "paired_manifest": "preview.json",
                      "windows_asset_sha256": windows["sha256"],
                  }
              ):
                  fail("Windows bootstrap bridge does not bind the canonical paired manifest")
              return candidate, canonical_current

          retain = int(os.environ["CHANNEL_RETAIN"])
          if retain < 1:
              fail("channel retention must be positive")
          expected_parent = git_object(os.environ["EXPECTED_PARENT"], "expected channel parent")
          expected_source = git_object(os.environ["EXPECTED_SOURCE"], "expected channel source")
          expected_omp = git_object(os.environ["EXPECTED_OMP"], "expected channel OMP source")
          expected_omp_tree = git_object(os.environ["OMP_TREE"], "expected channel OMP tree")
          expected_tag = one_line(os.environ["TAG"], "expected channel tag")
          expected_build_id = one_line(os.environ["BUILD_ID"], "expected channel build ID")
          expected_match = PAIRED_BUILD_ID.fullmatch(expected_build_id)
          if (
              expected_match is None
              or expected_match.group("parent") != expected_parent
              or expected_match.group("herdr") != expected_source
              or expected_match.group("omp") != expected_omp
              or expected_tag != f"smarty-preview-{expected_build_id}"
          ):
              fail("expected channel P/R/O/tag identity mismatch")
          expected_built_at = timestamp(os.environ["BUILT_AT"], "expected channel built_at")
          expected_base_version = one_line(os.environ["BASE_VERSION"], "expected channel base_version")
          expected_protocol = protocol(int(os.environ["PROTOCOL"]))
          expected_omp_version = one_line(os.environ["OMP_VERSION"], "expected channel OMP version")
          expected_omp_build_id = one_line(os.environ["OMP_BUILD_ID"], "expected channel OMP build_id")
          authorization_state = os.environ["EXPECTED_AUTHORIZATION_STATE"]
          if authorization_state not in {"lease", "consumed", "canonical"}:
              fail("channel authorization state is invalid")
          authorization_action = os.environ["EXPECTED_AUTHORIZATION_ACTION"]
          if authorization_action != "windows-bootstrap-bridge":
              fail("channel authorization action is invalid")

          plan = mapping(json.loads(Path("plan/release-plan.json").read_text(encoding="utf-8")), "channel release plan")
          publication = mapping(
              json.loads(Path("publication/publication.json").read_text(encoding="utf-8")),
              "verified publication record",
          )
          expected_plan = {
              "parent_commit": expected_parent,
              "source_commit": expected_source,
              "omp_commit": expected_omp,
              "omp_tree": expected_omp_tree,
              "omp_version": expected_omp_version,
              "omp_build_id": expected_omp_build_id,
              "tag": expected_tag,
              "build_id": expected_build_id,
              "built_at": expected_built_at,
              "base_version": expected_base_version,
              "protocol": expected_protocol,
              "authorization_ref": os.environ["EXPECTED_AUTHORIZATION_REF"],
              "authorization_state": authorization_state,
              "authorization_action": authorization_action,
          }
          if any(plan.get(key) != value for key, value in expected_plan.items()):
              fail("channel release plan identity mismatch")
          exact_keys(
              publication,
              {
                  "schema", "repository", "tag", "build_id", "built_at", "target_commitish",
                  "pair_id", "draft", "prerelease", "immutable", "files",
              },
              "verified publication record",
          )
          if (
              publication.get("schema") != 1
              or publication.get("repository") != "Smarty-Pants-Inc/herdr"
              or publication.get("tag") != expected_tag
              or publication.get("build_id") != expected_build_id
              or publication.get("built_at") != expected_built_at
              or publication.get("target_commitish") != expected_source
              or re.fullmatch(r"[0-9a-f]{64}", str(publication.get("pair_id"))) is None
              or publication.get("immutable") is not True
              or publication.get("draft") is not False
              or publication.get("prerelease") is not True
          ):
              fail("verified publication record does not observe the exact release")
          published = mapping(publication["files"], "verified publication files")
          payloads = tuple(HERDR_ASSETS.values()) + tuple(OMP_ASSETS.values()) + OMP_NATIVE_ASSETS
          platforms = tuple(HERDR_ASSETS)
          provenance = tuple(f"smarty-provenance-{platform}.sigstore.json" for platform in platforms)
          release_names = set(payloads) | {f"{name}.sha256" for name in payloads} | {
              "smarty-pair.json", "smarty-pair.provenance.sigstore.json", "smarty-pair.spdx.json",
              "smarty-pair.spdx.sigstore.json", *provenance,
          }
          exact_keys(published, release_names, "verified publication files")
          for name, value in published.items():
              value = mapping(value, f"verified publication file {name}")
              exact_keys(value, {"length", "sha256", "url"}, f"verified publication file {name}")
              if isinstance(value.get("length"), bool) or not isinstance(value.get("length"), int) or value["length"] < 0:
                  fail(f"verified publication file {name} has an invalid length")
              sha256(value.get("sha256"), f"verified publication file {name} sha256")
              if value.get("url") != release_url(expected_tag, name):
                  fail(f"verified publication file {name} URL mismatch")

          candidate_root = Path("channel-candidate")
          sealed = mapping(
              json.loads((candidate_root / "channel-files.json").read_text(encoding="utf-8")),
              "rendered channel transfer manifest",
          )
          exact_keys(sealed, {"schema", "files"}, "rendered channel transfer manifest")
          if sealed.get("schema") != 1:
              fail("rendered channel manifest is invalid")
          sealed_files = mapping(sealed.get("files"), "rendered channel files")
          exact_keys(sealed_files, {"preview.json", "install.sh"}, "rendered channel files")
          for name, value in sealed_files.items():
              if record(candidate_root / name) != value:
                  fail(f"rendered channel transferred bytes mismatch: {name}")
          if record(candidate_root / "install.sh") != plan["installer"]:
              fail("rendered channel installer is not the authenticated candidate installer")

          rendered = json.loads((candidate_root / "preview.json").read_text(encoding="utf-8"))
          if authorization_state == "canonical":
              candidate, current = validate_manifest(rendered, published=published)
          else:
              candidate, current = validate_bridge(rendered, published=published)
          if authorization_state == "canonical":
              parent = subprocess.check_output(
                  ["git", "show", "-s", "--format=%P", os.environ["EXPECTED_CHANNEL_COMMIT"]],
                  text=True,
              ).strip()
              if re.fullmatch(r"[0-9a-f]{40}", parent) is None:
                  fail("canonical channel does not have one exact Phase-A bridge parent")
              bridge_value = json.loads(
                  subprocess.check_output(
                      ["git", "show", f"{parent}:preview.json"], text=True
                  )
              )
              bridge_candidate, _bridge_current = validate_bridge(
                  bridge_value, published=published
              )
              if bridge_candidate != candidate:
                  fail("canonical channel parent is not the exact Phase-A bridge")
              parent_installer = subprocess.check_output(
                  ["git", "show", f"{parent}:install.sh"]
              )
              if parent_installer != (candidate_root / "install.sh").read_bytes():
                  fail("canonical channel parent has an unexpected installer")
          if (
              candidate["build_id"] != expected_build_id
              or candidate["commit"] != expected_source
              or candidate["built_at"] != expected_built_at
              or candidate["base_version"] != expected_base_version
              or candidate["protocol"] != expected_protocol
              or current["tag"] != expected_tag
          ):
              fail("rendered channel current identity mismatch")
          omp = current["omp"]
          if (
              omp["commit"] != expected_omp
              or omp["tree"] != expected_omp_tree
              or omp["version"] != expected_omp_version
              or omp["build_id"] != expected_omp_build_id
          ):
              fail("rendered channel OMP identity mismatch")

          snapshot = mapping(plan.get("channel_snapshot"), "authenticated channel snapshot")
          exact_keys(snapshot, {"commit", "files"}, "authenticated channel snapshot")
          snapshot_commit = snapshot["commit"]
          if snapshot_commit != os.environ["EXPECTED_CHANNEL_COMMIT"]:
              fail("authenticated channel snapshot is not the observed channel commit")
          previous = None
          if snapshot_commit:
              git_object(snapshot_commit, "authenticated channel snapshot commit")
              snapshot_files = mapping(snapshot["files"], "authenticated channel snapshot files")
              if set(snapshot_files) != {"preview.json", "install.sh"}:
                  fail("authenticated channel snapshot file set is invalid")
              for name, value in snapshot_files.items():
                  if record(Path("plan/channel-snapshot") / name) != value:
                      fail(f"authenticated channel snapshot mismatch: {name}")
              previous_path = Path("plan/channel-snapshot/preview.json")
              previous_value = json.loads(previous_path.read_text(encoding="utf-8"))
              previous = (
                  validate_bridge(previous_value)[0]
                  if previous_value.get("schema_version") == 2
                  else validate_manifest(previous_value)[0]
              )
              shutil.copyfile(previous_path, "channel/previous-preview.json")
          elif snapshot["files"] != {}:
              fail("absent channel snapshot has files")

          builds = candidate["builds"]
          if authorization_state in {"consumed", "canonical"}:
              if previous is None or candidate != previous:
                  fail("consumed channel candidate differs from the authenticated snapshot")
          elif previous is None:
              if list(builds) != [expected_build_id]:
                  fail("initial channel candidate has unexpected history")
          else:
              previous_builds = previous["builds"]
              if expected_build_id in previous_builds:
                  fail("new channel build already exists in the authenticated history")
              ordered = sorted(
                  previous_builds,
                  key=lambda key: (str(previous_builds[key]["built_at"]), key),
                  reverse=True,
              )
              previous_current = previous["build_id"]
              if previous_current not in ordered:
                  fail("authenticated channel current build is absent from history")
              keep = max(retain - 1, ordered.index(previous_current) + 1)
              if list(builds) != [expected_build_id, *ordered[:keep]]:
                  fail("channel history is not the deterministic retained prefix")
              for retained in ordered[:keep]:
                  before = json.dumps(previous_builds[retained], sort_keys=True, separators=(",", ":"))
                  after = json.dumps(builds[retained], sort_keys=True, separators=(",", ":"))
                  if before != after:
                      fail(f"channel candidate changed retained build {retained}")
          shutil.copyfile(candidate_root / "preview.json", "channel/preview.json")
          shutil.copyfile(candidate_root / "install.sh", "channel/install.sh")
          PY

      - name: Advance Smarty channel with compare-and-swap
        id: advance
        shell: /bin/bash
        env:
          GH_TOKEN: ${{ secrets.SMARTY_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || {
            echo "::error::SMARTY_RELEASE_TOKEN is required in the smarty-release environment"
            exit 1
          }
          askpass="$RUNNER_TEMP/smarty-release-askpass-$$"
          umask 077
          cat > "$askpass" <<'SH'
          #!/bin/bash
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          /bin/chmod 0700 "$askpass"
          trap '/bin/rm -f "$askpass"' EXIT
          git_auth() {
            GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
              /usr/bin/git -c credential.helper= -c core.askPass="$askpass" "$@"
          }
          remote="https://github.com/${REPOSITORY}.git"
          channel_ref=refs/heads/smarty-channel
          authorization_ref=refs/heads/smarty-preview-authorization
          promotion_authorization_ref=refs/heads/smarty-preview-promotion-authorization
          observe_ref() {
            local ref="$1" line value
            line="$(git_auth ls-remote "$remote" "$ref")"
            if [ -z "$line" ]; then
              return 0
            fi
            value="${line%%$'\t'*}"
            if [ "$line" != "$value"$'\t'"$ref" ] || [[ ! "$value" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Remote ref $ref is not one exact lowercase commit"
              exit 1
            fi
            /usr/bin/printf '%s' "$value"
          }
          observed_channel="$(observe_ref "$channel_ref")"
          observed_authorization="$(observe_ref "$authorization_ref")"
          observed_promotion_authorization="$(observe_ref "$promotion_authorization_ref")"
          /usr/bin/git init -q channel-repo
          if [ -n "$observed_channel" ]; then
            git_auth -C channel-repo fetch --no-tags "$remote" \
              "+$channel_ref:refs/remotes/smarty/channel"
            test "$(/usr/bin/git -C channel-repo rev-parse refs/remotes/smarty/channel)" = "$observed_channel"
          fi
          if [ -n "$observed_authorization" ]; then
            git_auth -C channel-repo fetch --no-tags "$remote" \
              "+$authorization_ref:refs/remotes/smarty/authorization"
            test "$(/usr/bin/git -C channel-repo rev-parse refs/remotes/smarty/authorization)" = "$observed_authorization"
          fi
          if [ -n "$observed_promotion_authorization" ]; then
            git_auth -C channel-repo fetch --no-tags "$remote" \
              "+$promotion_authorization_ref:refs/remotes/smarty/promotion-authorization"
            test "$(/usr/bin/git -C channel-repo rev-parse refs/remotes/smarty/promotion-authorization)" = "$observed_promotion_authorization"
          fi
          create_promotion_lease() {
            local bridge="$1" blob tree
            blob="$(/usr/bin/printf '{"schema":1,"action":"promote-windows-bootstrap-to-canonical","parent":"%s","source":"%s","omp":"%s","tag":"%s","build_id":"%s","bridge_commit":"%s","workflow":".github/workflows/smarty-preview-promote.yml"}\n' \
              "$EXPECTED_PARENT" "$EXPECTED_SOURCE" "$EXPECTED_OMP" "$TAG" "$BUILD_ID" "$bridge" \
              | /usr/bin/git -C channel-repo hash-object -w --stdin)"
            tree="$(/usr/bin/printf '100644 blob %s\t.smarty-preview-promotion-authorization.json\n' "$blob" \
              | /usr/bin/git -C channel-repo mktree)"
            promotion_lease="$(GIT_AUTHOR_NAME='smarty-preview' \
              GIT_AUTHOR_EMAIL='smarty-preview@users.noreply.github.com' \
              GIT_AUTHOR_DATE='2000-01-01T00:00:00Z' \
              GIT_COMMITTER_NAME='smarty-preview' \
              GIT_COMMITTER_EMAIL='smarty-preview@users.noreply.github.com' \
              GIT_COMMITTER_DATE='2000-01-01T00:00:00Z' \
              /usr/bin/git -C channel-repo commit-tree "$tree" \
              -m 'Authorize Smarty Preview canonical promotion')"
            [[ "$promotion_lease" =~ ^[0-9a-f]{40}$ ]]
          }
          if [ "$EXPECTED_AUTHORIZATION_STATE" = consumed ] || [ "$EXPECTED_AUTHORIZATION_STATE" = canonical ]; then
            test -n "$EXPECTED_CHANNEL_COMMIT"
            test "$EXPECTED_CHANNEL_COMMIT" = "$EXPECTED_AUTHORIZATION_REF"
            test "$observed_channel" = "$EXPECTED_CHANNEL_COMMIT"
            test "$observed_authorization" = "$EXPECTED_AUTHORIZATION_REF"
            channel_tree="$(/usr/bin/git -C channel-repo ls-tree -r "$observed_channel")"
            if [ "$(/usr/bin/printf '%s\n' "$channel_tree" | /usr/bin/cut -f2 | /usr/bin/sort)" != $'install.sh\npreview.json' ]; then
              echo "::error::Consumed Smarty channel has unexpected files"
              exit 1
            fi
            while IFS=$'\t' read -r metadata name; do
              mode="${metadata%% *}"
              kind="${metadata#* }"
              kind="${kind%% *}"
              test "$kind" = blob
              case "$name:$mode" in
                install.sh:100755|preview.json:100644) ;;
                *) echo "::error::Consumed Smarty channel has an unexpected file mode"; exit 1 ;;
              esac
            done <<< "$channel_tree"
            /usr/bin/git -C channel-repo cat-file blob "$observed_channel:preview.json" \
              | /usr/bin/cmp -s - channel/previous-preview.json
            /usr/bin/git -C channel-repo cat-file blob "$observed_channel:install.sh" \
              | /usr/bin/cmp -s - channel/previous-install.sh
            if [ "$EXPECTED_AUTHORIZATION_STATE" = canonical ]; then
              test "$observed_promotion_authorization" = "$observed_channel" || {
                echo "::error::Canonical Smarty channel is not consumed by both authorization refs"
                exit 1
              }
              bridge_commit="$(/usr/bin/git -C channel-repo show -s --format=%P "$observed_channel")"
              [[ "$bridge_commit" =~ ^[0-9a-f]{40}$ ]] || {
                echo "::error::Canonical Smarty channel does not have one exact bootstrap parent"
                exit 1
              }
              echo "phase=canonical" >> "$GITHUB_OUTPUT"
            else
              bridge_commit="$observed_channel"
              create_promotion_lease "$bridge_commit"
              test "$observed_promotion_authorization" = "$promotion_lease" || {
                echo "::error::Smarty bootstrap bridge does not carry its exact promotion authorization lease"
                exit 1
              }
              echo "phase=bridge" >> "$GITHUB_OUTPUT"
            fi
            echo "bridge_commit=$bridge_commit" >> "$GITHUB_OUTPUT"
            echo "Smarty channel reconciled at $EXPECTED_AUTHORIZATION_STATE state for $BUILD_ID"
            /bin/rm -f "$askpass"
            trap - EXIT
            exit 0
          fi
          test "$EXPECTED_AUTHORIZATION_STATE" = lease
          /bin/cp channel/preview.json channel/install.sh channel-repo/
          /bin/chmod 0755 channel-repo/install.sh
          /usr/bin/git -C channel-repo add preview.json install.sh
          tree="$(/usr/bin/git -C channel-repo write-tree)"
          parents=()
          if [ -n "$EXPECTED_CHANNEL_COMMIT" ]; then
            if ! /usr/bin/git -C channel-repo cat-file -e "$EXPECTED_CHANNEL_COMMIT^{commit}"; then
              echo "::error::Smarty channel moved from $EXPECTED_CHANNEL_COMMIT to ${observed_channel:-<absent>}"
              exit 1
            fi
            parents=(-p "$EXPECTED_CHANNEL_COMMIT")
          fi
          candidate="$(GIT_AUTHOR_NAME='github-actions[bot]' \
            GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
            GIT_AUTHOR_DATE="$BUILT_AT" \
            GIT_COMMITTER_NAME='github-actions[bot]' \
            GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
            GIT_COMMITTER_DATE="$BUILT_AT" \
            /usr/bin/git -C channel-repo commit-tree "$tree" "${parents[@]}" \
            -m "Publish Smarty preview $BUILD_ID")"
          create_promotion_lease "$candidate"
          if [ "$observed_channel" = "$candidate" ] \
            && [ "$observed_authorization" = "$candidate" ] \
            && [ "$observed_promotion_authorization" = "$promotion_lease" ]; then
            echo "Smarty channel already advanced to the deterministic bootstrap candidate for $BUILD_ID"
            echo "phase=bridge" >> "$GITHUB_OUTPUT"
            echo "bridge_commit=$candidate" >> "$GITHUB_OUTPUT"
            /bin/rm -f "$askpass"
            trap - EXIT
            exit 0
          fi
          if [ "$observed_channel" != "$EXPECTED_CHANNEL_COMMIT" ]; then
            echo "::error::Smarty channel moved from ${EXPECTED_CHANNEL_COMMIT:-<absent>} to ${observed_channel:-<absent>}"
            exit 1
          fi
          if [ "$observed_authorization" != "$EXPECTED_AUTHORIZATION_REF" ]; then
            echo "::error::Smarty authorization moved from $EXPECTED_AUTHORIZATION_REF to ${observed_authorization:-<absent>}"
            exit 1
          fi
          if [ "$observed_promotion_authorization" != "$EXPECTED_CHANNEL_COMMIT" ]; then
            echo "::error::Smarty promotion authorization is not aligned with the prior channel state"
            exit 1
          fi
          if [ -n "$EXPECTED_CHANNEL_COMMIT" ]; then
            /usr/bin/git -C channel-repo cat-file blob "$EXPECTED_CHANNEL_COMMIT:preview.json" \
              | /usr/bin/cmp -s - channel/previous-preview.json
          fi
          git_auth -C channel-repo push --atomic \
            "--force-with-lease=$channel_ref:$EXPECTED_CHANNEL_COMMIT" \
            "--force-with-lease=$authorization_ref:$EXPECTED_AUTHORIZATION_REF" \
            "--force-with-lease=$promotion_authorization_ref:$EXPECTED_CHANNEL_COMMIT" \
            "$remote" "$candidate:$channel_ref" "$candidate:$authorization_ref" \
            "$promotion_lease:$promotion_authorization_ref"
          echo "phase=bridge" >> "$GITHUB_OUTPUT"
          echo "bridge_commit=$candidate" >> "$GITHUB_OUTPUT"
          echo "Phase A published Windows bootstrap bridge $candidate; Phase B requires protected-environment approval"
          /bin/rm -f "$askpass"
          trap - EXIT

  promote-canonical:
    needs: [preflight, advance-channel]
    if: >-
      always() &&
      needs.advance-channel.result == 'success' &&
      needs.advance-channel.outputs.phase != 'canonical'
    uses: ./.github/workflows/smarty-preview-promote.yml
    with:
      tag: ${{ needs.preflight.outputs.tag }}
      bridge_commit: ${{ needs.advance-channel.outputs.bridge_commit }}
