merge_queue:
  mode: serial
  max_parallel_checks: 2
  reset_on_external_merge: always

queue_rules:
  - name: default
    batch_size: 1
    checks_timeout: 30 min
    merge_method: merge
    queue_conditions:
      - base ~= ^(master|smarty-preview-source)$
      - -draft
      - check-success = smarty-review
      - check-success = smarty-land-ready
      - check-success = smarty-ci
    merge_conditions:
      - check-success = smarty-ci
