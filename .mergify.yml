# Follow smarty-dev's .mergify.yml auto-queue pattern for ready PRs.
# `hold` is the opt-out; every queue keeps the same required checks.
merge_protections_settings:
  auto_merge_conditions: true

merge_queue:
  mode: serial
  max_parallel_checks: 2
  reset_on_external_merge: always

# smarty-dev's plain rule (smarty-dev#865): the PR, its required checks and this queue are the
# review. Mergify queues a ready PR once queue_conditions pass; `hold` and DO NOT LAND
# titles keep a PR out.
queue_rules:
  - name: default
    batch_size: 4
    batch_max_wait_time: 2 min
    # ponytail: above the fleet CI-wait p95 (151 min, 10-09); a lower value dequeued green PRs mid-run (smarty-dev#8527). Lower once queue-draft p95 < 60 min.
    checks_timeout: 180 min
    merge_method: merge
    # The push check (scripts/conventional_commits.py) reads every new subject on master, the merge commit's
    # too; the PR title passed the same check on the PR, so it becomes the merge subject (smarty-dev#931).
    commit_message_format:
      title: pr-title
      body: empty
    queue_conditions:
      - -label ~= (?i)^(hold|do[ -]?not[ -]?merge|dnm|freeze|frozen)$
      - -label ~= (?i)^(wip|work[ -]?in[ -]?progress|do[ -]?not[ -]?land|never[ -]?land)$
      - base ~= ^(master|smarty-preview-source)$
      - -draft
      - -label = hold
      - -title ~= (?i)do not land
      - check-success = review/astra
      # A PR that needs a named security pass waits for review/security, which herdr-security-astra posts on
      # the exact head (smarty-dev#806, #855); so does an upstream sync (smarty-dev#755).
      - or:
          - -label = needs-security-pass
          - check-success = review/security
      - or:
          - -head ~= ^sync/upstream-
          - check-success = review/security
      - check-success = smarty-ci
      - -check-failure = smarty-ci
    merge_conditions:
      # Label and title opt-outs added after queueing stop the merge.
      # Review statuses here only refuse a FAILED review: an in-place or batch update
      # makes a new head with no review statuses (smarty-dev#455).
      # queue_conditions require the reviews on the reviewed head.
      - base ~= ^(master|smarty-preview-source)$
      - -title ~= (?i)do not land
      - -check-failure = review/astra
      - -label ~= (?i)^(hold|do[ -]?not[ -]?merge|dnm|freeze|frozen)$
      - -label ~= (?i)^(wip|work[ -]?in[ -]?progress|do[ -]?not[ -]?land|never[ -]?land)$
      - -label = hold
      - -check-failure = review/security
      - check-success = smarty-ci
      - -check-failure = smarty-ci

# The fleet's write App bot may queue (smarty-dev#735, #736): GitHub reports App bots as permission
# none, so the default `sender-permission >= write` restriction refused its queue commands.
commands_restrictions:
  queue:
    conditions:
      - or:
          - sender-permission >= write
          - sender = smarty-fleet-write[bot]
          - sender = smarty-fleet-write-leads[bot]
          - sender = smarty-fleet-write-lanes[bot]
          - sender = smarty-fleet-write-versehq[bot]
  # The same allowance for `requeue` (smarty-dev#7327): without it Mergify refuses a fleet bot's requeue
  # ('Command disallowed'), and a dequeued PR sits until someone notices (k3#958, ~18.5 h on 10-08).
  requeue:
    conditions:
      - or:
          - sender-permission >= write
          - sender = smarty-fleet-write[bot]
          - sender = smarty-fleet-write-leads[bot]
          - sender = smarty-fleet-write-lanes[bot]
          - sender = smarty-fleet-write-versehq[bot]
  # The stuck-work check's R4 posts `@mergifyio refresh` as the write App (smarty-dev#868, #983).
  refresh:
    conditions:
      - or:
          - sender-permission >= write
          - sender = smarty-fleet-write[bot]
          - sender = smarty-fleet-write-leads[bot]
          - sender = smarty-fleet-write-lanes[bot]
          - sender = smarty-fleet-write-versehq[bot]

# Sanctioned front-of-queue route, as smarty-dev (#2004 T10; org for Paul 2026-10-02): a PR labelled p0 is
# checked ahead of the rest of the queue.
priority_rules:
  - name: p0
    conditions:
      - label = p0
    priority: high
    # Priority must not discard in-flight CI (smarty-dev decision #2143, proven #2356).
    allow_checks_interruption: false
